<!-- The landing page: a short hero, then a tab for each part, each its minute of video with its words
     beside it. The call to action sits in the hero and the band. -->
<div class="frame story story-b">

<section class="hero-b" aria-labelledby="hero-title">
  <div class="card intro">
    <h1 id="hero-title">{{ copy:hero-title }}</h1>
    {{ copy:hero-lead }}
  </div>
  <div class="card begin">
    <span class="label">Start in your repository</span>
    {{ copy:install }}
    {{ copy:hero-actions }}
  </div>
</section>

<section class="card theatre" aria-label="What nock does">
  <div class="tablist" role="tablist" aria-label="The parts" data-tabs-for="films">
    <button type="button" role="tab" data-tab="reflection" aria-selected="true">{{ copy:reflection-label }}</button>
    <button type="button" role="tab" data-tab="review" aria-selected="false">{{ copy:review-label }}</button>
    <button type="button" role="tab" data-tab="evaluation" aria-selected="false">{{ copy:evaluation-label }}</button>
  </div>
  <div class="films">
    <figure class="film" data-panel="reflection" data-panel-for="films" id="reflection">
      <figcaption>
        <h2>{{ copy:reflection-title }}</h2>
        {{ copy:reflection-copy }}
      </figcaption>
      <div class="screen">
        <video controls muted playsinline preload="none" poster="/videos/reflection.jpg" width="1920" height="1080" aria-label="Your agents build the tools they need: a minute on reflection rounds">
          <source src="/videos/reflection.webm" type="video/webm">
          <source src="/videos/reflection.mp4" type="video/mp4">
          <track kind="captions" src="/videos/reflection.vtt" srclang="en" label="English">
        </video>
      </div>
    </figure>
    <figure class="film" data-panel="review" data-panel-for="films" id="review">
      <figcaption>
        <h2>{{ copy:review-title }}</h2>
        {{ copy:review-copy }}
      </figcaption>
      <div class="screen">
        <video controls muted playsinline preload="none" poster="/videos/review.jpg" width="1920" height="1080" aria-label="You decide, when it suits you: a minute on reviewing in the studio">
          <source src="/videos/review.webm" type="video/webm">
          <source src="/videos/review.mp4" type="video/mp4">
          <track kind="captions" src="/videos/review.vtt" srclang="en" label="English">
        </video>
      </div>
    </figure>
    <figure class="film" data-panel="evaluation" data-panel-for="films" id="evaluation">
      <figcaption>
        <h2>{{ copy:evaluation-title }}</h2>
        {{ copy:evaluation-copy }}
      </figcaption>
      <div class="screen">
        <video controls muted playsinline preload="none" poster="/videos/evaluation.jpg" width="1920" height="1080" aria-label="Choose the best way forward, from real runs: a minute on evaluations">
          <source src="/videos/evaluation.webm" type="video/webm">
          <source src="/videos/evaluation.mp4" type="video/mp4">
          <track kind="captions" src="/videos/evaluation.vtt" srclang="en" label="English">
        </video>
      </div>
    </figure>
  </div>
</section>

<section class="card logika wide" id="logika" aria-labelledby="logika-title">
  <div>
    <span class="label">{{ copy:logika-label }}</span>
    <h2 id="logika-title">{{ copy:logika-title }}</h2>
    {{ copy:logika-copy }}
  </div>
  <a class="art" href="{{ logika }}" tabindex="-1" aria-hidden="true">
    <picture>
      <source srcset="/logika.webp" type="image/webp">
      <img src="/logika.png" alt="" width="800" height="420" loading="lazy" decoding="async">
    </picture>
  </a>
</section>

<section class="card community wide" id="community" aria-labelledby="community-title">
  <div>
    <span class="label">Community</span>
    <h2 id="community-title">{{ copy:community-title }}</h2>
  </div>
  <div>
    {{ copy:community-copy }}
    {{ copy:community-actions }}
  </div>
</section>

</div>
