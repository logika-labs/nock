<!-- Layout A: Getting started as a column of steps, each its words beside its picture. -->
<div class="frame story story-a start">
<section class="card hero" aria-labelledby="start-title">
  <span class="label">Getting started</span>
  <h1 id="start-title">{{ copy:start-title }}</h1>
  {{ copy:start-lead }}
  {{ copy:install }}
</section>
<ol class="steps" id="steps">
{{ copy:start-steps }}
</ol>
<section class="card prose next">{{ copy:start-next }}</section>
</div>
