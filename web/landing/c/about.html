<!-- Layout C: About in two columns: a rail of its sections, sticky, marking the one in view, and the
     words scrolling beside it; the call to action in the bar at the foot. -->
<div class="frame story story-c about">
<section class="card hero hero-c" aria-labelledby="about-title">
  <span class="label">About</span>
  <h1 id="about-title">{{ copy:about-title }}</h1>
  {{ copy:about-lead }}
</section>
<div class="split">
  <nav class="card rail-nav" aria-label="On this page" data-rail>
    <span class="label">On this page</span>
    <a href="#why-it-exists">Why it exists</a>
    <a href="#three-principles">Three principles</a>
    <a href="#where-you-come-in">Where you come in</a>
    <a href="#who-makes-it">Who makes it</a>
  </nav>
  <div class="beats-column">
    <section class="card prose" id="why-it-exists">{{ copy:about-problem }}</section>
    <section class="card prose" id="three-principles">{{ copy:about-principles }}</section>
    <section class="card prose" id="where-you-come-in">{{ copy:about-you }}</section>
    <section class="card prose" id="who-makes-it">{{ copy:about-makers }}{{ copy:about-actions }}</section>
  </div>
</div>
</div>
{{ copy:dock }}
