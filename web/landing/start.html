<!-- Getting started as a stepper: the steps as tabs, one shown at a time with its picture. -->
<div class="frame story story-b start">
<section class="card intro wide-intro" aria-labelledby="start-title">
  <span class="label">Getting started</span>
  <h1 id="start-title">{{ copy:start-title }}</h1>
  {{ copy:start-lead }}
</section>
<section class="card stepper-card" aria-label="The steps">
  <div class="rail" role="tablist" aria-label="Steps" data-stepper-rail="steps"></div>
  <ol class="steps" id="steps" data-stepper>
{{ copy:start-steps }}
  </ol>
  <div class="stepper-pager" data-stepper-pager data-at="0">
    <button type="button" class="button" data-step-back><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3.5M7.5 3.5 3 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <span class="where label"></span>
    <button type="button" class="button primary" data-step-next>Next step<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9.5M8.5 3.5 13 8l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</section>
<section class="card prose next">{{ copy:start-next }}</section>
</div>
