<div class="frame review" id="review">
  <div class="controls">
    <div class="head">
      <nav class="reviews" role="tablist" aria-label="Which items" id="review-verdicts">
        <button type="button" role="tab" data-item-verdict="all" aria-selected="true">all <span class="count" id="review-count-all"></span></button>
        <button type="button" role="tab" data-item-verdict="unreviewed" aria-selected="false">to review <span class="count" id="review-count-unreviewed"></span></button>
        <button type="button" role="tab" data-item-verdict="approved" aria-selected="false">approved <span class="count" id="review-count-approved"></span></button>
        <button type="button" role="tab" data-item-verdict="rejected" aria-selected="false">rejected <span class="count" id="review-count-rejected"></span></button>
      </nav>
      <div class="layout" role="group" aria-label="Layout">
        <button type="button" data-item-layout="grid" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg>grid</button>
        <button type="button" data-item-layout="list" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 2.5h3v3H2zM6.5 3h7.5v2H6.5zM2 6.5h3v3H2zM6.5 7h7.5v2H6.5zM2 10.5h3v3H2zM6.5 11h7.5v2H6.5z"/></svg>list</button>
      </div>
    </div>
    <div class="tools">
      <label class="search" for="review-search">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.75" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="search" id="review-search" placeholder="search by key or title" autocomplete="off" aria-label="Search the items">
      </label>
    </div>
    <div class="tags" id="review-tag-row"><div class="chips" id="review-tags" role="group" aria-label="Tags"></div></div>
  </div>
  <main><section id="review-list" class="grid" aria-live="polite"></section></main>
  <div class="review-viewer" id="review-viewer" role="dialog" aria-modal="true" aria-labelledby="review-viewer-title" hidden>
    <div class="window">
      <header id="review-viewer-head"></header>
      <div class="viewer-body">
        <div class="stage" id="review-stage"></div>
        <aside>
          <div id="review-about"></div>
          <div class="section">
            <span class="label" id="review-note-label">Your note</span>
            <textarea id="review-note" rows="1" aria-labelledby="review-note-label" placeholder="What should change? Regenerate takes it into account."></textarea>
          </div>
          <div class="buttons" id="review-buttons">
            <button type="button" class="button secondary" data-item-act="rejected">Reject <kbd>r</kbd></button>
            <button type="button" class="button primary" data-item-act="approved">Approve <kbd>a</kbd></button>
            <button type="button" class="button ghost" data-item-act="note">Note <kbd>n</kbd></button>
            <button type="button" class="button ghost" data-item-act="regenerate">Regenerate <kbd>g</kbd></button>
          </div>
          <p class="hint error" id="review-problem" hidden></p>
          <div class="keys"><kbd>←</kbd> <kbd>→</kbd> between items · <kbd>c</kbd> compare · <kbd>esc</kbd> back · in the note, <kbd id="review-mod">⌘</kbd> <kbd>↵</kbd> saves it</div>
        </aside>
      </div>
    </div>
  </div>
</div>
<script>
// The review tab (its look is pages/review.css): `GET review` every item with all its versions,
// polled while shown; a version's files come from `review/file/KEY/VERSION/NAME`. The viewer shows
// one version or, comparing, two (a text's as a line diff, written here: an LCS over lines, then
// over the words of a changed line); the owner's word goes to `POST items/review`, and Regenerate
// to `POST items/regenerate`, after which the next version shows up on a later poll.
(() => {
  const $ = id => document.getElementById(id);
  const escape = text => String(text ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  const POLL = 3000;
  const VERDICTS = ["unreviewed", "approved", "rejected"];
  const WORDS = { unreviewed: "to review", approved: "approved", rejected: "rejected" };
  const TONE = { unreviewed: "", approved: "ok", rejected: "error" };
  const CHEVRON = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const SIGNS = {
    pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2.5h8l4.5 4.5v14.5H6z"/><path d="M14 2.5V7h4.5"/><path d="M8.5 13h7M8.5 16h7M8.5 10h3"/></svg>',
    video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>',
  };
  const state = {
    shown: false, seen: "", items: [], tags: {}, regenerating: {},
    verdict: "all", tags_chosen: new Set(), search: "", layout: "grid",
    open: null, compare: false, single: null, left: null, right: null, file: null, zoom: "fit",
    notes: new Map(), latest: new Map(), picker: null, link: null,
  };
  try { state.layout = localStorage.getItem("nock.review.layout") || "grid"; } catch { /* storage refused: the grid */ }
  $("review-mod").textContent = MAC ? "⌘" : "Ctrl";

  // --- time -------------------------------------------------------------------------------------

  const RELATIVE = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
  const UNITS = [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]];
  function ago(moment) {
    const seconds = (new Date(moment).getTime() - Date.now()) / 1000;
    if (Math.abs(seconds) < 45) return "just now";
    for (const [unit, size] of UNITS) if (Math.abs(seconds) >= size || unit === "minute") return RELATIVE.format(Math.round(seconds / size), unit);
  }
  const time = moment => moment ? `<time datetime="${escape(moment)}" title="${escape(new Date(moment).toLocaleString())}">${escape(ago(moment))}</time>` : "";

  // --- the items ---------------------------------------------------------------------------------

  const find = key => state.items.find(item => item.key === key);
  const last = item => item.versions[item.versions.length - 1];
  const version = (item, number) => item.versions.find(edition => edition.version === number) || last(item);
  const url = (item, edition, name) => `review/file/${item.key.split("/").map(encodeURIComponent).join("/")}/${edition.version}/${encodeURIComponent(name)}`;
  const texts = new Map();
  function text(address) {
    if (!texts.has(address)) texts.set(address, fetch(address).then(response => response.ok ? response.text() : Promise.reject(new Error("gone"))));
    return texts.get(address);
  }

  function matches(item) {
    const latest = last(item);
    if (state.verdict !== "all" && latest.verdict !== state.verdict) return false;
    if (state.tags_chosen.size && ![...state.tags_chosen].every(tag => latest.tags.includes(tag))) return false;
    const words = state.search.toLowerCase().split(/\s+/).filter(Boolean);
    const said = `${item.key} ${latest.title}`.toLowerCase();
    return words.every(word => said.includes(word));
  }
  const visible = () => state.items.filter(matches);

  function thumb(item) {
    const latest = last(item);
    const first = latest.files[0];
    const address = url(item, latest, first.name);
    const more = latest.files.length > 1 ? `<span class="more">+${latest.files.length - 1}</span>` : "";
    let inner = "";
    if (first.kind === "image") inner = `<img src="${address}" alt="" loading="lazy">`;
    else if (first.kind === "video") inner = `<video src="${address}#t=0.1" muted preload="metadata" playsinline></video>`;
    else if (first.kind === "html") inner = `<iframe src="${address}" sandbox="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>`;
    else if (first.kind === "text") inner = `<pre data-text="${address}" data-own></pre>`;
    else inner = `<span class="sign">${SIGNS[first.kind] || SIGNS.pdf}${escape(first.name)}</span>`;
    return `<span class="thumb">${inner}<span class="kind">${escape(first.kind)}</span>${more}</span>`;
  }

  function badges(item) {
    const latest = last(item);
    const kinds = [...new Set(latest.files.map(file => file.kind))].join(" + ");
    const found = [`<span class="badge kind-badge">${escape(kinds)}</span>`, `<span class="badge">v${latest.version}</span>`];
    if (state.regenerating[item.key] && !state.regenerating[item.key].problem) found.push('<span class="badge info spin"><span class="spinner" aria-hidden="true"></span>making</span>');
    else if (state.regenerating[item.key]) found.push('<span class="badge error">regeneration failed</span>');
    found.push(`<span class="badge ${TONE[latest.verdict]}">${WORDS[latest.verdict]}</span>`);
    if (latest.feedback && latest.verdict === "unreviewed") found.push('<span class="badge warning">noted</span>');
    return found.join("");
  }

  // A text's content, fetched once per address: a poll that keeps the address keeps the text, and
  // a new address shows the old text until the new one is in.
  function fill(scope) {
    for (const pre of scope.querySelectorAll("pre[data-text]")) {
      const address = pre.dataset.text;
      if (pre.filled === address) continue;
      pre.filled = address;
      const whole = !pre.closest(".thumb");
      text(address).then(content => { if (pre.filled === address) pre.textContent = whole ? content : content.slice(0, 1200); })
        .catch(() => { if (whole && pre.filled === address) pre.textContent = "This file could not be read."; });
    }
  }

  function card(item) {
    const latest = last(item);
    return `<button type="button" class="card" data-key="${escape(item.key)}" data-item-open="${escape(item.key)}"${matches(item) ? "" : " hidden"}>
        ${thumb(item)}
        <span class="meta"><span class="title">${escape(latest.title)}</span><span class="key">${escape(item.key)}</span>
        <span class="badges">${badges(item)}${time(latest.recorded.moment)}</span></span>
      </button>`;
  }

  function drawList() {
    const counts = { all: state.items.length, unreviewed: 0, approved: 0, rejected: 0 };
    for (const item of state.items) counts[last(item).verdict]++;
    for (const key of Object.keys(counts)) $(`review-count-${key}`).textContent = counts[key] || "";
    for (const tab of document.querySelectorAll("[data-item-verdict]")) tab.setAttribute("aria-selected", String(tab.dataset.itemVerdict === state.verdict));
    for (const button of document.querySelectorAll("[data-item-layout]")) button.setAttribute("aria-pressed", String(button.dataset.itemLayout === state.layout));
    const remake = state.items.filter(item => last(item).verdict === "rejected" || (last(item).verdict === "unreviewed" && last(item).feedback)).length;
    const making = Object.values(state.regenerating).filter(entry => !entry.problem).length;
    const said = [counts.unreviewed ? `${counts.unreviewed} to review` : "", remake ? `${remake} to make again` : "", making ? `${making} being made` : ""].filter(Boolean);
    studio.summary("review", state.items.length ? (said.join(" · ") || "nothing waits on you") : "nothing to review yet");
    const tags = Object.entries(state.tags).map(([tag]) => tag);
    for (const tag of state.tags_chosen) if (!tags.includes(tag)) tags.push(tag);
    const pool = state.items.filter(item => state.verdict === "all" || last(item).verdict === state.verdict);
    studio.morph($("review-tags"), tags.map(tag => {
      const count = pool.filter(item => last(item).tags.includes(tag)).length;
      const chosen = state.tags_chosen.has(tag);
      return `<button type="button" class="chip" data-key="${escape(tag)}" data-item-tag="${escape(tag)}" aria-pressed="${chosen}" ${count === 0 && !chosen ? "disabled" : ""}>${escape(tag)} <span class="count">${count}</span></button>`;
    }).join(""));
    $("review-tag-row").hidden = !tags.length;
    const list = $("review-list");
    list.className = state.layout;
    // Every card stays drawn, those the filters leave out hidden: a card is never made again, so
    // its picture, page or video loads once, and again only when its latest version changes.
    const filtered = state.search.trim() || state.tags_chosen.size || state.verdict !== "all";
    const empty = visible().length ? "" : `<div class="empty" data-key="empty">${filtered
      ? "<strong>No matches</strong><span>No item fits the search and filters.</span>"
      : "<strong>Nothing to review yet</strong><span>Agents show you what they made with <code>.nock/nock review add</code>; it appears here.</span>"}</div>`;
    studio.morph(list, state.items.map(card).join("") + empty);
    fill(list);
  }

  // --- the diff -----------------------------------------------------------------------------------

  // The longest common subsequence of two lists, as steps: equal, removed (from the left), added.
  function steps(before, after) {
    let start = 0;
    while (start < before.length && start < after.length && before[start] === after[start]) start++;
    let end = 0;
    while (end < before.length - start && end < after.length - start && before[before.length - 1 - end] === after[after.length - 1 - end]) end++;
    const left = before.slice(start, before.length - end), right = after.slice(start, after.length - end);
    const head = before.slice(0, start).map(value => ["equal", value, value]);
    const tail = before.slice(before.length - end).map(value => ["equal", value, value]);
    const n = left.length, m = right.length;
    const middle = [];
    if (n * m > 4_000_000) {
      for (const value of left) middle.push(["removed", value, null]);
      for (const value of right) middle.push(["added", null, value]);
      return [...head, ...middle, ...tail];
    }
    const table = new Uint32Array((n + 1) * (m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
      table[i * (m + 1) + j] = left[i] === right[j] ? table[(i + 1) * (m + 1) + j + 1] + 1 : Math.max(table[(i + 1) * (m + 1) + j], table[i * (m + 1) + j + 1]);
    }
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (left[i] === right[j]) { middle.push(["equal", left[i], right[j]]); i++; j++; }
      else if (table[(i + 1) * (m + 1) + j] >= table[i * (m + 1) + j + 1]) middle.push(["removed", left[i++], null]);
      else middle.push(["added", null, right[j++]]);
    }
    while (i < n) middle.push(["removed", left[i++], null]);
    while (j < m) middle.push(["added", null, right[j++]]);
    return [...head, ...middle, ...tail];
  }

  // A changed line's words: what went marked on the left, what came marked on the right.
  function words(before, after) {
    const split = line => line.match(/\s+|[\p{L}\p{N}_]+|[^\s\p{L}\p{N}_]/gu) || [];
    const marked = { before: "", after: "" };
    for (const [kind, left, right] of steps(split(before), split(after))) {
      if (kind === "equal") { marked.before += escape(left); marked.after += escape(right); }
      else if (kind === "removed") marked.before += /^\s+$/.test(left) ? escape(left) : `<del>${escape(left)}</del>`;
      else marked.after += /^\s+$/.test(right) ? escape(right) : `<ins>${escape(right)}</ins>`;
    }
    // Neighbouring marks read as one, the space between them included.
    marked.before = marked.before.replace(/<\/del>(\s+)<del>/g, "$1");
    marked.after = marked.after.replace(/<\/ins>(\s+)<ins>/g, "$1");
    return marked;
  }

  // The rows side by side: a run of removed lines next to a run of added ones pairs up as changed
  // lines; long unchanged stretches fold, leaving three lines of context around each change.
  function rows(before, after) {
    const found = [];
    const walked = steps(before.split("\n"), after.split("\n"));
    let numberBefore = 0, numberAfter = 0;
    for (let index = 0; index < walked.length;) {
      if (walked[index][0] === "equal") {
        found.push({ kind: "equal", before: walked[index][1], after: walked[index][2], left: ++numberBefore, right: ++numberAfter });
        index++;
        continue;
      }
      const removed = [], added = [];
      while (index < walked.length && walked[index][0] !== "equal") {
        if (walked[index][0] === "removed") removed.push(walked[index][1]); else added.push(walked[index][2]);
        index++;
      }
      // A blank line is never another line changed: it goes, or comes, on its own.
      for (let k = 0; k < Math.max(removed.length, added.length); k++) {
        const before = removed[k], after = added[k];
        if (before?.trim() && after?.trim()) { found.push({ kind: "changed", before, after, left: ++numberBefore, right: ++numberAfter }); continue; }
        if (before !== undefined) found.push({ kind: "removed", before, after: null, left: ++numberBefore, right: null });
        if (after !== undefined) found.push({ kind: "added", before: null, after, left: null, right: ++numberAfter });
      }
    }
    return found;
  }

  function diff(before, after) {
    const found = rows(before, after);
    const near = found.map((row, index) => row.kind !== "equal" || found.slice(Math.max(0, index - 3), index + 4).some(other => other.kind !== "equal"));
    const tally = { added: 0, removed: 0, changed: 0 };
    for (const row of found) if (row.kind !== "equal") tally[row.kind]++;
    let html = "", folded = 0;
    const fold = () => { if (folded) html += `<tr class="fold"><td colspan="4">${folded} unchanged ${folded === 1 ? "line" : "lines"}</td></tr>`; folded = 0; };
    found.forEach((row, index) => {
      if (!near[index] && found.length > 40) { folded++; return; }
      fold();
      let left = row.before === null ? "" : escape(row.before), right = row.after === null ? "" : escape(row.after);
      if (row.kind === "changed") ({ before: left, after: right } = words(row.before, row.after));
      html += `<tr class="${row.kind}"><td class="number before">${row.left ?? ""}</td><td class="before">${left}</td><td class="number after after-side">${row.right ?? ""}</td><td class="after">${right}</td></tr>`;
    });
    fold();
    return {
      tally,
      html: `<table class="diff"><colgroup><col class="number"><col><col class="number"><col></colgroup><tbody>${html}</tbody></table>`,
    };
  }

  // --- the viewer ---------------------------------------------------------------------------------

  // Which versions are shown: one (the latest unless picked), or two (the last two unless picked).
  function chosen(item) {
    const numbers = item.versions.map(edition => edition.version);
    if (!state.compare) return [state.single && numbers.includes(state.single) ? state.single : numbers[numbers.length - 1]];
    const right = state.right && numbers.includes(state.right) ? state.right : numbers[numbers.length - 1];
    const left = state.left && numbers.includes(state.left) ? state.left : numbers[Math.max(0, numbers.length - 2)];
    return [left, right];
  }

  function picker(item, side, number) {
    const latest = last(item).version;
    const edition = version(item, number);
    const options = [...item.versions].reverse().map(entry => `<li role="option" id="review-option-${side}-${entry.version}" data-version="${entry.version}" aria-selected="${entry.version === number}">
        <span class="number">v${entry.version}</span>${entry.version === latest ? '<span class="badge">latest</span>' : ""}<span class="badge ${TONE[entry.verdict]}">${WORDS[entry.verdict]}</span>${time(entry.recorded.moment)}</li>`).join("");
    return `<div class="picker" data-picker="${side}">
      <button type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Version">v${edition.version} <span class="quiet">${edition.version === latest ? "latest" : `of ${latest}`}</span>${CHEVRON}</button>
      <ul role="listbox" tabindex="-1" aria-label="Versions" hidden>${options}</ul>
    </div>`;
  }

  function names(item, numbers) {
    const found = [];
    for (const number of numbers) for (const file of version(item, number).files) if (!found.includes(file.name)) found.push(file.name);
    return found;
  }

  function fileOf(item, number) {
    const edition = version(item, number);
    return edition.files.find(file => file.name === state.file) || edition.files[0];
  }

  function pane(item, number) {
    const edition = version(item, number);
    const file = fileOf(item, number);
    if (state.file && file.name !== state.file) return `<div class="pane"><p class="missing">Version ${edition.version} has no ${escape(state.file)}.</p></div>`;
    const address = url(item, edition, file.name);
    if (file.kind === "image") {
      const zoomed = state.zoom !== "fit";
      return `<div class="pane ${zoomed ? "zoomed" : "fit"}"><img data-key="${address}" src="${address}" alt="${escape(edition.title)}, version ${edition.version}" data-zoom-image ${zoomed ? `data-scale="${state.zoom}"` : ""}></div>`;
    }
    if (file.kind === "video") return `<div class="pane fit"><video data-key="${address}" src="${address}" controls preload="metadata" playsinline></video></div>`;
    if (file.kind === "pdf") return `<div class="pane"><iframe data-key="${address}" src="${address}" title="${escape(file.name)}"></iframe></div>`;
    if (file.kind === "html") return `<div class="pane"><iframe data-key="${address}" src="${address}" sandbox="" title="${escape(file.name)}"></iframe></div>`;
    return `<div class="pane"><pre class="text" data-key="${address}" data-text="${address}" data-own>…</pre></div>`;
  }

  function drawStage(item) {
    const numbers = chosen(item);
    const files = names(item, numbers);
    const kinds = numbers.map(number => fileOf(item, number).kind);
    const fileTabs = files.length > 1 ? `<div class="files" role="group" aria-label="Files">${files.map(name => `<button type="button" class="chip" data-key="${escape(name)}" data-item-file="${escape(name)}" aria-pressed="${name === (state.file || fileOf(item, numbers[numbers.length - 1]).name)}">${escape(name)}</button>`).join("")}</div>` : "";
    const zoom = kinds.includes("image") ? `<div class="zoom" role="group" aria-label="Zoom">
      <button type="button" class="chip" data-item-zoom="fit" aria-pressed="${state.zoom === "fit"}">fit</button>
      <button type="button" class="chip" data-item-zoom="1" aria-pressed="${state.zoom === 1}">1:1</button>
      <button type="button" class="chip" data-item-zoom="out" aria-label="Zoom out">−</button>
      <button type="button" class="chip" data-item-zoom="in" aria-label="Zoom in">+</button></div>` : "";
    const textual = state.compare && kinds.every(kind => kind === "text");
    let bar;
    if (state.compare) {
      bar = `<div class="sides">
        <div class="side-head"><span class="label">before</span>${picker(item, "left", numbers[0])}</div>
        <div class="side-head"><span class="label">after</span>${picker(item, "right", numbers[1])}<span class="grow"></span>${textual ? '<span class="tally" id="review-tally" data-own></span>' : ""}</div>
      </div>${fileTabs}<span class="grow"></span>${zoom}`;
    } else {
      bar = `${picker(item, "single", numbers[0])}${fileTabs}<span class="grow"></span>${zoom}`;
    }
    const addresses = numbers.map(number => url(item, version(item, number), fileOf(item, number).name));
    const panes = textual
      ? `<div class="panes"><div class="pane" id="review-diff" data-own data-pair="${escape(addresses.join(" "))}"><p class="missing">…</p></div></div>`
      : `<div class="panes ${numbers.length === 2 ? "two" : ""}">${numbers.map(number => pane(item, number)).join("")}</div>`;
    const stage = $("review-stage");
    studio.morph(stage, `<div class="bar">${bar}</div>${panes}`);
    fill(stage);
    for (const image of stage.querySelectorAll("img[data-scale]")) {
      const size = () => { if (image.dataset.scale) image.style.width = `${image.naturalWidth * Number(image.dataset.scale)}px`; };
      if (image.complete) size(); else image.addEventListener("load", size, { once: true });
    }
    const place = $("review-diff");
    if (!place || place.filled === place.dataset.pair) return;
    const pair = place.filled = place.dataset.pair;
    Promise.all(addresses.map(text)).then(([left, right]) => {
      if (place.filled !== pair) return;
      const made = diff(left, right);
      place.innerHTML = made.html;
      const { added, removed, changed } = made.tally;
      const counted = [[added, "added", "+"], [removed, "removed", "−"], [changed, "changed", "~"]].filter(([count]) => count);
      const tally = $("review-tally");
      if (tally) tally.innerHTML = counted.length
        ? counted.map(([count, kind, sign]) => `<span class="badge ${kind}" title="${count} ${kind}">${sign}${count}</span>`).join("")
        : '<span class="badge">the same</span>';
    }).catch(() => { if (place.filled === pair) place.innerHTML = '<p class="missing">These files could not be read.</p>'; });
  }

  function drawHead(item) {
    const shown = visible();
    const index = shown.findIndex(edition => edition.key === item.key);
    const latest = last(item);
    const left = '<svg viewBox="0 0 16 16" fill="none"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const right = '<svg viewBox="0 0 16 16" fill="none"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const close = '<svg viewBox="0 0 16 16" fill="none"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    studio.morph($("review-viewer-head"), `
      <div class="where"><h2 id="review-viewer-title">${escape(latest.title)}</h2><span class="key">${escape(item.key)} · ${item.versions.length} ${item.versions.length === 1 ? "version" : "versions"}</span></div>
      <button type="button" class="toggle" data-item-compare aria-pressed="${state.compare}" ${item.versions.length < 2 ? "disabled" : ""}><span class="switch" aria-hidden="true"><span></span></span>Compare <kbd>c</kbd></button>
      <span class="steps"><button type="button" class="icon" data-item-step="-1" aria-label="Previous item" ${index <= 0 ? "disabled" : ""}>${left}</button>
      ${index >= 0 ? `${index + 1} of ${shown.length}` : ""}
      <button type="button" class="icon" data-item-step="1" aria-label="Next item" ${index < 0 || index >= shown.length - 1 ? "disabled" : ""}>${right}</button></span>
      <button type="button" class="icon" data-item-close aria-label="Close">${close}</button>`);
  }

  function drawAbout(item) {
    const numbers = chosen(item);
    const edition = version(item, numbers[numbers.length - 1]);
    const latest = last(item);
    const parts = [];
    const tags = edition.tags.map(tag => `<span class="badge">${escape(tag)}</span>`).join("");
    parts.push(`<div class="section"><span class="label">Version ${edition.version}${edition.version === latest.version ? ", the latest" : ""}</span>
      <div class="facts"><span class="badge ${TONE[edition.verdict]}">${WORDS[edition.verdict]}</span>${tags}</div>
      <p>Registered ${time(edition.recorded.moment)}${edition.recorded.role && edition.recorded.role !== "interactive" ? ` by the ${escape(edition.recorded.role)}` : ""}.</p></div>`);
    if (edition.regenerated) {
      parts.push(`<div class="section"><span class="label">Made again from version ${edition.regenerated.from}</span><p>${edition.regenerated.feedback ? `Answering your note: “${escape(edition.regenerated.feedback)}”` : "As the recipe says, with no note."}</p></div>`);
    }
    if (edition.note) parts.push(`<div class="section"><span class="label">What the agent says</span><p>${escape(edition.note)}</p></div>`);
    if (edition.decision) parts.push(`<div class="section"><span class="label">Illustrates</span><p><a href="#decisions/${edition.decision}">decision ${edition.decision}</a></p></div>`);
    if (edition.recipe) {
      const recipe = [edition.recipe.command ? `<p><code>${escape(edition.recipe.command)}</code></p>` : "", edition.recipe.instruction ? `<p>${escape(edition.recipe.instruction)}</p>` : ""].join("");
      parts.push(`<div class="section"><span class="label">How it is made</span>${recipe}</div>`);
    }
    if (latest.verdict !== "unreviewed") {
      parts.push(`<div class="panel ${latest.verdict === "approved" ? "ok" : "rejected"}"><span class="label">v${latest.version} ${latest.verdict} ${latest.reviewed ? time(latest.reviewed.moment) : ""}</span>${latest.feedback ? `<div>${escape(latest.feedback)}</div>` : ""}</div>`);
    } else if (latest.feedback) {
      parts.push(`<div class="panel agent"><span class="label">your note on v${latest.version}</span><div>${escape(latest.feedback)}</div></div>`);
    }
    const running = state.regenerating[item.key];
    if (running && !running.problem) {
      parts.push(`<div class="panel agent"><span class="label"><span class="spinner" aria-hidden="true"></span>making version ${running.from + 1}</span><div>Started ${time(running.since)}; it shows here when it is registered.</div></div>`);
    } else if (running) {
      parts.push(`<div class="panel problem"><span class="label">the regeneration failed</span><div>${escape(running.problem)}</div></div>`);
    }
    studio.morph($("review-about"), parts.join(""));
    const making = running && !running.problem;
    for (const button of $("review-buttons").querySelectorAll("button")) {
      const act = button.dataset.itemAct;
      button.disabled = making || (act === "regenerate" && !latest.recipe) || (act === latest.verdict);
      button.title = act === "regenerate" && !latest.recipe ? "No recipe: the agent that made it did not say how to make it again" : "";
    }
  }

  // The note being written, kept per item until it is saved: a version that arrives meanwhile
  // leaves it be. With nothing written, the field shows the latest version's note (none, for a new one).
  function note(item) {
    return state.notes.has(item.key) ? state.notes.get(item.key) : last(item).feedback ?? "";
  }

  function drawViewer() {
    const item = state.open && find(state.open);
    const viewer = $("review-viewer");
    if (!item) { viewer.hidden = true; return; }
    viewer.hidden = false;
    if (!state.picker) drawHead(item);
    if (!state.picker) drawStage(item);
    drawAbout(item);
    const field = $("review-note");
    if (document.activeElement !== field && field.value !== note(item)) field.value = note(item);
  }

  function draw() { drawList(); drawViewer(); }

  function open(key) {
    if (state.open !== key) {
      state.open = key;
      state.single = state.left = state.right = state.file = null;
      state.zoom = "fit";
      state.picker = null;
      $("review-problem").hidden = true;
    }
    const wanted = `#review/${key}`;
    if (decodeURIComponent(location.hash) !== wanted) history.replaceState(null, "", wanted);
    draw();
  }

  function close() {
    state.open = null;
    state.compare = false;
    state.picker = null;
    history.replaceState(null, "", "#review");
    draw();
    document.querySelector(".review .card")?.focus();
  }

  function step(offset) {
    const shown = visible();
    const index = shown.findIndex(item => item.key === state.open);
    const next = shown[index + offset];
    if (index >= 0 && next) open(next.key);
  }

  // --- the version picker: the design's dropdown -------------------------------------------------

  function openPicker(element) {
    closePicker();
    state.picker = element.dataset.picker;
    const button = element.querySelector("button");
    const list = element.querySelector("ul");
    button.setAttribute("aria-expanded", "true");
    list.hidden = false;
    const selected = list.querySelector('[aria-selected="true"]') || list.querySelector("li");
    activate(list, selected);
    list.focus();
  }
  function activate(list, option) {
    for (const other of list.querySelectorAll("li")) other.classList.toggle("active", other === option);
    if (option) { list.setAttribute("aria-activedescendant", option.id); option.scrollIntoView({ block: "nearest" }); }
  }
  function closePicker(focus) {
    const element = state.picker && document.querySelector(`#review-stage [data-picker="${state.picker}"]`);
    state.picker = null;
    if (!element) return;
    element.querySelector("ul").hidden = true;
    const button = element.querySelector("button");
    button.setAttribute("aria-expanded", "false");
    if (focus) button.focus();
  }
  function pick(side, number) {
    const item = find(state.open);
    closePicker();
    if (side === "single") state.single = number === last(item).version ? null : number;
    else state[side] = number;
    draw();
    document.querySelector(`#review-stage [data-picker="${side}"] button`)?.focus();
  }

  // --- the owner's word -------------------------------------------------------------------------

  async function post(path, body) {
    const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const answer = await response.json();
    if (!response.ok) throw new Error(answer.error);
    return answer;
  }

  async function act(action) {
    const item = find(state.open);
    if (!item) return;
    const latest = last(item);
    const running = state.regenerating[item.key];
    if (running && !running.problem) return;
    const button = $("review-buttons").querySelector(`[data-item-act="${action}"]`);
    if (button?.disabled) return;
    const written = ($("review-note").value || "").trim() || null;
    const word = written !== (latest.feedback || null) ? { feedback: written } : {};
    const problem = $("review-problem");
    problem.hidden = true;
    try {
      if (action === "regenerate") {
        await post("review/regenerate", { key: item.key, ...word });
        studio.toast(`Making version ${latest.version + 1} of ${item.key}…`);
      } else if (action === "note") {
        if (!("feedback" in word)) { $("review-note").focus(); return; }
        await post("review/judge", { key: item.key, ...word });
        studio.toast(`Saved your note on ${item.key}.`);
      } else {
        await post("review/judge", { key: item.key, verdict: action, ...word });
        studio.toast(`${item.key} v${latest.version} ${action}.`);
      }
    } catch (error) {
      problem.textContent = error.message;
      problem.hidden = false;
      return;
    }
    state.notes.delete(item.key);
    $("review-note").blur();
    state.seen = "";
    await load();
  }

  // --- loading ----------------------------------------------------------------------------------

  async function load() {
    try {
      const response = await fetch("review");
      const raw = await response.text();
      if (raw === state.seen) return;
      state.seen = raw;
      const data = JSON.parse(raw);
      for (const item of data.items) {
        const before = state.latest.get(item.key);
        const now = last(item).version;
        if (before && now > before && state.shown) studio.toast(`Version ${now} of ${item.key} arrived.`);
        state.latest.set(item.key, now);
      }
      state.items = data.items;
      state.tags = data.tags;
      state.regenerating = data.regenerating;
      if (state.link) { const key = state.link; state.link = null; if (find(key)) open(key); }
      if (state.open && !find(state.open)) close();
      draw();
    } catch {
      studio.summary("review", "Lost touch with nock — is `nock studio` still running?");
    }
  }

  // --- events -------------------------------------------------------------------------------------

  const root = $("review");
  root.addEventListener("click", event => {
    const target = event.target;
    const tab = target.closest("[data-item-verdict]");
    if (tab) { state.verdict = tab.dataset.itemVerdict; draw(); return; }
    const layout = target.closest("[data-item-layout]");
    if (layout) {
      state.layout = layout.dataset.itemLayout;
      try { localStorage.setItem("nock.review.layout", state.layout); } catch { /* not kept: fine */ }
      draw();
      return;
    }
    const tag = target.closest("[data-item-tag]");
    if (tag) { const value = tag.dataset.itemTag; state.tags_chosen.has(value) ? state.tags_chosen.delete(value) : state.tags_chosen.add(value); draw(); return; }
    const card = target.closest("[data-item-open]");
    if (card) { open(card.dataset.itemOpen); return; }
    if (target === $("review-viewer")) { close(); return; }
    if (target.closest("[data-item-close]")) { close(); return; }
    const stepper = target.closest("[data-item-step]");
    if (stepper) { step(Number(stepper.dataset.itemStep)); return; }
    if (target.closest("[data-item-compare]")) { toggleCompare(); return; }
    const option = target.closest(".picker li");
    if (option) { pick(option.closest("[data-picker]").dataset.picker, Number(option.dataset.version)); return; }
    const pickerButton = target.closest(".picker > button");
    if (pickerButton) {
      const element = pickerButton.parentElement;
      if (state.picker === element.dataset.picker) closePicker(true); else openPicker(element);
      return;
    }
    if (state.picker && !target.closest(".picker")) closePicker();
    const file = target.closest("[data-item-file]");
    if (file) { state.file = file.dataset.itemFile; draw(); return; }
    const zoom = target.closest("[data-item-zoom]");
    if (zoom) { setZoom(zoom.dataset.itemZoom); return; }
    if (target.closest("[data-zoom-image]")) { setZoom(state.zoom === "fit" ? "1" : "fit"); return; }
    const action = target.closest("[data-item-act]");
    if (action) act(action.dataset.itemAct);
  });

  function toggleCompare() {
    const item = find(state.open);
    if (!item || item.versions.length < 2) return;
    state.compare = !state.compare;
    state.left = state.right = null;
    draw();
  }

  const ZOOMS = [0.25, 0.5, 1, 1.5, 2, 3, 4];
  function setZoom(value) {
    if (value === "fit") state.zoom = "fit";
    else if (value === "in" || value === "out") {
      const now = state.zoom === "fit" ? 1 : state.zoom;
      const index = ZOOMS.indexOf(now);
      state.zoom = ZOOMS[Math.min(ZOOMS.length - 1, Math.max(0, index + (value === "in" ? 1 : -1)))];
    } else state.zoom = Number(value);
    draw();
  }

  root.addEventListener("input", event => {
    if (event.target.id === "review-search") { state.search = event.target.value; draw(); return; }
    if (event.target.id === "review-note" && state.open) state.notes.set(state.open, event.target.value);
  });

  document.addEventListener("keydown", event => {
    if (!state.shown) return;
    const target = event.target;
    if (state.picker) {
      const list = document.querySelector(`#review-stage [data-picker="${state.picker}"] ul`);
      if (!list) return;
      const options = [...list.querySelectorAll("li")];
      const index = options.findIndex(option => option.classList.contains("active"));
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        activate(list, options[Math.min(options.length - 1, Math.max(0, index + (event.key === "ArrowDown" ? 1 : -1)))]);
      } else if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        if (options[index]) pick(state.picker, Number(options[index].dataset.version));
      } else if (event.key === "Escape" || event.key === "Tab") {
        event.preventDefault();
        closePicker(true);
      }
      return;
    }
    if (!state.open) {
      if (event.key === "/" && !["TEXTAREA", "INPUT"].includes(target.tagName)) { event.preventDefault(); $("review-search").focus(); }
      return;
    }
    if (target.id === "review-note") {
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) { event.preventDefault(); act("note"); }
      else if (event.key === "Escape") { event.preventDefault(); target.blur(); }
      return;
    }
    if (["TEXTAREA", "INPUT"].includes(target.tagName) || event.metaKey || event.ctrlKey || event.altKey) return;
    const keys = {
      a: () => act("approved"), r: () => act("rejected"), g: () => act("regenerate"), c: toggleCompare,
      n: () => $("review-note").focus(),
      ArrowLeft: () => step(-1), ArrowRight: () => step(1), Escape: close,
      "+": () => setZoom("in"), "=": () => setZoom("in"), "-": () => setZoom("out"), "0": () => setZoom("fit"),
    };
    const run = keys[event.key];
    if (run) { event.preventDefault(); run(); }
  });

  // Shown, the tab keeps up with what agents register: it asks again every few seconds.
  studio.register("review", {
    show(route) {
      state.shown = true;
      if (route) { state.link = route; state.seen = ""; }
      else if (state.open) state.open = null;
      load();
    },
    hide() { state.shown = false; $("review-viewer").hidden = true; },
  });
  setInterval(() => { if (state.shown) load(); }, POLL);
})();
</script>
