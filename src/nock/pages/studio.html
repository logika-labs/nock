<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nock</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 25V11h5.2v2.2c1.2-1.7 3-2.6 5.3-2.6 3.8 0 5.5 2.4 5.5 6.3V25h-5.3v-7.3c0-1.9-.8-2.8-2.4-2.8-1.8 0-3.1 1.2-3.1 3.6V25z' fill='%23ff9ad5' transform='translate(-2 -2)'/%3E%3Cpath d='M8 25V11h5.2v2.2c1.2-1.7 3-2.6 5.3-2.6 3.8 0 5.5 2.4 5.5 6.3V25h-5.3v-7.3c0-1.9-.8-2.8-2.4-2.8-1.8 0-3.1 1.2-3.1 3.6V25z' fill='%238fe9ff' transform='translate(2 2)'/%3E%3Cpath d='M8 25V11h5.2v2.2c1.2-1.7 3-2.6 5.3-2.6 3.8 0 5.5 2.4 5.5 6.3V25h-5.3v-7.3c0-1.9-.8-2.8-2.4-2.8-1.8 0-3.1 1.2-3.1 3.6V25z' fill='%23111116'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Unbounded:wght@600;800&display=swap">
<style>
/* The studio's frame and its parts. Its look — tokens, surfaces, type, the field behind — is in
   pages/studio.css, put in below; the page's script is pages/app.js, put in at the end. */
:root {
  --background: #f4f4f6;
  --foreground: #16161c;
  --card: #ffffff;
  --muted: #5b5d68;
  --border: #dcdde3;
  --input: #c6c8d0;
  --hover: #f7f7f9;
  --selection: #16161c;
  --selection-foreground: #ffffff;
  --selection-tint: #ececf2;
  --ring: #16161c;
  --link: #4b3bd6;
  --ok: #1f7a44;
  --ok-tint: #e7f4ec;
  --warning: #a35f00;
  --error: #b0151b;
  --info: #1666a6;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --display: var(--sans);
  --column: 60rem;
  --radius: 12px;
  /* Every timestamp: one light gray. */
  --time: #9b9da7;
  /* Room left above whatever the page scrolls to. */
  --offset: max(96px, 16vh);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--background); color: var(--foreground); }
html { scroll-padding-top: var(--offset); }
body { margin: 0; font: 400 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; }
button:not(:disabled), label[for] { cursor: pointer; }
button { font: inherit; color: inherit; }
.frame {
  max-width: calc(var(--column) + 32px); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage { position: relative; z-index: 1; padding-bottom: 96px; }
.backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.sprites { position: absolute; width: 0; height: 0; overflow: hidden; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
<!-- nock:styles -->
</head>
<body>
<svg class="sprites" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="holo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="13" y2="9">
      <stop offset="0" stop-color="#ff9ad5"/><stop offset=".3" stop-color="#c3b2ff"/><stop offset=".55" stop-color="#8fe9ff"/><stop offset=".8" stop-color="#fff2a0"/><stop offset="1" stop-color="#ffb0d6"/>
    </linearGradient>
    <g id="mascot-shape">
      <rect x="3" y="0" width="7" height="1"/><rect x="2" y="1" width="9" height="6"/>
      <rect x="0" y="3" width="2" height="2"/><rect x="11" y="2" width="2" height="2"/>
      <rect x="3" y="7" width="1" height="2"/><rect x="5" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/><rect x="9" y="7" width="1" height="2"/>
    </g>
    <!-- nock's mascot: chunky black pixels with a foil rim, extruded in foil, with foil eyes. -->
    <symbol id="mascot" viewBox="-0.3 -0.3 14 10">
      <use href="#mascot-shape" transform="translate(.6 .6)" fill="url(#holo)"/>
      <use href="#mascot-shape" fill="none" stroke="url(#holo)" stroke-width=".4"/>
      <use href="#mascot-shape" fill="#0b0b0f"/>
      <rect x="4" y="2" width="1" height="2" fill="url(#holo)"/><rect x="8" y="2" width="1" height="2" fill="url(#holo)"/>
    </symbol>
  </defs>
</svg>
<div class="backdrop" aria-hidden="true">
  <svg class="creature one"><use href="#mascot"/></svg>
  <svg class="creature two"><use href="#mascot"/></svg>
  <svg class="creature three"><use href="#mascot"/></svg>
  <svg class="creature four"><use href="#mascot"/></svg>
  <svg class="creature five"><use href="#mascot"/></svg>
  <svg class="creature six"><use href="#mascot"/></svg>
  <span class="bubble one"></span><span class="bubble two"></span><span class="bubble three"></span><span class="bubble four"></span><span class="bubble five"></span>
</div>
<div class="stage">
<header class="band">
  <div class="frame">
    <div class="heading">
      <div class="titles">
        <h1><a href="#/" id="title">nock</a></h1>
        <p id="summary"></p>
      </div>
      <div class="top">
        <a class="memory-link" href="#/memory" id="memory-link">Memory</a>
        <button type="button" class="gear" id="bell" aria-label="What changed" title="What changed" aria-expanded="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5a5 5 0 0 0-5 5v3.2L3.5 13.5h13L15 10.7V7.5a5 5 0 0 0-5-5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 15.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span class="dot" id="bell-dot" hidden></span>
        </button>
        <button type="button" class="gear" id="gear" aria-label="Settings" title="Settings" aria-expanded="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M6.6 1h2.8l.4 1.9 1.2.7 1.8-.6 1.4 2.4-1.4 1.3v1.4l1.4 1.3-1.4 2.4-1.8-.6-1.2.7-.4 1.9H6.6l-.4-1.9-1.2-.7-1.8.6-1.4-2.4L3.2 8.7V7.3L1.8 6l1.4-2.4 1.8.6 1.2-.7zM8 10.2a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4z"/></svg>
        </button>
      </div>
    </div>
    <div class="notice" id="usage" data-ask-usage="false" role="region" aria-label="Usage reports" hidden>
      <p>May nock share a weekly usage report with its makers?</p>
      <p class="choices"><button type="button" data-share="true">Share</button> <button type="button" data-share="false">Don't share</button> <button type="button" class="quiet" data-open-settings>What it holds</button></p>
    </div>
  </div>
</header>
<main class="frame" id="main" data-word="<!-- nock:word -->"></main>
</div>
<div id="layers"></div>
<div class="toast" id="toast" role="status"></div>
<div class="toast restart shown" id="restart" role="status" hidden><span>nock was updated since this studio started.</span> <button type="button">Restart</button><span class="busy"></span></div>
<!-- nock:app -->
</body>
</html>
