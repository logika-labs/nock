<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nock studio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='f' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff9ad5'/%3E%3Cstop offset='.5' stop-color='%23c3b2ff'/%3E%3Cstop offset='1' stop-color='%238fe9ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%23111116'/%3E%3Cpath d='M9.5 24V12.5M9.5 16.5c0-2.6 2-4.5 4.8-4.5h.4c2.8 0 4.8 1.9 4.8 4.5V24' fill='none' stroke='url(%23f)' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round' transform='translate(1.5 0)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Unbounded:wght@600;800&display=swap">
<style>
/* The studio's frame: a band with the open tab's title, its counts under it and the menu beside
   it, then the tab's one centred column. Its look — tokens, surfaces, type, the field behind —
   is in pages/studio.css, put in below; each tab's own look is in its fragment. */
:root {
  --background: #f4f4f6;
  --foreground: #16161c;
  --card: #ffffff;
  --muted: #5b5d68;
  --border: #dcdde3;
  --input: #c6c8d0;
  --hover: #f7f7f9;
  --selection: #16161c;
  --selection-foreground: #ffffff;
  --selection-tint: #ececf2;
  --ring: #16161c;
  --link: #4b3bd6;
  --ok: #1f7a44;
  --ok-tint: #e7f4ec;
  --warning: #a35f00;
  --error: #b0151b;
  --info: #1666a6;

  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --display: var(--sans);
  /* Every tab's width, and nock.dev's (web/site/style.css): one measure for both. */
  --column: 60rem;
  --number: 2.25rem;
  --radius: 12px;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--background); color: var(--foreground); }
body { margin: 0; font: 400 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button:not(:disabled), label[for] { cursor: pointer; }
.frame {
  max-width: calc(var(--column) + 32px); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.label { font: 500 12px/16px var(--sans); letter-spacing: .04em; text-transform: uppercase; }
.numeral { font-variant-numeric: tabular-nums; }
.stage { position: relative; z-index: 1; }

/* The band: the title with its counts under it, the menu — one link per tab — beside it. */
.band .frame { padding-block: 24px 4px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
/* The menu stays on the title's line, whatever the counts say: they wrap under the title instead. */
.heading { display: flex; flex-wrap: nowrap; align-items: center; justify-content: space-between; gap: 12px 20px; min-width: 0; }
.titles { display: grid; gap: 4px; min-width: 0; flex: 1 1 auto; }
.band h1 { margin: 0; font: 700 30px/1.15 var(--display); letter-spacing: -.02em; }
.band #summary { margin: 0; font: 500 13px/20px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.menu { display: flex; flex-wrap: nowrap; align-items: center; gap: 4px; white-space: nowrap; }
.menu a {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
  color: inherit; text-decoration: none; font: 500 14px/20px var(--sans);
}
.menu a::before {
  content: ""; width: 16px; height: 16px; flex: none; background: currentColor;
  -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat;
}
.menu a[data-tab-link="topics"] { --icon: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M2 2h12v3H2zM2 6.5h12v3H2zM2 11h8v3H2z'/></svg>"); }
.menu a[data-tab-link="evals"] { --icon: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M1 13h3V8H1zM6.5 13h3V3h-3zM12 13h3V6h-3z'/></svg>"); }
.menu a[data-tab-link="experiments"] { --icon: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M2 8h3M11 4h3M11 12h3M5 8c3 0 3-4 6-4M5 8c3 0 3 4 6 4' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round'/><rect x='1' y='6' width='3.5' height='4' rx='1'/></svg>"); }
.top { display: flex; flex: none; align-items: center; gap: 8px; }
.menu a:focus-visible, .notice button:focus-visible, .gear:focus-visible, .switch:focus-visible, .popover summary:focus-visible {
  outline: 2px solid var(--ring); outline-offset: 3px;
}

/* The sharing question, while unanswered: one slim, quiet line. */
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.notice p { margin: 0; }
.notice .choices { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.notice button {
  font: 500 12px/18px var(--sans); padding: 2px 10px; border-radius: 999px;
  border: 1px solid var(--input); background: transparent; color: var(--foreground);
}
.notice button[data-share="true"] { background: var(--selection); border-color: var(--selection); color: var(--selection-foreground); }
.notice button.quiet { border-color: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }

/* The settings: a gear beside the menu opening a small popover. */
.settings { position: relative; }
.gear {
  display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
  border: 0; background: transparent; color: var(--foreground);
}
.gear svg { width: 18px; height: 18px; }
.popover {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: min(20rem, calc(100vw - 32px));
  display: grid; gap: 8px; padding: 14px 16px; border-radius: 16px;
  background: var(--card); color: var(--foreground); border: 1px solid var(--border);
  box-shadow: 0 12px 32px rgb(0 0 0 / .14); font-size: 14px;
}
.popover .setting { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.popover .state { margin-left: auto; font: 500 12px/1 var(--mono); color: var(--muted); }
.popover .hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.popover summary { cursor: pointer; width: max-content; font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }
.popover details p { margin: 6px 0 0; font-size: 12px; line-height: 1.5; color: var(--muted); max-height: 14rem; overflow: auto; }
/* The recorder's server: labelled fields and Save, under the sharing switch. */
.popover .fields { display: grid; gap: 8px; margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--border); }
.popover .fields label { display: grid; gap: 3px; font: 500 12px/1.3 var(--sans); color: var(--muted); }
.popover .fields input {
  width: 100%; padding: 5px 8px; border: 1px solid var(--input); border-radius: 8px; background: var(--card);
  font: 13px/1.4 var(--mono); color: var(--foreground); outline: none;
}
.popover .fields input:focus-visible { border-color: var(--ring); }
.popover .fields input:invalid { border-color: var(--error); }
.popover .fields .save {
  justify-self: end; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--selection);
  background: var(--selection); color: var(--selection-foreground); font: 500 12px/18px var(--sans);
}
.switch {
  position: relative; flex: none; width: 40px; height: 24px; border-radius: 999px; padding: 0;
  border: 1px solid var(--input); background: var(--selection-tint); transition: background-color .15s;
}
.switch span {
  position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .15s;
}
.switch[aria-checked="true"] { background: var(--selection); border-color: var(--selection); }
.switch[aria-checked="true"] span { transform: translateX(16px); }

.empty { text-align: center; padding: 64px 16px; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty strong { color: var(--foreground); font: 700 17px/24px var(--sans); }
.empty code { font: 13px var(--mono); background: var(--card); padding: 1px 5px; border-radius: 4px; }

.toast {
  position: fixed; z-index: 30; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px);
  background: var(--foreground); color: var(--background); padding: 10px 16px; border-radius: 8px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; max-width: calc(100vw - 32px);
}
.toast.shown { opacity: 1; transform: translate(-50%, 0); }
/* A studio older than its code: a toast that stays, with Restart, and what a restart would cut off. */
.toast.restart { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; width: max-content; pointer-events: auto; line-height: 1.45; }
.toast.restart[hidden] { display: none; }
body:has(#restart:not([hidden])) #toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.toast.restart .busy { flex-basis: 100%; color: #ffd36e; font-size: 13px; }
.toast.restart .busy:empty { display: none; }
.toast.restart button {
  border: 0; padding: 0; background: none; color: #8fe9ff; font: 600 14px var(--sans); text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}
.toast.restart button:disabled { color: rgb(255 255 255 / .45); text-decoration: none; cursor: default; }
.toast.restart button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 2px; }

/* A tab away that holds something shown on every tab: nothing of it shows or takes room but that. */
[data-tab-panel][data-away] { height: 0; overflow: hidden; visibility: hidden; }
[data-tab-panel][data-away] [data-everywhere] { visibility: visible; }
/* The global chat's button beside the gear: a foil dot while its agent works. */
#chat-button { position: relative; }
#chat-button[aria-expanded="true"] { background: #111116; color: #fff; }
#chat-button.running::after {
  content: ""; position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%;
  background: conic-gradient(#ff9ad5, #c3b2ff, #8fe9ff, #fff2a0, #ff9ad5); box-shadow: 0 0 6px rgb(90 220 255 / .9);
}
/* Pinned, the global chat docks to the right half: the studio keeps the left. */
@media (min-width: 900px) {
  html.chat-pinned .stage { width: 50vw; }
}

/* Decoration behind everything; never under text. */
.backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.sprites { position: absolute; width: 0; height: 0; overflow: hidden; }

@media (max-width: 720px) {
  .heading { flex-wrap: wrap; }
}
@media (max-width: 560px) {
  .menu a { padding: 8px 12px; }
  .band h1 { font-size: 24px; }
}
/* The filters a tab puts under its bar: the verdicts as tabs, each with its count. */
nav.reviews { display: flex; flex-wrap: wrap; align-items: center; gap: 0 24px; border-bottom: 1px solid var(--border); margin-top: 8px; }

/* Search, with what a tab adds beside it, on one line; a row of chips that scrolls. */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-top: 20px; }
.search { position: relative; flex: 1 1 16rem; min-width: 0; display: flex; align-items: center; }
.search svg { position: absolute; left: 0; width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
.search input[type="search"] { padding-left: 24px; font-size: 14px; }
.search input::-webkit-search-cancel-button { filter: grayscale(1); }
/* Chips: toggles, several at once, each with how many it would show. */
.chips { display: flex; gap: 8px; }
.controls > .tags { margin-top: 12px; }
.tags {
  overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; scroll-padding-inline: 16px;
  --start: 0px; --end: 0px;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--start), #000 calc(100% - var(--end)), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, #000 var(--start), #000 calc(100% - var(--end)), transparent 100%);
}
/* An edge fades only where there is more to scroll to. */
.tags.more-before { --start: 24px; }
.tags.more-after { --end: 32px; }
.tags::-webkit-scrollbar { display: none; }
.tags .chips { width: max-content; padding: 2px; }
.chip { flex: none; white-space: nowrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px;
  border: 1px solid var(--input); background: transparent; color: var(--foreground);
  font: 500 11px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; transition: background .12s, border-color .12s;
}
.chip .count { color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.chip:hover { background: var(--card); }
.chip { --tone: var(--foreground); }
.chip[aria-pressed="true"] { border-color: var(--tone); color: var(--tone); background: color-mix(in oklab, var(--tone) 10%, var(--card)); }
.chip[aria-pressed="true"] .count { color: inherit; }
.chip:disabled { opacity: .4; cursor: default; background: transparent; }
.chip:focus-visible, .reviews [role="tab"]:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.reviews [role="tab"] {
  display: inline-flex; align-items: center; gap: 8px; margin-bottom: -1px;
  padding: 14px 2px 12px; border: 0; border-bottom: 2px solid transparent; background: none;
  color: var(--muted); font: 500 12px/16px var(--sans); letter-spacing: .04em; text-transform: uppercase;
}
.reviews [role="tab"]:hover { color: var(--foreground); }
.reviews [role="tab"][aria-selected="true"] { color: var(--foreground); border-bottom-color: var(--selection); }
.reviews .count { color: var(--muted); font-variant-numeric: tabular-nums; }

input[type="search"] {
  width: 100%; padding: 4px 0; border: 0; border-bottom: 1px solid var(--input); border-radius: 0;
  font: 15px/24px var(--sans); color: var(--foreground); background: transparent; outline: none;
}
input[type="search"]::placeholder { color: color-mix(in oklab, var(--muted) 60%, transparent); }
input[type="search"]:focus-visible { border-bottom-color: var(--ring); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
<!-- nock:styles -->
<script>
// The studio: tabs register here, and the address says which is open (`#NAME`,
// or `#NAME/ROUTE` for something in it). An address naming no tab goes to the
// first, whole, as its route — so `#7` still opens what was decision 7.
const studio = {
  tabs: new Map(),
  summaries: new Map(),
  current: null,
  // tab: { show(route) — it is opened, or its route changes; hide() — another is opened }.
  register(name, tab) { this.tabs.set(name, tab); },
  // The counts under the title, kept per tab and shown for the open one.
  summary(name, text) {
    this.summaries.set(name, text);
    if (name === this.current) document.getElementById("summary").textContent = text;
  },
  toast(message) {
    const element = document.getElementById("toast");
    element.textContent = message;
    element.classList.add("shown");
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => element.classList.remove("shown"), 2600);
  },
  // Make ELEMENT's content the markup given, changing in place only what differs, so a poll that
  // brings something new leaves the rest alone: a picture, page or video whose address is the same
  // is not loaded again, and focus, scroll, selection and hover stay where they were. A child with
  // `data-key` (or an `id`) is matched by it wherever it moved; others by position and tag. An
  // element marked `data-own` keeps its content, which the tab's script fills (a text fetched, a
  // note being typed); a `<details>` the owner opened stays open.
  morph(element, markup) {
    const template = document.createElement("template");
    template.innerHTML = markup;
    morphChildren(element, template.content);
  },
  escape(text) {
    return String(text ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  },
  // The verdict tabs (their look is above): NAV's tabs, each `data-verdict` and holding a
  // `.count`, the chosen one selected, each counting what it holds (none: blank).
  verdicts(nav, chosen, counts) {
    for (const tab of nav.querySelectorAll('[role="tab"][data-verdict]')) {
      tab.setAttribute("aria-selected", String(tab.dataset.verdict === chosen));
      tab.querySelector(".count").textContent = counts[tab.dataset.verdict] || "";
    }
  },
  // A scrolling row of chips fades at an edge only where there is more to scroll to.
  fade(row) {
    row.classList.toggle("more-before", row.scrollLeft > 2);
    row.classList.toggle("more-after", row.scrollLeft + row.clientWidth < row.scrollWidth - 2);
  },
  // Other names an address may use for a tab.
  aliases: { evaluations: "evals", decisions: "topics", review: "topics", work: "topics" },
  route() {
    const hash = decodeURIComponent(location.hash.slice(1));
    const [said, ...rest] = hash.split("/");
    const name = this.aliases[said] ?? said;
    if (this.tabs.has(name)) return [name, rest.join("/")];
    return [this.tabs.keys().next().value, hash];
  },
  open() {
    const [name, route] = this.route();
    if (this.current && this.current !== name) this.tabs.get(this.current).hide();
    this.current = name;
    // A panel holding something shown on every tab (`data-everywhere`: the global chat) is set away
    // instead of hidden: it takes no room and shows nothing but that.
    for (const panel of document.querySelectorAll("[data-tab-panel]")) {
      const away = panel.dataset.tabPanel !== name, everywhere = !!panel.querySelector("[data-everywhere]");
      panel.hidden = away && !everywhere;
      panel.toggleAttribute("data-away", away && everywhere);
    }
    for (const link of document.querySelectorAll(".menu a")) {
      if (link.dataset.tabLink === name) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    }
    const title = document.querySelector(`[data-tab-link="${name}"]`).textContent;
    document.getElementById("title").textContent = title;
    document.title = `nock studio — ${title}`;
    document.getElementById("summary").textContent = this.summaries.get(name) ?? "…";
    this.tabs.get(name).show(route);
  },
};

// Scrolling does not bubble: one listener, capturing, for every row of chips.
document.addEventListener("scroll", event => { if (event.target.classList?.contains("tags")) studio.fade(event.target); }, { capture: true, passive: true });
addEventListener("resize", () => document.querySelectorAll(".tags").forEach(row => studio.fade(row)));

const keyOf = node => node.nodeType === Node.ELEMENT_NODE ? (node.getAttribute("data-key") ?? (node.id || null)) : null;

function morphChildren(into, from) {
  const keyed = new Map();
  for (const child of into.childNodes) { const key = keyOf(child); if (key !== null) keyed.set(key, child); }
  const wanted = new Set([...from.childNodes].map(keyOf).filter(key => key !== null));
  const unwanted = node => keyOf(node) !== null && !wanted.has(keyOf(node));
  let cursor = into.firstChild;
  for (const next of [...from.childNodes]) {
    // A keyed node no longer wanted is passed over here, and removed at the end.
    while (cursor && unwanted(cursor)) cursor = cursor.nextSibling;
    const key = keyOf(next);
    let match = null;
    if (key !== null) match = keyed.get(key) ?? null;
    else if (cursor && keyOf(cursor) === null) match = cursor;
    if (match && match.nodeName !== next.nodeName) match = null;
    if (!match) { into.insertBefore(next, cursor); continue; }
    if (key !== null) keyed.delete(key);
    if (match === cursor) cursor = cursor.nextSibling;
    else into.insertBefore(match, cursor);
    if (match.nodeType === Node.ELEMENT_NODE) morphElement(match, next);
    else if (match.nodeValue !== next.nodeValue) match.nodeValue = next.nodeValue;
  }
  while (cursor) {
    const after = cursor.nextSibling;
    if (keyOf(cursor) === null || unwanted(cursor)) cursor.remove();
    cursor = after;
  }
  for (const node of keyed.values()) node.remove();
}

function morphElement(element, next) {
  for (const { name } of [...element.attributes]) {
    if (next.hasAttribute(name) || (name === "open" && element.tagName === "DETAILS")) continue;
    element.removeAttribute(name);
  }
  for (const { name, value } of [...next.attributes]) if (element.getAttribute(name) !== value) element.setAttribute(name, value);
  if (!next.hasAttribute("data-own")) morphChildren(element, next);
}
</script>
</head>
<body>
<svg class="sprites" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="holo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="13" y2="9">
      <stop offset="0" stop-color="#ff9ad5"/><stop offset=".3" stop-color="#c3b2ff"/><stop offset=".55" stop-color="#8fe9ff"/><stop offset=".8" stop-color="#fff2a0"/><stop offset="1" stop-color="#ffb0d6"/>
    </linearGradient>
    <g id="mascot-shape">
      <rect x="3" y="0" width="7" height="1"/><rect x="2" y="1" width="9" height="6"/>
      <rect x="0" y="3" width="2" height="2"/><rect x="11" y="2" width="2" height="2"/>
      <rect x="3" y="7" width="1" height="2"/><rect x="5" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/><rect x="9" y="7" width="1" height="2"/>
    </g>
    <!-- nock's mascot: chunky black pixels with a foil rim, extruded in foil, with foil eyes. -->
    <symbol id="mascot" viewBox="-0.3 -0.3 14 10">
      <use href="#mascot-shape" transform="translate(.6 .6)" fill="url(#holo)"/>
      <use href="#mascot-shape" fill="none" stroke="url(#holo)" stroke-width=".4"/>
      <use href="#mascot-shape" fill="#0b0b0f"/>
      <rect x="4" y="2" width="1" height="2" fill="url(#holo)"/><rect x="8" y="2" width="1" height="2" fill="url(#holo)"/>
    </symbol>
  </defs>
</svg>
<div class="backdrop" aria-hidden="true">
  <svg class="creature one"><use href="#mascot"/></svg>
  <svg class="creature two"><use href="#mascot"/></svg>
  <svg class="creature three"><use href="#mascot"/></svg>
  <svg class="creature four"><use href="#mascot"/></svg>
  <svg class="creature five"><use href="#mascot"/></svg>
  <svg class="creature six"><use href="#mascot"/></svg>
  <span class="bubble one"></span><span class="bubble two"></span><span class="bubble three"></span><span class="bubble four"></span><span class="bubble five"></span>
</div>
<div class="stage">
<header class="band">
  <div class="frame">
    <div class="heading">
      <div class="titles"><h1 id="title"></h1><p id="summary">…</p></div>
      <div class="top">
      <nav class="menu" aria-label="Studio">
<!-- nock:tabs -->
      </nav>
      <!-- The global chat's button: pages/topics.html draws the chat and drives it. -->
      <button type="button" class="gear" id="chat-button" aria-label="Chat with the agent" title="Chat with the agent" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4.5h12a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3H4A1.5 1.5 0 0 1 2.5 13V6A1.5 1.5 0 0 1 4 4.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6.5 8.5h7M6.5 11h4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
<!-- nock:settings -->
      </div>
    </div>
<!-- nock:notice -->
  </div>
</header>
<!-- nock:panels -->
</div>
<div class="toast" id="toast" role="status"></div>
<div class="toast restart shown" id="restart" role="status" hidden><span>nock was updated since this studio started.</span> <button type="button">Restart</button><span class="busy"></span></div>
<script>
// The owner's answer to whether nock shares its usage report: asked under the title until
// given, changed later with the switch in the settings; the same answer either way.
const settings = {
  gear: document.querySelector(".settings .gear"),
  panel: document.getElementById("settings"),
  open(shown) {
    this.panel.hidden = !shown;
    this.gear.setAttribute("aria-expanded", String(shown));
    if (shown) this.panel.querySelector(".switch").focus();
  },
  async answer(share) {
    const response = await fetch("/usage", { method: "POST", body: JSON.stringify({ share }) });
    if (!response.ok) { studio.toast((await response.json()).error); return; }
    document.getElementById("usage")?.remove();
    document.getElementById("share-switch").setAttribute("aria-checked", String(share));
    document.getElementById("share-state").textContent = share ? "On" : "Off";
    studio.toast(share ? "nock will share its weekly usage report" : "nock shares nothing");
  },
};
for (const button of document.querySelectorAll("#usage [data-share]")) {
  button.addEventListener("click", () => settings.answer(button.dataset.share === "true"));
}
document.querySelector("[data-settings]")?.addEventListener("click", event => {
  event.stopPropagation();
  settings.open(true);
  settings.panel.querySelector("details").open = true;
});
settings.gear.addEventListener("click", event => { event.stopPropagation(); settings.open(settings.panel.hidden); });
// The recorder's Whisper server, saved to this machine's config.
document.getElementById("transcription")?.addEventListener("submit", async event => {
  event.preventDefault();
  const form = event.currentTarget;
  const body = Object.fromEntries(["transcribe_url", "transcribe_model", "transcribe_key_variable"].map(name => [name, form.elements[name].value.trim()]));
  const response = await fetch("/settings", { method: "POST", body: JSON.stringify(body) });
  const answer = await response.json();
  if (!response.ok) { studio.toast(answer.error); return; }
  document.getElementById("transcription-state").textContent = answer.transcribe_url ? "On" : "Off";
  studio.toast(answer.transcribe_url ? "Transcription saved: the recorder in every chat uses it" : "Transcription is off");
});
document.getElementById("share-switch").addEventListener("click", event => {
  settings.answer(event.currentTarget.getAttribute("aria-checked") !== "true");
});
document.addEventListener("click", event => {
  if (!settings.panel.hidden && !event.target.closest(".settings")) settings.open(false);
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && !settings.panel.hidden) { settings.open(false); settings.gear.focus(); }
});
// A studio older than its code serves new pages to old routes: a toast offers to restart it in
// place (`POST /restart`), held back while a chat, Tidy up or a question would be cut off; the
// page then waits for the studio to answer again and reloads.
const restart = {
  toast: document.getElementById("restart"),
  restarting: false,
  async check() {
    if (this.restarting) return;
    let standing;
    try { standing = await (await fetch("/restart")).json(); } catch { return; }
    this.instance = standing.instance;
    this.toast.hidden = !standing.stale;
    const busy = standing.busy.join(", ");
    this.toast.querySelector(".busy").textContent = busy ? `Restart once it is done: ${busy}.` : "";
    this.toast.querySelector("button").disabled = Boolean(busy);
  },
  async go() {
    const button = this.toast.querySelector("button");
    const response = await fetch("/restart", { method: "POST", body: "{}" });
    if (!response.ok) { this.toast.querySelector(".busy").textContent = (await response.json()).error; return; }
    this.restarting = true;
    button.disabled = true;
    button.textContent = "Restarting…";
    for (let tries = 0; tries < 120; tries++) {
      await new Promise(resolve => setTimeout(resolve, 500));
      try {
        const standing = await (await fetch("/restart")).json();
        if (standing.instance !== this.instance) { location.reload(); return; }
      } catch { /* not answering yet */ }
    }
    this.toast.querySelector(".busy").textContent = "The studio did not come back: start it again with nock studio.";
  },
};
restart.toast.querySelector("button").addEventListener("click", () => restart.go());
restart.check();
setInterval(() => { if (!document.hidden) restart.check(); }, 5000);
addEventListener("hashchange", () => studio.open());
studio.open();
</script>
</body>
</html>
