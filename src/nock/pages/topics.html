<div class="frame topics" id="topics">
  <div class="controls">
    <div class="bar">
      <div class="field">
        <input type="text" id="topics-input" placeholder="search topics and items" autocomplete="off" spellcheck="false" aria-label="Search topics and items">
        <span class="hit-nav" id="topics-hits" hidden><span class="hit-count" aria-live="polite"></span><button type="button" data-hit="-1" aria-label="The previous hit (Shift+Enter)" title="The previous hit (Shift+Enter)"></button><button type="button" data-hit="1" aria-label="The next hit (Enter)" title="The next hit (Enter)"></button></span>
        <button type="button" class="inside" id="topics-clear" aria-label="Clear the search" hidden>×</button>
        <button type="button" class="inside" id="topics-send" aria-label="Ask" hidden>→</button>
      </div>
      <div class="modes" role="group" aria-label="Search or ask">
        <button type="button" data-bar-mode="search" aria-pressed="true">Search</button>
        <button type="button" data-bar-mode="ask" aria-pressed="false">Ask</button>
      </div>
    </div>
    <div class="answer" id="topics-answer" aria-live="polite" hidden></div>
  </div>
  <main id="topics-main"></main>
  <div id="topics-modal"></div>
  <div class="tip" id="topics-tip" role="tooltip" hidden></div>
  <div id="topics-lightbox"></div>
</div>
<script>
// The topics tab (its look is pages/topics.css): `GET topics` every topic with its items, each
// version's decision and files, where each chat stands, and the question being asked, polled
// while shown and drawn in place (`studio.morph`), so nothing flashes and what is typed stays.
// The list is the one view: a topic opens in place on its decisions (bubbles that open in place
// too), its pictures and its texts (an item's options together on one card); a picture or a text
// opens in a viewer over the list, a picture zooming in place there. A search marks what it finds,
// and opens and rings the items holding it. Every word goes through a chat: the owner's message
// waits for the agent's answer, withdrawn until it comes. Files dropped on a chat, pasted or picked
// are uploaded at once (`topics/upload`) and go with the message, kept beside its thread; the
// recorder sends what is said to `topics/transcribe` and writes the text where the cursor was. The address says what is open: `#topics/TOPIC` a topic, `#topics/TOPIC/SLUG` an item
// (`#170`: the item an earlier decision 170 became). Verdicts go to `POST topics/judge`, messages
// to `topics/reply` (`topics/withdraw` takes one back, `topics/seen` records a look), a question
// to `topics/ask` (`topics/ask/cancel` stops it).
(() => {
  const $ = id => document.getElementById(id);
  const escape = studio.escape;
  const POLL = 3000;
  const state = {
    shown: false, seen: "", topics: [], ask: null, search: "", mode: "search", route: "", arrived: null,
    drafts: new Map(), open: new Set(), expanded: new Set(), chats: new Set(),
    modal: null, compare: false, single: null, left: null, right: null, reveal: null,
    menu: null, zoom: null, dismissed: null, looking: new Set(), focus: null, reveal_to: null, folded: new Set(),
    hits: [], hitAt: 0, found: null, reveal_hit: false, opened: { open: new Set(), expanded: new Set(), folded: new Set() }, drag: null, dragged: false,
    // A composer's files (`attached`, by chat), the recording under way, the one being made text, the
    // ones that failed (kept to try again), where each field's cursor was, a picture enlarged.
    attached: new Map(), recording: null, transcribing: null, failed: new Map(), carets: new Map(), caretAt: null,
    picture: null, dropping: null, transcription: null,
  };
  // How decisions look, for the owner to compare (`?decisions=rail` or `lift`); `foil` by default.
  const LOOKS = ["foil", "rail", "lift"];
  const look = new URLSearchParams(location.search).get("decisions");
  document.documentElement.dataset.decisions = LOOKS.includes(look) ? look : LOOKS[0];

  const ICONS = {
    chat: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4.5h12a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3H4A1.5 1.5 0 0 1 2.5 13V6A1.5 1.5 0 0 1 4 4.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    send: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    cancel: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    chevron: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 6.5 3.5 3.5 3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    caret: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    accepted: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    rejected: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    clip: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="m15.5 9.5-5.6 5.6a3.5 3.5 0 0 1-5-5l6-6a2.3 2.3 0 0 1 3.3 3.3l-6 6a1.1 1.1 0 0 1-1.6-1.6l5.5-5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    mic: '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7.25" y="2.75" width="5.5" height="9.5" rx="2.75" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    stop: '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="6" width="8" height="8" rx="1.5" fill="currentColor"/></svg>',
    file: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11.5 2.75H6A1.75 1.75 0 0 0 4.25 4.5v11A1.75 1.75 0 0 0 6 17.25h8a1.75 1.75 0 0 0 1.75-1.75V7zM11.5 2.75V7h4.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    dropped: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 5 6 6m0-6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    star: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 2.2 1.8 3.65 4 .58-2.9 2.83.69 4L8 11.37l-3.59 1.89.69-4-2.9-2.83 4-.58z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>',
  };

  // --- time: short, "21m", "3h", "2d" -------------------------------------------------------------

  function short(moment) {
    const seconds = Math.max(0, (Date.now() - new Date(moment).getTime()) / 1000);
    if (seconds < 60) return "now";
    if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
    if (seconds < 86400) return `${Math.floor(seconds / 3600)}h`;
    if (seconds < 86400 * 60) return `${Math.floor(seconds / 86400)}d`;
    if (seconds < 86400 * 365) return `${Math.floor(seconds / 86400 / 30)}mo`;
    return `${Math.floor(seconds / 86400 / 365)}y`;
  }
  const time = moment => moment ? `<time datetime="${escape(moment)}" title="${escape(new Date(moment).toLocaleString())}">${escape(short(moment))}</time>` : "";

  // --- syntax highlighting: a small tokenizer per language, enough to read a file by -------------

  const WORDS = {
    py: "and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield match case self",
    ts: "abstract as async await break case catch class const continue debugger default delete do else enum export extends false finally for from function if implements import in instanceof interface let new null of private protected public readonly return static super switch this throw true try type typeof undefined var void while yield",
    rs: "as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait true type unsafe use where while Some None Ok Err",
    go: "break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var nil true false",
    sh: "if then else elif fi for while until do done case esac in function return export local readonly echo exit set unset shift source true false",
    sql: "select from where and or not insert into values update set delete create table index view drop alter add column primary key foreign references join left right inner outer full cross on group by order having limit offset as distinct union all null is in exists case when then else end begin commit rollback returning with default unique constraint check if like between asc desc cascade trigger function returns language",
    yaml: "true false null yes no on off",
    toml: "true false",
    json: "true false null",
    css: "important",
  };
  const LANGUAGES = {
    py: "py", pyi: "py", ts: "ts", tsx: "ts", js: "ts", jsx: "ts", mjs: "ts", cjs: "ts", rs: "rs", go: "go",
    sh: "sh", bash: "sh", zsh: "sh", sql: "sql", yaml: "yaml", yml: "yaml", toml: "toml", json: "json", jsonl: "json",
    html: "html", htm: "html", xml: "html", svg: "html", css: "css", scss: "css",
  };
  const STRINGS = String.raw`"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'`;
  // A number standing alone, not a digit inside a name, a version or a date.
  const NUMBER = String.raw`(?<![\w.:/-])(?:0x[0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?)(?![\w.:/-])`;
  const RULES = {
    py: [["comment", "#.*"], ["string", String.raw`"""[\s\S]*?"""|'''[\s\S]*?'''|[rbfu]?(?:${STRINGS})`], ["meta", String.raw`@[\w.]+`], ["number", NUMBER]],
    ts: [["comment", String.raw`//.*|/\*[\s\S]*?\*/`], ["string", String.raw`${STRINGS}|\x60(?:\\.|[^\x60\\])*\x60`], ["number", NUMBER]],
    rs: [["comment", String.raw`//.*|/\*[\s\S]*?\*/`], ["string", String.raw`r#*"[\s\S]*?"#*|${STRINGS}`], ["meta", String.raw`#!?\[[^\]]*\]|\b\w+!`], ["number", NUMBER]],
    go: [["comment", String.raw`//.*|/\*[\s\S]*?\*/`], ["string", String.raw`${STRINGS}|\x60[^\x60]*\x60`], ["number", NUMBER]],
    sh: [["comment", String.raw`(?:^|(?<=\s))#.*`], ["string", STRINGS], ["meta", String.raw`\$\{[^}]*\}|\$\w+|\$[@*#?$!0-9]`], ["number", NUMBER]],
    sql: [["comment", String.raw`--.*|/\*[\s\S]*?\*/`], ["string", STRINGS], ["number", NUMBER]],
    yaml: [["comment", String.raw`(?:^|(?<=\s))#.*`], ["key", String.raw`^[ \t]*(?:- +)?[^\s:#'"][^:#\n]*?(?=:(?:\s|$))`], ["string", STRINGS], ["meta", String.raw`^---$|[&*][\w-]+|![\w!-]+`], ["number", NUMBER]],
    toml: [["comment", "#.*"], ["meta", String.raw`^[ \t]*\[\[?[^\]\n]+\]\]?`], ["key", String.raw`^[ \t]*[\w.\-"']+(?=[ \t]*=)`], ["string", String.raw`"""[\s\S]*?"""|'''[\s\S]*?'''|${STRINGS}`], ["number", NUMBER]],
    json: [["key", String.raw`"(?:\\.|[^"\\\n])*"(?=\s*:)`], ["string", STRINGS], ["number", NUMBER]],
    html: [["comment", String.raw`<!--[\s\S]*?-->`], ["meta", String.raw`<![^>]*>`], ["key", String.raw`</?[\w:-]+|/?>`], ["attr", String.raw`[\w:-]+(?==)`], ["string", STRINGS]],
    css: [["comment", String.raw`/\*[\s\S]*?\*/`], ["string", STRINGS], ["meta", String.raw`@[\w-]+`], ["key", String.raw`[\w-]+(?=\s*:[^{;]*;)`], ["number", String.raw`-?\d*\.?\d+(?:px|rem|em|%|vh|vw|s|ms|deg|fr)?\b|#[0-9a-fA-F]{3,8}\b`]],
  };
  const compiled = new Map();
  function scanner(language) {
    if (!compiled.has(language)) {
      const rules = [...RULES[language], ["word", String.raw`[A-Za-z_$][\w$]*`]];
      const words = new Set((WORDS[language] || "").split(" "));
      compiled.set(language, { rules, words, pattern: new RegExp(rules.map(([, source]) => `(${source})`).join("|"), "gm") });
    }
    return compiled.get(language);
  }
  function highlight(source, language) {
    const { rules, words, pattern } = scanner(language);
    const caseless = language === "sql";
    let html = "", at = 0, found;
    pattern.lastIndex = 0;
    while ((found = pattern.exec(source))) {
      if (!found[0]) { pattern.lastIndex++; continue; }
      html += escape(source.slice(at, found.index));
      const index = found.slice(1).findIndex(group => group !== undefined);
      let kind = rules[index][0];
      if (kind === "word") {
        const word = caseless ? found[0].toLowerCase() : found[0];
        kind = words.has(word) ? "keyword" : source[pattern.lastIndex] === "(" ? "call" : /^[A-Z][a-z]/.test(found[0]) && language !== "sql" ? "type" : "";
      }
      html += kind ? `<span class="t-${kind}">${escape(found[0])}</span>` : escape(found[0]);
      at = pattern.lastIndex;
    }
    return html + escape(source.slice(at));
  }
  const extension = name => (name.match(/\.([^./]+)$/)?.[1] || "").toLowerCase();
  const rendering = name => ["md", "markdown"].includes(extension(name)) ? "markdown" : LANGUAGES[extension(name)] ? "code" : "plain";

  // --- markdown, as much as agents and the owner write, and as documents need -----------------------

  function inline(text) {
    return escape(text)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\[([a-z0-9][a-z0-9-]*\/[a-z0-9][a-z0-9-]*|D\d+)\]/g, '<a href="#topics/$1">$1</a>');
  }
  // A Markdown file's frontmatter, the simple YAML agents write (`key: value`, a list under a key or
  // in brackets), as a ribbon of keys and values; the file without it.
  function frontmatter(source) {
    const found = source.match(/^---\n([\s\S]*?)\n---[ \t]*(?:\n|$)/);
    if (!found) return ["", source];
    const bare = value => value.trim().replace(/^(["'])(.*)\1$/, "$2");
    const rows = [];
    for (const line of found[1].split("\n")) {
      const pair = line.match(/^([^\s#:][^:]*):(?:\s+(.*))?$/);
      const entry = line.match(/^\s*-\s+(.*)$/);
      if (pair) {
        const value = (pair[2] || "").trim();
        const values = /^\[.*\]$/.test(value) ? value.slice(1, -1).split(",").map(bare).filter(Boolean)
          : value && !/^[|>][+-]?$/.test(value) ? [bare(value)] : [];
        rows.push({ key: pair[1].trim(), values, list: /^\[.*\]$/.test(value) });
      } else if (entry && rows.length) { rows[rows.length - 1].values.push(bare(entry[1])); rows[rows.length - 1].list = true; }
      else if (line.trim() && rows.length) {
        const row = rows[rows.length - 1];
        if (row.list || !row.values.length) row.values.push(line.trim()); else row.values[row.values.length - 1] += ` ${line.trim()}`;
      }
    }
    const shown = rows.map(row => `<div class="pair"><dt>${escape(row.key)}</dt><dd>${row.list
      ? row.values.map(value => `<span class="value">${inline(value)}</span>`).join("") : inline(row.values.join(" "))}</dd></div>`).join("");
    return [rows.length ? `<dl class="frontmatter">${shown}</dl>` : "", source.slice(found[0].length)];
  }

  // A list's items, each with its indent, as lists nested by indent: an item indented more than
  // the one before opens a list inside it; a change of kind at the same depth starts another list.
  function nested(items) {
    let at = 0;
    const level = indent => {
      const tag = items[at].tag;
      let html = `<${tag}>`;
      while (at < items.length && items[at].indent >= indent) {
        if (items[at].indent > indent) { html = html.replace(/<\/li>$/, "") + level(items[at].indent) + "</li>"; continue; }
        if (items[at].tag !== tag) break;
        html += `<li>${inline(items[at].text)}</li>`;
        at++;
      }
      return `${html}</${tag}>`;
    };
    let html = "";
    while (at < items.length) html += level(items[at].indent);
    return html;
  }

  // DOCUMENT: a Markdown file, its headings at their own level; otherwise a message's, smaller.
  // Lines of a paragraph or a list item flow together, as in CommonMark: only a blank line parts them.
  function markdown(source, document = false) {
    let ribbon = "";
    source = String(source || "").replace(/\r/g, "");
    if (document) [ribbon, source] = frontmatter(source);
    const lines = source.split("\n");
    const out = [];
    let paragraph = [], list = null, quote = [];
    const flush = () => {
      if (paragraph.length) out.push(`<p>${inline(paragraph.join(" "))}</p>`);
      paragraph = [];
      if (list) out.push(nested(list.items));
      list = null;
      if (quote.length) out.push(`<blockquote>${markdown(quote.join("\n"), document)}</blockquote>`);
      quote = [];
    };
    const cells = line => line.trim().replace(/^\||\|$/g, "").split("|").map(cell => cell.trim());
    for (let index = 0; index < lines.length; index++) {
      const line = lines[index];
      const fence = line.trimStart().match(/^```\s*([\w+-]*)/);
      if (fence) {
        flush();
        const code = [];
        while (++index < lines.length && !lines[index].trimStart().startsWith("```")) code.push(lines[index]);
        const language = LANGUAGES[fence[1].toLowerCase()] || ({ python: "py", typescript: "ts", javascript: "ts", rust: "rs", shell: "sh", console: "sh" })[fence[1].toLowerCase()];
        out.push(`<pre><code>${language ? highlight(code.join("\n"), language) : escape(code.join("\n"))}</code></pre>`);
        continue;
      }
      if (/^\s*\|.*\|\s*$/.test(line) && /^\s*\|?[\s:-]+\|[\s|:-]*$/.test(lines[index + 1] || "")) {
        flush();
        const head = cells(line);
        const rows = [];
        index++;
        while (index + 1 < lines.length && /^\s*\|.*\|\s*$/.test(lines[index + 1])) rows.push(cells(lines[++index]));
        out.push(`<div class="table"><table><thead><tr>${head.map(cell => `<th>${inline(cell)}</th>`).join("")}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${inline(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
        continue;
      }
      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      const bullet = line.match(/^(\s*)[-*+]\s+(.*)$/);
      const numbered = line.match(/^(\s*)\d+[.)]\s+(.*)$/);
      const quoted = line.match(/^\s*>\s?(.*)$/);
      if (quoted) { if (paragraph.length || list) { const kept = quote; quote = []; flush(); quote = kept; } quote.push(quoted[1]); continue; }
      if (quote.length) flush();
      if (heading) { flush(); const level = Math.min(6, heading[1].length + (document ? 0 : 2)); out.push(`<h${level}>${inline(heading[2])}</h${level}>`); }
      else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out.push("<hr>"); }
      else if (bullet || numbered) {
        const [, indent, text] = bullet || numbered;
        if (paragraph.length) flush();
        list = list || { items: [] };
        list.items.push({ indent: indent.replace(/\t/g, "    ").length, tag: bullet ? "ul" : "ol", text });
      }
      else if (!line.trim()) flush();
      else if (list) list.items[list.items.length - 1].text += " " + line.trim();
      else paragraph.push(line.trim());
    }
    flush();
    return ribbon + out.join("");
  }

  // --- the diff: an LCS over lines, then over the words of a changed line -------------------------

  function steps(before, after) {
    let start = 0;
    while (start < before.length && start < after.length && before[start] === after[start]) start++;
    let end = 0;
    while (end < before.length - start && end < after.length - start && before[before.length - 1 - end] === after[after.length - 1 - end]) end++;
    const left = before.slice(start, before.length - end), right = after.slice(start, after.length - end);
    const head = before.slice(0, start).map(value => ["equal", value, value]);
    const tail = before.slice(before.length - end).map(value => ["equal", value, value]);
    const n = left.length, m = right.length, middle = [];
    if (n * m > 4_000_000) {
      for (const value of left) middle.push(["removed", value, null]);
      for (const value of right) middle.push(["added", null, value]);
      return [...head, ...middle, ...tail];
    }
    const table = new Uint32Array((n + 1) * (m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
      table[i * (m + 1) + j] = left[i] === right[j] ? table[(i + 1) * (m + 1) + j + 1] + 1 : Math.max(table[(i + 1) * (m + 1) + j], table[i * (m + 1) + j + 1]);
    }
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (left[i] === right[j]) { middle.push(["equal", left[i], right[j]]); i++; j++; }
      else if (table[(i + 1) * (m + 1) + j] >= table[i * (m + 1) + j + 1]) middle.push(["removed", left[i++], null]);
      else middle.push(["added", null, right[j++]]);
    }
    while (i < n) middle.push(["removed", left[i++], null]);
    while (j < m) middle.push(["added", null, right[j++]]);
    return [...head, ...middle, ...tail];
  }
  function words(before, after) {
    const split = line => line.match(/\s+|[\p{L}\p{N}_]+|[^\s\p{L}\p{N}_]/gu) || [];
    const marked = { before: "", after: "" };
    for (const [kind, left, right] of steps(split(before), split(after))) {
      if (kind === "equal") { marked.before += escape(left); marked.after += escape(right); }
      else if (kind === "removed") marked.before += /^\s+$/.test(left) ? escape(left) : `<del>${escape(left)}</del>`;
      else marked.after += /^\s+$/.test(right) ? escape(right) : `<ins>${escape(right)}</ins>`;
    }
    marked.before = marked.before.replace(/<\/del>(\s+)<del>/g, "$1");
    marked.after = marked.after.replace(/<\/ins>(\s+)<ins>/g, "$1");
    return marked;
  }
  function diff(before, after) {
    const walked = steps(before.split("\n"), after.split("\n"));
    const found = [];
    let numberBefore = 0, numberAfter = 0;
    for (let index = 0; index < walked.length;) {
      if (walked[index][0] === "equal") { found.push({ kind: "equal", before: walked[index][1], after: walked[index][2], left: ++numberBefore, right: ++numberAfter }); index++; continue; }
      const removed = [], added = [];
      while (index < walked.length && walked[index][0] !== "equal") {
        if (walked[index][0] === "removed") removed.push(walked[index][1]); else added.push(walked[index][2]);
        index++;
      }
      for (let k = 0; k < Math.max(removed.length, added.length); k++) {
        const left = removed[k], right = added[k];
        if (left?.trim() && right?.trim()) { found.push({ kind: "changed", before: left, after: right, left: ++numberBefore, right: ++numberAfter }); continue; }
        if (left !== undefined) found.push({ kind: "removed", before: left, after: null, left: ++numberBefore, right: null });
        if (right !== undefined) found.push({ kind: "added", before: null, after: right, left: null, right: ++numberAfter });
      }
    }
    const near = found.map((row, index) => row.kind !== "equal" || found.slice(Math.max(0, index - 3), index + 4).some(other => other.kind !== "equal"));
    // A long run of unchanged lines folds into one full-width row, which a click unfolds.
    let html = "", run = "", folded = 0, runs = 0;
    const fold = () => {
      if (folded) html += `<tr class="unchanged" data-unfold="${runs}"><td colspan="4">··· ${folded} unchanged ${folded === 1 ? "line" : "lines"}</td></tr>${run}`;
      folded = 0; run = ""; runs++;
    };
    found.forEach((row, index) => {
      let left = row.before === null ? "" : escape(row.before), right = row.after === null ? "" : escape(row.after);
      if (row.kind === "changed") ({ before: left, after: right } = words(row.before, row.after));
      const line = hidden => `<tr class="${row.kind}"${hidden}><td class="number">${row.left ?? ""}</td><td class="before">${left}</td><td class="number after-side">${row.right ?? ""}</td><td class="after">${right}</td></tr>`;
      if (!near[index] && found.length > 40) { folded++; run += line(` data-run="${runs}" hidden`); return; }
      fold();
      html += line("");
    });
    fold();
    return `<table class="diff"><colgroup><col class="number"><col><col class="number"><col></colgroup><tbody>${html}</tbody></table>`;
  }

  // --- reading the data ---------------------------------------------------------------------------

  const topicNamed = name => state.topics.find(topic => topic.name === name);
  const everyItem = () => state.topics.flatMap(topic => topic.items);
  const itemAt = ref => everyItem().find(item => item.ref === ref || (item.aliases || []).some(alias => ref === alias || ref === `D${alias}` || ref === `${item.topic}/${alias}`));
  const last = item => item.versions[item.versions.length - 1];
  const versionOf = (item, number) => item.versions.find(version => version.version === number) || last(item);
  const fileUrl = (item, version, name) => `topics/file/${encodeURIComponent(item.topic)}/${encodeURIComponent(item.slug)}/${version.version}/${name.split("/").map(encodeURIComponent).join("/")}`;
  const texts = new Map();
  function text(address) {
    if (!texts.has(address)) texts.set(address, fetch(address).then(response => response.ok ? response.text() : Promise.reject(new Error("gone"))));
    return texts.get(address);
  }
  const said = () => state.search.toLowerCase().split(/\s+/).filter(Boolean);

  // What an item is, for the section of its topic it shows in.
  function kindOf(item) {
    const latest = last(item);
    if (latest.decision) return "decision";
    const types = new Set(latest.files.map(file => file.type));
    if (types.size === 1 && types.has("image")) return "image";
    if (types.size === 1 && types.has("video")) return "video";
    if (types.size === 1 && types.has("text")) return "text";
    return "files";
  }
  const SECTIONS = [["decision", "Decisions", "decision", "decisions"], ["image", "Images", "image", "images"], ["video", "Videos", "video", "videos"], ["text", "Texts", "text", "texts"],
    ["files", "Files", "file", "files"]];
  // What the viewer steps through with the arrows: a topic's pictures, then its texts, then its other files.
  const viewable = topic => ["image", "video", "text", "files"].flatMap(kind => topic.items.filter(item => kindOf(item) === kind));
  const awaitsOwner = item => item.verdict === "open";
  const joined = parts => parts.filter(Boolean).join(" · ");

  // --- drawing: the small parts -------------------------------------------------------------------

  // A title as it is written, its `code` set as code.
  const titled = text => escape(text).replace(/`([^`]+)`/g, "<code>$1</code>");
  // The owner's verdict as a mark: a green tick, a red cross, a muted cross for dropped (closed,
  // nothing to rework); nothing while it is open.
  // A mark's hover card (`#topics-tip`, the evaluations' card): its name, what it means, and the
  // line and moment that set it, when there are any.
  const tipped = (word, means, line = "", moment = "") =>
    `data-tip="${escape(word)}" data-tip-means="${escape(means)}"${line ? ` data-tip-line="${escape(line)}"` : ""}${moment ? ` data-tip-when="${escape(moment)}"` : ""}`;
  const VERDICTS = {
    accepted: ["Accepted", "the owner accepted it"],
    rejected: ["Rejected", "the owner rejected it: the agent reworks it as a new version"],
    dropped: ["Dropped", "the owner rejected it with nothing to rework: closed"],
  };
  function verdictMark(item) {
    const [word, means] = VERDICTS[item.verdict] || [];
    if (!word) return "";
    return `<span class="verdict-mark ${item.verdict}" aria-label="${word}" role="img" ${tipped(word, means, "", item.decided?.moment)}>${ICONS[item.verdict]}</span>`;
  }
  // A decision is done unless it says otherwise: only a todo one shows its status, a chip under its corner.
  const todoPill = `<span class="todo-pill" aria-label="To do" ${tipped("To do", "decided, but the work it calls for is still to do")}>Todo</span>`;
  // Where a topic's work stands, beside its time: active a turning foil spinner, planned a foil
  // ring, done and abandoned a full foil circle with a tick or a cross.
  const STATES = {
    active: ["Active", "an agent is working on it"],
    planned: ["Planned", "the work is set out, not started"],
    done: ["Done", "the work is finished"],
    abandoned: ["Abandoned", "the work was stopped before it was finished"],
  };
  function stateMark(topic) {
    const known = STATES[topic.state] ? topic.state : "active";
    const [word, means] = STATES[known];
    const icon = known === "done" ? ICONS.accepted : known === "abandoned" ? ICONS.rejected : "";
    const set = [...topic.thread].reverse().find(entry => entry.kind === "status");
    return `<span class="state-mark ${known}" aria-label="${word}" role="img" ${tipped(word, means, topic.status || "", set?.moment)}>${icon}</span>`;
  }
  function showTip(mark) {
    const tip = $("topics-tip");
    const when = mark.dataset.tipWhen;
    tip.innerHTML = `<strong>${escape(mark.dataset.tip)}</strong><span class="means">${escape(mark.dataset.tipMeans)}</span>${mark.dataset.tipLine
      ? `<span class="line">${escape(mark.dataset.tipLine)}</span>` : ""}${when ? `<span class="set">set ${escape(short(when))} ago · ${escape(new Date(when).toLocaleString())}</span>` : ""}`;
    tip.hidden = false;
    const anchor = mark.getBoundingClientRect();
    const below = anchor.bottom + 8 + tip.offsetHeight < innerHeight - 8;
    tip.style.top = `${below ? anchor.bottom + 8 : Math.max(8, anchor.top - 8 - tip.offsetHeight)}px`;
    tip.style.left = `${Math.max(8, Math.min(anchor.right - tip.offsetWidth + 10, innerWidth - tip.offsetWidth - 8))}px`;
  }

  function chatButton(key, standing) {
    const open = state.chats.has(key);
    const mark = standing?.unseen ? (standing.answered ? "a reply" : `${standing.unseen} new`) : "";
    const title = open ? "Close the chat" : mark ? `Chat: ${mark}` : standing?.pending ? "Chat: waiting for the agent's answer" : "Chat";
    return `<button type="button" class="chat-toggle${standing?.unseen ? " unseen" : ""}${standing?.pending ? " pending" : ""}" data-chat="${escape(key)}" aria-pressed="${open}" aria-label="${escape(title)}" title="${escape(title)}">${ICONS.chat}<span class="swirl" aria-hidden="true"><span></span></span><span class="mark" aria-hidden="true"></span></button>`;
  }
  // The chat's icon, and the chat itself floating from it over what is under it: the icon stays
  // where it is, on the chat's corner, whether it is open or not.
  const chatCorner = (key, entries, standing) => `<span class="chat-anchor${state.chats.has(key) ? " open" : ""}">${chatButton(key, standing)}${state.chats.has(key) ? chat(key, entries, standing) : ""}</span>`;

  const sizeOf = bytes => bytes < 1024 ? `${bytes} B` : bytes < 1048576 ? `${Math.round(bytes / 1024)} KB` : `${(bytes / 1048576).toFixed(1)} MB`;
  const elapsed = started => { const seconds = Math.max(0, Math.floor((Date.now() - started) / 1000)); return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`; };
  // Where a thread's attachment is served: beside its topic's thread, or its item's.
  const attachmentUrl = (key, file) => `topics/attachment/${(key.startsWith("topic:") ? key.slice(6) : key).split("/").map(encodeURIComponent).join("/")}/${file.path.split("/").map(encodeURIComponent).join("/")}`;
  const topicOf = key => key.startsWith("topic:") ? key.slice(6) : key.split("/")[0];

  // What a message carries: pictures as thumbnails that open enlarged, other files as named chips.
  function carried(key, entry) {
    const files = entry.attachments || [];
    if (!files.length) return "";
    const pictures = files.filter(file => file.type === "image").map(file => {
      const address = attachmentUrl(key, file);
      return `<button type="button" class="picture" data-picture="${escape(address)}" data-name="${escape(file.name)}" data-topic="${escape(topicOf(key))}" title="${escape(file.name)}" aria-label="Enlarge ${escape(file.name)}"><img src="${escape(address)}" alt="${escape(file.name)}" loading="lazy"></button>`;
    }).join("");
    const others = files.filter(file => file.type !== "image").map(file => {
      const address = attachmentUrl(key, file);
      const saved = file.type === "binary" ? ` download="${escape(file.name)}"` : ` target="_blank" rel="noopener"`;
      return `<a class="file-chip" href="${escape(address)}"${saved} title="${escape(file.name)}">${ICONS.file}<span class="name">${escape(file.name)}</span><span class="size">${sizeOf(file.bytes)}</span></a>`;
    }).join("");
    return `<div class="attachments">${pictures ? `<div class="pictures${files.filter(file => file.type === "image").length === 1 ? " one" : ""}">${pictures}</div>` : ""}${others ? `<div class="chips">${others}</div>` : ""}</div>`;
  }

  // The files waiting in a composer, each removable; one still uploading spins.
  function chips(key) {
    const files = state.attached.get(key) || [];
    if (!files.length) return "";
    return `<div class="attached" aria-label="Attached files">${files.map(file => {
      const face = file.uploading ? '<span class="spinner" aria-hidden="true"></span>'
        : file.type === "image" ? `<img src="${escape(file.preview || `topics/upload/${file.token}`)}" alt="">` : ICONS.file;
      return `<span class="file-chip${file.uploading ? " uploading" : ""}" data-key="chip:${escape(file.id)}">${face}<span class="name" title="${escape(file.name)}">${escape(file.name)}</span><span class="size">${sizeOf(file.bytes)}</span>
        <button type="button" class="remove" data-unattach="${escape(key)}" data-id="${escape(file.id)}" aria-label="Remove ${escape(file.name)}" title="Remove">${ICONS.cancel}</button></span>`;
    }).join("")}</div>`;
  }

  // The recorder: a microphone; while recording, a pulsing foil dot and the time, a click stopping
  // it; a spinner while the words are made text. Without a Whisper server it says how to set one.
  function recorder(key, waiting) {
    const off = !state.transcription?.enabled;
    if (state.recording?.key === key) {
      return `<button type="button" class="tool recorder recording" data-record="${escape(key)}" aria-label="Stop recording" title="Stop: write what was said"><span class="dot" aria-hidden="true"></span><span class="elapsed" data-elapsed>${elapsed(state.recording.started)}</span>${ICONS.stop}</button>`;
    }
    if (state.transcribing === key) {
      return `<button type="button" class="tool recorder transcribing" disabled aria-label="Writing what was said" title="Writing what was said"><span class="spinner" aria-hidden="true"></span></button>`;
    }
    const title = off ? (state.transcription?.hint || "Transcription is off").replaceAll("`", "") : waiting ? "Waiting for the agent's answer" : "Record: what you say is written here, to edit";
    return `<button type="button" class="tool recorder${off ? " off" : ""}" data-record="${escape(key)}" ${off ? 'aria-disabled="true"' : ""} ${waiting ? "disabled" : ""} aria-label="${escape(off ? "Record (off)" : "Record")}" title="${escape(title)}">${ICONS.mic}</button>`;
  }

  function chat(key, entries, standing) {
    const waiting = standing?.pending;
    const messages = entries.map((entry, index) => {
      const notes = [{ revival: "revived it", split: "split", status: entry.revived ? "revived it" : entry.state }[entry.kind] || "", entry.verdict || ""].filter(Boolean).map(note => `<span class="note">${escape(note)}</span>`).join("");
      const held = waiting && index === entries.length - 1;
      const words = entry.text ? `<div class="context">${markdown(entry.text)}</div>` : "";
      return `<div class="message ${entry.author}${held ? " waiting" : ""}${entry.attachments?.length ? " carrying" : ""}" data-key="message:${escape(entry.moment)}:${index}">${notes}${words}${carried(key, entry)}
        <span class="when">${held ? "waiting for the answer · " : ""}${time(entry.moment)}</span></div>`;
    }).join("");
    const button = waiting
      ? `<button type="button" class="send" data-withdraw="${escape(key)}" aria-label="Withdraw it, to edit" title="Withdraw it, to edit">${ICONS.cancel}</button>`
      : `<button type="button" class="send" data-send="${escape(key)}" aria-label="Send" title="Send">${ICONS.send}</button>`;
    const failed = state.failed.get(key);
    const problem = failed ? `<div class="recorded-problem" role="alert"><span>${escape(failed.error)}</span><span class="choices"><button type="button" data-retry="${escape(key)}">Try again</button><button type="button" class="quiet" data-forget="${escape(key)}">Discard</button></span></div>` : "";
    const clip = `<button type="button" class="tool" data-attach="${escape(key)}" ${waiting ? "disabled" : ""} aria-label="Attach files" title="${waiting ? "Waiting for the agent's answer" : "Attach files (or drop them here)"}">${ICONS.clip}</button>`;
    return `<aside class="chat${state.dropping === key ? " dropping" : ""}" data-key="chat:${escape(key)}" data-drop="${escape(key)}" aria-label="Chat"><div class="chat-head"><span class="label">Chat</span></div>
      <div class="messages" data-log="${escape(key)}">${messages || '<p class="nothing">Nothing said yet.</p>'}</div>
      <div class="composer${waiting ? " frozen" : ""}">${chips(key)}${problem}<div class="line">${clip}<textarea data-draft="reply:${escape(key)}" rows="1" ${waiting ? "disabled" : ""}
        placeholder="${waiting ? "Waiting for the agent's answer" : "Write to the agent"}" aria-label="Message"></textarea>${recorder(key, waiting)}${button}</div></div>
      <div class="drop-veil" aria-hidden="true"><span>Drop to attach</span></div></aside>`;
  }

  function verdictButtons(key, verdict, count = 1) {
    const all = key.startsWith("topic:");
    const labels = { dropped: "Drop", rejected: "Reject", accepted: "Accept" };
    return ["dropped", "rejected", "accepted"].filter(choice => all || choice !== verdict).map(choice =>
      `<button type="button" class="button ${choice === "accepted" ? "primary" : "secondary"}" data-judge="${escape(key)}" data-verdict-choice="${choice}"
        title="${joined([choice === "dropped" ? "Rejected, nothing to rework: closed" : "", all ? `${count} open ${count === 1 ? "item" : "items"}` : ""])}">${labels[choice]}${all ? " all" : ""}</button>`).join("");
  }

  // --- drawing: a topic's sections ----------------------------------------------------------------

  // The session that wrote a version, short, with the session that dispatched it.

  // A decision: a bubble opening in place, its chat floating over it.
  function bubble(item) {
    const open = state.expanded.has(item.ref);
    const todo = last(item).decision.status === "todo" ? todoPill : "";
    const corner = `<span class="corner">${verdictMark(item)}${time(item.updated)}${chatCorner(item.ref, item.thread, item.chat)}${todo}</span>`;
    const title = `<button type="button" class="title" aria-expanded="${open}">${titled(item.title)}</button>`;
    const latest = last(item);
    const decision = latest.decision;
    const head = `${title}${corner}`;
    let body = "";
    if (open) {
      const alternatives = decision.alternatives.length ? `<div class="considered"><span class="label">Considered instead</span><ul class="alternatives">${decision.alternatives.map(entry =>
        `<li><span class="option">${inline(entry.option)}</span> — <span class="why">${inline(entry.why_not)}</span></li>`).join("")}</ul></div>` : "";
      const concerns = latest.files.length ? `<p class="where">Concerns ${latest.files.map(file => `<code>${escape(file.name)}</code>`).join(" ")}</p>` : "";
      body = `<div class="expanded"><div class="context">${markdown(decision.answer)}</div>${alternatives}${concerns}
        <div class="actions"><span class="hint" data-problem="${escape(item.ref)}"></span><div class="buttons">${verdictButtons(item.ref, item.verdict)}</div></div></div>`;
    }
    return `<div class="item-bubble decision${open ? " open" : ""}${hitClass(item)}" data-key="${escape(item.ref)}" id="item-${escape(item.ref)}">
      <div class="head" data-expand="${escape(item.ref)}">${head}</div>${body}</div>`;
  }

  // What an item shows first: its preferred option, else its first file of that type.
  function cover(item, type) {
    const version = last(item);
    const preferred = item.preferred?.version === version.version && version.files.find(file => file.name === item.preferred.name);
    return { version, file: preferred || version.files.find(entry => entry.type === type) };
  }
  // A video's still: its poster, else its first frame; a play mark, and its length once known.
  const lengths = new Map();
  const clock = seconds => `${Math.floor(seconds / 60)}:${String(Math.round(seconds % 60)).padStart(2, "0")}`;
  function still(item, version, file) {
    const address = fileUrl(item, version, file.name);
    if (file.type !== "video") return `<img src="${address}" alt="" loading="lazy">`;
    const picture = file.poster ? `<img src="${fileUrl(item, version, file.poster)}" alt="" loading="lazy">` : "";
    const known = lengths.get(address);
    return `${picture}<video src="${address}#t=0.1" data-length="${address}" preload="metadata" muted playsinline tabindex="-1"${picture ? " hidden" : ""}></video>
      <span class="play" aria-hidden="true"></span><span class="length">${known ? clock(known) : ""}</span>`;
  }
  function thumbnail(item) {
    const { version, file } = cover(item, kindOf(item) === "video" ? "video" : "image");
    return `<button type="button" class="thumb${file.type === "video" ? " video" : ""}${hitClass(item)}" data-key="${escape(item.ref)}" id="item-${escape(item.ref)}" data-view="${escape(item.ref)}" title="${escape(item.title)}" aria-label="${escape(item.title)}">${still(item, version, file)}
      <span class="ribbon"><span class="title">${titled(item.title)}</span>${time(item.updated)}${verdictMark(item)}</span></button>`;
  }
  // An item's options belong together: one card, its title and time over a small list of them (the
  // preferred one starred), its verdict at its foot; it opens on all of them side by side.
  function optionsCard(item, type) {
    const version = last(item);
    const options = version.files.map(file => {
      const preferred = item.preferred?.version === version.version && item.preferred?.name === file.name;
      const shown = type !== "text" ? still(item, version, file)
        : `<pre data-text="${fileUrl(item, version, file.name)}" data-lines="4" data-own>…</pre><span class="name">${escape(file.name)}</span>`;
      return `<span class="option${preferred ? " preferred" : ""}" data-key="option:${escape(file.name)}">${shown}${star(item, version, file, "span")}</span>`;
    }).join("");
    // Pictures: the options, then the title, time and verdict along the foot. Texts: the title on top.
    const pictured = type !== "text";
    const head = `<span class="head"><span class="title">${titled(item.title)}</span><span class="side">${time(item.updated)}${pictured ? verdictMark(item) : ""}</span></span>`;
    return `<button type="button" class="options-card ${pictured ? "image" : "text"}${type === "video" ? " video" : ""}${hitClass(item)}" data-key="${escape(item.ref)}" id="item-${escape(item.ref)}" data-view="${escape(item.ref)}">
      ${pictured ? "" : head}<span class="stack">${options}</span>${pictured ? head : verdictMark(item)}</button>`;
  }
  const grouped = item => item.options && last(item).files.length > 1;
  // An option's star: grey; the preferred one's filled in the foil. A click prefers it, or takes the
  // preference back. In a card that opens the item it is a span, as a button holds no button.
  function star(item, version, file, tag = "button") {
    const preferred = item.preferred?.version === version.version && item.preferred?.name === file.name;
    const words = preferred ? "Preferred: click to take it back" : "Prefer this option";
    const kind = tag === "button" ? 'type="button"' : 'role="button" tabindex="-1"';
    return `<${tag} ${kind} class="star-toggle" data-prefer="${escape(file.name)}" data-ref="${escape(item.ref)}" data-version="${version.version}" aria-pressed="${preferred}" aria-label="${words}" title="${words}"><i></i></${tag}>`;
  }
  function preview(item) {
    const { version, file } = cover(item, "text");
    return `<button type="button" class="preview${hitClass(item)}" data-key="${escape(item.ref)}" id="item-${escape(item.ref)}" data-view="${escape(item.ref)}">
      <span class="head"><span class="title">${titled(item.title)}</span><span class="side">${time(item.updated)}</span></span>
      <pre data-text="${fileUrl(item, version, file.name)}" data-lines="8" data-own>…</pre>${verdictMark(item)}</button>`;
  }
  const fileRow = item => `<button type="button" class="file-row${hitClass(item)}" data-key="${escape(item.ref)}" id="item-${escape(item.ref)}" data-view="${escape(item.ref)}">
      <span class="title">${titled(item.title)}</span><span class="side">${verdictMark(item)}${time(item.updated)}</span></button>`;

  function sections(topic, items) {
    return SECTIONS.map(([kind, label]) => {
      const found = items.filter(item => kindOf(item) === kind);
      if (!found.length) return "";
      const key = `${topic.name}/${kind}`, folded = state.folded.has(key);
      const body = folded ? "" : kind === "decision" ? `<div class="item-bubbles">${found.map(bubble).join("")}</div>`
        : kind === "image" || kind === "video" ? `<div class="strip images">${found.map(item => grouped(item) ? optionsCard(item, kind) : thumbnail(item)).join("")}</div>`
        : kind === "text" ? `<div class="strip texts">${found.map(item => grouped(item) ? optionsCard(item, "text") : preview(item)).join("")}</div>`
        : `<div class="rows">${found.map(fileRow).join("")}</div>`;
      return `<section class="section ${kind}${folded ? " folded" : ""}" data-key="section:${kind}"><h3 class="label"><button type="button" class="fold" data-fold="${escape(key)}" aria-expanded="${!folded}">${ICONS.caret}${label} <span class="count">· ${found.length}</span></button></h3>${body}</section>`;
    }).join("");
  }

  function kindCounts(items) {
    return joined(SECTIONS.map(([kind, , one, many]) => {
      const count = items.filter(item => kindOf(item) === kind).length;
      return count ? `${count} ${count === 1 ? one : many}` : "";
    }));
  }
  const verdictCounts = counts => joined(["open", "accepted", "rejected", "dropped"].map(verdict => counts[verdict] ? `${counts[verdict]} ${verdict}` : ""));

  function sheet(topic, items) {
    const open = state.open.has(topic.name), key = `topic:${topic.name}`;
    const waiting = topic.items.filter(awaitsOwner).length;
    const head = `<div class="topic-head" data-toggle="${escape(topic.name)}">
        <span class="title-line"><button type="button" class="name" aria-expanded="${open}">${escape(topic.name)}</button>${topic.status ? `<span class="status">${escape(topic.status)}</span>` : ""}</span>
        <span class="corner">${stateMark(topic)}${time(topic.active)}${chatCorner(key, topic.thread, topic.chat)}</span>
        <span class="counts"><span>${escape(kindCounts(topic.items))}</span><span>${escape(verdictCounts(topic.counts))}</span></span>
        <p class="about">${inline(topic.current)}</p></div>`;
    const body = open ? `<div class="topic-body">${sections(topic, items) || '<p class="nothing">No items yet.</p>'}
        ${waiting ? `<div class="actions all" data-key="judge"><span class="hint" data-problem="${escape(key)}"></span><div class="buttons">${verdictButtons(key, null, waiting)}</div></div>` : ""}</div>` : "";
    return `<article class="sheet topic${open ? " open" : ""}" data-key="topic:${escape(topic.name)}" id="topic-${escape(topic.name)}">
      <div class="main">${head}${body}</div></article>`;
  }

  function drawList() {
    // Searching, what the last answer found; until the first comes, everything.
    const found = said().length ? state.found : null;
    const shown = [];
    for (const topic of state.topics) {
      if (!found || found.topics.has(topic.name)) { shown.push([topic, topic.items]); continue; }
      const items = topic.items.filter(item => found.items.has(item.ref));
      if (items.length) shown.push([topic, items]);
    }
    const empty = !state.topics.length
      ? '<div class="empty" data-key="empty"><strong>No topics yet</strong><span>Agents open a topic for their work with <code>.nock/nock topics create</code> and submit items into it; they appear here.</span></div>'
      : !shown.length ? '<div class="empty" data-key="empty"><strong>No matches</strong><span>No topic or item fits the search.</span></div>' : "";
    studio.morph($("topics-main"), empty + shown.map(([topic, items]) => sheet(topic, items)).join(""));
  }

  // --- drawing: the viewer, a picture or a text over the list -------------------------------------

  // Compare is for versions: an item with options shows one version's options side by side instead.
  const comparable = item => item.versions.length > 1 && !item.options;
  function chosen(item) {
    const numbers = item.versions.map(version => version.version);
    if (!state.compare || !comparable(item)) return [numbers.includes(state.single) ? state.single : numbers[numbers.length - 1]];
    const right = numbers.includes(state.right) ? state.right : numbers[numbers.length - 1];
    const left = numbers.includes(state.left) ? state.left : numbers[Math.max(0, numbers.length - 2)];
    return [left, right];
  }

  // The version select: a pill showing the version alone; its list gives each version's time.
  const versionWords = version => `<span class="label">v<span class="number">${version.version}</span></span><span class="when">${escape(short(version.moment))}</span>`;
  function picker(item, side, number) {
    const version = versionOf(item, number);
    const open = state.menu === side;
    const options = [...item.versions].reverse().map(entry => `<button type="button" role="option" data-pick="${side}" data-number="${entry.version}" aria-selected="${entry.version === number}" title="${escape(new Date(entry.moment).toLocaleString())}">${versionWords(entry)}</button>`).join("");
    return `<div class="select" data-key="select:${side}"><button type="button" class="select-button" data-menu="${side}" aria-haspopup="listbox" aria-expanded="${open}" ${item.versions.length < 2 ? "disabled" : ""}>
        <span class="label">v<span class="number">${version.version}</span></span>${item.versions.length > 1 ? ICONS.chevron : ""}</button>
        ${open ? `<div class="options" role="listbox" aria-label="${side === "left" ? "Before" : side === "right" ? "After" : "Version"}">${options}</div>` : ""}</div>`;
  }

  // Where a file comes from, in words: no times, no sizes.
  function source(file) {
    const code = path => `<code>${escape(path)}</code>`;
    const listed = paths => paths.length < 2 ? paths.map(code).join("") : `${paths.slice(0, -1).map(code).join(", ")} and ${code(paths[paths.length - 1])}`;
    const lines = [];
    if (file.kind === "project") lines.push(`<p>A copy of ${code(file.name)}, as the repository had it when this version was made.</p>`);
    else {
      lines.push(file.from?.length ? `<p>Made to show ${listed(file.from)}.</p>` : "<p>Made by an agent to show part of the project.</p>");
      if (file.when) lines.push(`<p>It shows the case when ${inline(file.when)}.</p>`);
      if (file.recipe?.command) lines.push(`<p>To make it again, run ${code(file.recipe.command)}.</p>`);
      if (file.recipe?.instruction) lines.push(`<p class="how">${file.recipe.command ? "Or, for an agent" : "To make it again, an agent"}: ${inline(file.recipe.instruction)}</p>`);
    }
    if (file.local) lines.push("<p>It is large, so it stays on this machine.</p>");
    return `<div class="source" data-key="source" role="dialog" aria-label="Where it comes from">${lines.join("")}</div>`;
  }
  const pathButton = (file, index) => `<span class="path-anchor"><button type="button" class="path" data-path="${index}" aria-expanded="${state.reveal === index}" title="Where it comes from">${escape(file.name)}</button>${state.reveal === index ? source(file) : ""}</span>`;

  function pane(item, version, file, index) {
    if (!file) return `<div class="pane"><p class="missing">Nothing in version ${version.version}.</p></div>`;
    const address = fileUrl(item, version, file.name);
    if (file.type === "image") {
      const [box, picture] = zoomStyles(index);
      return `<div class="pane"><button type="button" class="shot${box ? " zoomed" : ""}" data-shot="${index}" style="${box}" aria-label="${box ? "Zoom out" : "Zoom in"}"><img data-key="${address}" src="${address}" style="${picture}" alt="${escape(file.name)}, version ${version.version}"></button></div>`;
    }
    if (file.type === "video") {
      // Captions on by default: a recording explains each step in its own words.
      const poster = file.poster ? ` poster="${fileUrl(item, version, file.poster)}"` : "";
      const track = file.captions ? `<track kind="captions" src="${fileUrl(item, version, file.captions)}" srclang="en" label="Captions" default>` : "";
      return `<div class="pane"><video class="player" data-key="${address}" src="${address}"${poster} controls preload="metadata" playsinline>${track}</video></div>`;
    }
    if (file.type === "pdf") return `<div class="pane"><iframe data-key="${address}" src="${address}" title="${escape(file.name)}"></iframe></div>`;
    if (file.type === "html") return `<div class="pane"><iframe data-key="${address}" src="${address}" sandbox="" title="${escape(file.name)}"></iframe></div>`;
    if (file.type === "binary") return `<div class="pane"><a href="${address}" download>${escape(file.name)}</a></div>`;
    const how = rendering(file.name);
    return `<div class="pane"><div class="document ${how}" data-key="${address}" data-text="${address}" data-render="${how}" data-language="${LANGUAGES[extension(file.name)] || ""}" data-own>…</div></div>`;
  }

  // An option's foot: its name (where it comes from, on a click) and whether the owner prefers it.
  function optionBar(item, version, file, index) {
    const preferred = item.preferred?.version === version.version && item.preferred?.name === file.name;
    return `<div class="option-bar${preferred ? " preferred" : ""}">${pathButton(file, index)}</div>`;
  }

  // What the viewer shows: compared, one file of each of two versions; otherwise every file of one
  // version (an item's options side by side).
  function shownPanes(item) {
    const versions = chosen(item).map(number => versionOf(item, number));
    if (versions.length === 2) return versions.map(version => ({ version, file: version.files[0] || null }));
    const files = versions[0].files;
    return files.length ? files.map(file => ({ version: versions[0], file })) : [{ version: versions[0], file: null }];
  }

  function viewer(item) {
    const numbers = chosen(item);
    const panes = shownPanes(item);
    const comparing = numbers.length === 2;
    const several = !comparing && panes.length > 1;
    const kind = kindOf(item);
    const compare = `<button type="button" class="toggle" data-compare aria-pressed="${comparing}" ${comparable(item) ? "" : "disabled"} title="${item.options ? "Compare is for versions: options show side by side" : item.versions.length < 2 ? "One version: nothing to compare" : "Compare two versions"}"><span class="switch" aria-hidden="true"><span></span></span>Compare</button>`;
    const first = panes[panes.length - 1].file;
    // Compared, each version's select stands over the side it chooses.
    const sides = ["left", "right"];
    const pickers = comparing ? "" : picker(item, "single", numbers[0]);
    const path = !several && first && !comparing ? pathButton(first, 0) : "";
    let content, heads = "";
    if (comparing && panes.every(entry => entry.file?.type === "text")) {
      const pair = panes.map(entry => fileUrl(item, entry.version, entry.file.name)).join(" ");
      heads = `<div class="heads" data-key="heads">${sides.map((side, index) => picker(item, side, numbers[index])).join("")}</div>`;
      content = `<div class="panes" data-key="pair:${escape(pair)}" data-own data-pair="${escape(pair)}"><p class="missing">…</p></div>`;
    } else {
      // Keyed apart from a diff, so a diff filled once is not taken for this.
      content = `<div class="panes${panes.length > 1 ? " several" : ""}" data-key="panes" style="--panes:${panes.length}">${panes.map((entry, index) =>
        `<div class="column${several && entry.file && item.preferred?.version === entry.version.version && item.preferred?.name === entry.file.name ? " preferred" : ""}">${comparing ? picker(item, sides[index], numbers[index]) : ""}${item.options && entry.file ? `<div class="pane-wrap">${pane(item, entry.version, entry.file, index)}${star(item, entry.version, entry.file)}</div>` : pane(item, entry.version, entry.file, index)}${several && entry.file ? optionBar(item, entry.version, entry.file, index) : ""}</div>`).join("")}</div>`;
    }
    const actions = awaitsOwner(item) || item.verdict !== "open" ? `<div class="actions"><span class="hint" data-problem="${escape(item.ref)}"></span><div class="buttons">${verdictButtons(item.ref, item.verdict)}</div></div>` : "";
    const fits = kind === "image" || kind === "video" ? "image" : kind === "text" && !comparing && !several ? "text" : "wide";
    return `<div class="overlay" data-key="overlay:${escape(item.ref)}" data-backdrop>
      <article class="sheet open viewer ${fits}${comparing ? " comparing" : ""}" role="dialog" aria-modal="true" aria-label="${escape(item.title)}">
        <div class="ribbon"><h2>${titled(item.title)}</h2><span class="side">${verdictMark(item)}${time(item.updated)}</span><button type="button" class="close" data-close aria-label="Close (Esc)" title="Close (Esc)">×</button></div>
        <div class="main">
          <div class="line versions">${pickers ? `<span class="pickers">${pickers}</span>` : ""}${path}<span class="end">${compare}${chatCorner(item.ref, item.thread, item.chat)}</span></div>
          ${heads}<div class="content">${content}</div>${actions}</div>
      </article></div>`;
  }

  // A picture a message carries, enlarged over everything, zooming in place like the viewer's.
  function drawLightbox() {
    const picture = state.picture;
    const markup = picture ? `<div class="overlay lightbox" data-key="lightbox:${escape(picture.address)}" data-lightbox-backdrop>
      <article class="sheet open viewer image" data-hue="${hue(picture.topic)}" role="dialog" aria-modal="true" aria-label="${escape(picture.name)}">
        <div class="ribbon"><h2>${escape(picture.name)}</h2><span class="side"><a class="path" href="${escape(picture.address)}" download="${escape(picture.name)}">Download</a></span><button type="button" class="close" data-lightbox-close aria-label="Close (Esc)" title="Close (Esc)">×</button></div>
        <div class="main"><div class="content"><div class="panes" data-key="panes"><div class="column">${(() => {
          const [box, shown] = zoomStyles("p");
          return `<div class="pane"><button type="button" class="shot${box ? " zoomed" : ""}" data-shot="p" style="${box}" aria-label="${box ? "Zoom out" : "Zoom in"}"><img data-key="${escape(picture.address)}" src="${escape(picture.address)}" style="${shown}" alt="${escape(picture.name)}"></button></div>`;
        })()}</div></div></div></div>
      </article></div>` : "";
    studio.morph($("topics-lightbox"), markup);
  }

  function drawModal() {
    const item = state.modal ? itemAt(state.modal) : null;
    document.documentElement.classList.toggle("topics-viewing", !!item && state.shown);
    studio.morph($("topics-modal"), item ? viewer(item) : "");
    placeSource();
  }
  // A path's bubble floats free of the content that scrolls: under its path, or over it when the
  // screen has no room below.
  function placeSource() {
    const bubble = document.querySelector("#topics .source");
    if (!bubble) return;
    const anchor = bubble.previousElementSibling.getBoundingClientRect();
    const below = anchor.bottom + 10 + bubble.offsetHeight < innerHeight - 8;
    bubble.style.top = `${below ? anchor.bottom + 10 : Math.max(8, anchor.top - 10 - bubble.offsetHeight)}px`;
    bubble.style.left = `${Math.max(8, Math.min(anchor.left - 10, innerWidth - bubble.offsetWidth - 8))}px`;
  }

  // --- zoom: a picture magnified in place, to its natural size, the part shown following the cursor --

  // Each picture shown zooms with the others, to the same point, so two versions compare in detail.
  // A picture shown about as large as it is zooms to twice its size instead.
  const clamp = value => Math.min(1, Math.max(0, value));
  // Where the pictures that zoom together are: an enlarged attachment's, else the viewer's.
  const zoomed = () => state.picture ? "#topics-lightbox" : "#topics-modal";
  const shift = box => `translate(${(-(box.wide - box.width) * state.zoom.x).toFixed(1)}px, ${(-(box.tall - box.height) * state.zoom.y).toFixed(1)}px)`;
  function zoomStyles(index) {
    const box = state.zoom?.boxes[index];
    if (!box) return ["", ""];
    return [`width:${box.width}px;height:${box.height}px`, `width:${box.wide}px;height:${box.tall}px;transform:${shift(box)}`];
  }
  function zoomIn(shot, event) {
    const boxes = {};
    for (const each of document.querySelectorAll(`${zoomed()} .shot`)) {
      const picture = each.querySelector("img");
      const { width, height } = picture.getBoundingClientRect();
      if (!picture.naturalWidth || !width) continue;
      const ratio = picture.naturalWidth / width;
      const scale = ratio < 1.25 ? 2 : ratio;
      boxes[each.dataset.shot] = { width, height, wide: width * scale, tall: height * scale };
    }
    const rect = shot.getBoundingClientRect();
    const keyed = event.detail === 0;
    state.zoom = { boxes, x: keyed ? .5 : clamp((event.clientX - rect.left) / rect.width), y: keyed ? .5 : clamp((event.clientY - rect.top) / rect.height) };
  }
  function placeZoom() {
    for (const shot of document.querySelectorAll(`${zoomed()} .shot.zoomed`)) {
      const box = state.zoom.boxes[shot.dataset.shot];
      if (box) shot.querySelector("img").style.transform = shift(box);
    }
  }

  // --- search: the words found marked, the items they are in opened and ringed, one hit at a time ----

  // Nock finds what is searched for (`GET topics/search/QUERY`) in what the owner sees: titles,
  // decisions, file names, texts' contents, threads; the answer to the latest query wins.
  async function find(opening) {
    const query = state.mode === "search" ? state.search.trim() : "";
    if (!query) { state.found = null; if (opening) searched(); draw(); return; }
    let answer;
    try { answer = await (await fetch(`topics/search/${encodeURIComponent(query)}`)).json(); } catch { return; }
    if ((state.mode === "search" ? state.search.trim() : "") !== query) return;
    state.found = { topics: new Set(answer.topics), items: new Set(answer.items) };
    if (opening) searched();
    else {
      state.hits = findHits().map(item => item.ref);
      state.hitAt = Math.min(state.hitAt, Math.max(0, state.hits.length - 1));
    }
    draw();
  }
  // Opening starts at three letters, so the first keystrokes do not open everything.
  const searching = () => state.mode === "search" && state.search.trim().length >= 3 && state.found ? said() : [];
  // Only a picture, a text or a file is ringed: a decision opened for what it says shows the words
  // found, not a ring.
  const hitClass = item => kindOf(item) !== "decision" && state.hits.includes(item.ref) ? ` hit${state.hits[state.hitAt] === item.ref ? " current" : ""}` : "";
  // The items holding what is searched for, in the order the list shows them.
  function findHits() {
    if (!searching().length) return [];
    const found = [];
    for (const topic of state.topics) {
      const holding = topic.items.filter(item => state.found.items.has(item.ref));
      for (const [kind] of SECTIONS) found.push(...holding.filter(item => kindOf(item) === kind));
    }
    return found;
  }
  // What the search opened (topics, decisions, folded sections) it closes again when it no longer
  // finds anything there; what the owner opened stays as they left it.
  function searched() {
    const hits = findHits();
    const wanted = {
      open: new Set(hits.map(item => item.topic)),
      expanded: new Set(hits.filter(item => kindOf(item) === "decision").map(item => item.ref)),
      folded: new Set(hits.map(item => `${item.topic}/${kindOf(item)}`)),
    };
    for (const [place, keys] of Object.entries(state.opened)) {
      for (const key of keys) {
        if (wanted[place].has(key)) continue;
        if (place === "folded") state.folded.add(key); else state[place].delete(key);
        if (place === "open") state.chats.delete(`topic:${key}`);
        keys.delete(key);
      }
    }
    for (const [place, keys] of Object.entries(wanted)) {
      for (const key of keys) {
        const shut = place === "folded" ? state.folded.has(key) : !state[place].has(key);
        if (!shut) continue;
        if (place === "folded") state.folded.delete(key); else state[place].add(key);
        state.opened[place].add(key);
      }
    }
    state.hits = hits.map(item => item.ref);
    state.hitAt = 0;
    state.reveal_hit = state.hits.length > 0;
  }
  // The owner opening or closing something takes it from the search: it stays as they set it.
  const owned = (place, key) => state.opened[place].delete(key);
  function jump(by) {
    if (!state.hits.length) return;
    state.hitAt = (state.hitAt + by + state.hits.length) % state.hits.length;
    const item = itemAt(state.hits[state.hitAt]);
    if (item && !state.open.has(item.topic)) { state.open.add(item.topic); state.opened.open.add(item.topic); }
    state.reveal_hit = true;
    draw();
  }
  // The words searched for, marked where they show: wrapped in place, after every drawing and
  // every text fetched; unwrapped first, so a changed search leaves no old marks.
  function markWords(scope) {
    for (const old of scope.querySelectorAll("mark.found")) {
      const parent = old.parentNode;
      old.replaceWith(...old.childNodes);
      parent.normalize();
    }
    const wanted = state.mode === "search" ? said().filter(word => word.length > 1) : [];
    if (!wanted.length) return;
    const source = wanted.map(word => word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
    const pattern = new RegExp(source, "gi"), holds = new RegExp(source, "i");
    const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, {
      acceptNode: node => node.parentElement.closest("time, .when, textarea, script, style, button.select-button") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
    });
    const nodes = [];
    while (walker.nextNode()) if (holds.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
    for (const node of nodes) {
      const text = node.nodeValue, parts = [];
      let at = 0;
      for (const found of text.matchAll(pattern)) {
        if (found.index > at) parts.push(document.createTextNode(text.slice(at, found.index)));
        const mark = document.createElement("mark");
        mark.className = "found";
        mark.textContent = found[0];
        parts.push(mark);
        at = found.index + found[0].length;
      }
      if (at < text.length) parts.push(document.createTextNode(text.slice(at)));
      node.replaceWith(...parts);
    }
  }

  // --- filling what is fetched, keeping what is typed ---------------------------------------------

  function fill(scope) {
    for (const place of scope.querySelectorAll("[data-text]")) {
      const address = place.dataset.text;
      if (place.filled === address) continue;
      place.filled = address;
      const lines = Number(place.dataset.lines || 0);
      text(address).then(content => {
        if (place.filled !== address) return;
        if (lines) place.textContent = content.split("\n").slice(0, lines).join("\n");
        else if (place.dataset.render === "markdown") place.innerHTML = markdown(content, true);
        else if (place.dataset.render === "code") place.innerHTML = `<pre><code>${highlight(content, place.dataset.language)}</code></pre>`;
        else place.innerHTML = `<pre>${escape(content)}</pre>`;
        markWords(place);
      }).catch(() => { if (place.filled === address) place.textContent = "This file could not be read."; });
    }
    for (const place of scope.querySelectorAll("[data-pair]")) {
      const pair = place.dataset.pair;
      if (place.filled === pair) continue;
      place.filled = pair;
      Promise.all(pair.split(" ").map(text)).then(([left, right]) => { if (place.filled === pair) { place.innerHTML = diff(left, right); markWords(place); } })
        .catch(() => { if (place.filled === pair) place.innerHTML = '<p class="missing">These files could not be read.</p>'; });
    }
  }

  function restoreDrafts() {
    for (const field of document.querySelectorAll("#topics [data-draft]")) {
      const kept = field.disabled ? "" : state.drafts.get(field.dataset.draft) ?? "";
      if (document.activeElement !== field && field.value !== kept) field.value = kept;
      grow(field);
    }
    if (state.focus) {
      const field = document.querySelector(`#topics [data-draft="${CSS.escape(state.focus)}"]`);
      if (field && !field.disabled) {
        const at = state.caretAt ?? field.value.length;
        field.focus(); field.setSelectionRange(at, at); state.focus = state.caretAt = null;
      }
    }
  }
  function grow(field) {
    if (!CSS.supports("field-sizing", "content")) {
      field.style.height = "auto";
      field.style.height = `${field.scrollHeight + 1}px`;
    }
    edges(field);
  }
  // Grown to its limit, a message scrolls inside its field: its edges fade where more is hidden.
  function edges(field) {
    field.classList.toggle("more-before", field.scrollTop > 1);
    field.classList.toggle("more-after", field.scrollTop + field.clientHeight < field.scrollHeight - 6);
  }

  // An open chat keeps its newest message in sight, and what it shows the owner counts as seen.
  function keepChats() {
    for (const log of document.querySelectorAll("#topics [data-log]")) {
      const newest = log.lastElementChild?.dataset.key || "";
      if (log.newest !== newest) { log.newest = newest; log.scrollTop = log.scrollHeight; }
    }
    for (const key of state.chats) {
      const standing = key.startsWith("topic:") ? topicNamed(key.slice(6))?.chat : itemAt(key)?.chat;
      if (!standing?.unseen || state.looking.has(key)) continue;
      if (!document.querySelector(`#topics [data-log="${CSS.escape(key)}"]`)) continue;
      state.looking.add(key);
      post("topics/seen", where(key)).then(() => { state.seen = ""; return load(); }).catch(() => {}).finally(() => state.looking.delete(key));
    }
  }

  function drawAnswer() {
    const place = $("topics-answer");
    const ask = state.ask;
    if (!ask || ask.started === state.dismissed) { place.hidden = true; studio.morph(place, ""); return; }
    place.hidden = false;
    const close = '<button type="button" class="button ghost" data-ask-dismiss aria-label="Close the answer">×</button>';
    if (ask.running) {
      studio.morph(place, `<div class="head"><span class="spinner" aria-hidden="true"></span><span class="question">${escape(ask.question)}</span><span>asking since ${time(ask.started)}</span><button type="button" class="button secondary" data-ask-cancel>Cancel</button></div>`);
      return;
    }
    const cards = (ask.items || []).map(ref => itemAt(ref)).filter(Boolean).map(item =>
      `<button type="button" class="mini" data-key="mini:${escape(item.ref)}" data-go="${escape(item.ref)}"><span class="title">${titled(item.title)}</span><span class="ref">${escape(item.ref)} · ${item.verdict}</span></button>`).join("");
    studio.morph(place, `<div class="head"><span class="question">${escape(ask.question)}</span>${close}</div>
      ${ask.problem ? `<pre class="problem">${escape(ask.problem)}</pre>` : `<div class="context">${markdown(ask.answer)}</div>`}
      ${cards ? `<div class="cards">${cards}</div>` : ""}`);
  }

  function drawBar() {
    for (const button of document.querySelectorAll("[data-bar-mode]")) button.setAttribute("aria-pressed", String(button.dataset.barMode === state.mode));
    const input = $("topics-input");
    input.placeholder = state.mode === "search" ? "search topics and items" : "ask about the topics, the items, what was decided";
    input.setAttribute("aria-label", state.mode === "search" ? "Search topics and items" : "Ask about the topics");
    $("topics-clear").hidden = state.mode !== "search" || !input.value;
    const navigating = state.mode === "search" && searching().length > 0;
    $("topics-hits").hidden = !navigating;
    input.classList.toggle("navigating", navigating);
    if (navigating) {
      $("topics-hits").querySelector(".hit-count").textContent = state.hits.length ? `${state.hitAt + 1}/${state.hits.length}` : "none";
      for (const button of $("topics-hits").querySelectorAll("button")) { button.innerHTML = ICONS.chevron; button.disabled = state.hits.length < 2; }
    }
    $("topics-send").hidden = state.mode !== "ask" || !input.value.trim();
    $("topics-send").disabled = !!state.ask?.running;
  }

  function drawCounts() {
    const open = everyItem().filter(awaitsOwner).length;
    const busy = state.topics.filter(topic => topic.items.some(awaitsOwner)).length;
    const words = open ? `${open} open in ${busy} ${busy === 1 ? "topic" : "topics"}` : "nothing waits on you";
    studio.summary("topics", state.topics.length ? words : "no topics yet");
  }

  function draw() {
    if (state.route !== state.arrived && state.topics.length) arrive(state.route);
    drawCounts();
    drawBar();
    drawAnswer();
    drawList();
    drawModal();
    drawLightbox();
    fill($("topics"));
    markWords($("topics-main"));
    markWords($("topics-modal"));
    restoreDrafts();
    keepChats();
    if (state.reveal_to !== null) {
      const element = state.reveal_to && document.getElementById(state.reveal_to);
      if (element) element.scrollIntoView({ block: "start", behavior: "instant" });
      else scrollTo({ top: 0, behavior: "instant" });
      state.reveal_to = null;
    }
    if (state.reveal_hit && !state.modal) {
      state.reveal_hit = false;
      const card = document.getElementById(`item-${state.hits[state.hitAt]}`);
      const hit = card?.classList.contains("decision") ? card.querySelector("mark.found") || card : card;
      // A hit taller than most of the screen shows from its top; a smaller one in the middle.
      hit?.scrollIntoView({ block: hit.offsetHeight > innerHeight * .6 ? "start" : "center", inline: "nearest", behavior: "smooth" });
      hit?.classList.add("current");
    }
  }

  // --- talking to nock ----------------------------------------------------------------------------

  async function load() {
    try {
      const response = await fetch("topics");
      const raw = await response.text();
      if (raw === state.seen) return;
      state.seen = raw;
      const data = JSON.parse(raw);
      state.topics = data.topics;
      state.ask = data.ask;
      state.transcription = data.transcription || null;
      if (said().length) find(false);
      draw();
    } catch {
      studio.summary("topics", "Lost touch with nock — is `nock studio` still running?");
    }
  }

  async function post(path, body) {
    const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const answer = await response.json();
    if (!response.ok) throw new Error(answer.error);
    return answer;
  }
  const where = key => key.startsWith("topic:") ? { topic: key.slice(6) } : { ref: key };

  // Where an address leads: a topic opens in the list; a decision opens in its topic; a
  // picture or a text in the viewer, comparing its last two versions when it has them.
  function arrive(route) {
    state.arrived = route;
    state.reveal_to = "";
    const topic = topicNamed(route);
    if (topic) { state.open.add(topic.name); state.reveal_to = `topic-${topic.name}`; return; }
    const item = route ? itemAt(route) : null;
    if (!item) { state.modal = null; return; }
    state.open.add(item.topic);
    if (kindOf(item) === "decision") {
      state.expanded.add(item.ref);
      state.modal = null;
      state.reveal_to = `item-${item.ref}`;
    } else view(item, false);
  }

  function view(item, addressed = true) {
    state.modal = item.ref;
    state.compare = false;
    state.single = state.left = state.right = state.menu = state.zoom = state.reveal = null;
    if (addressed) address(item.ref);
  }
  function address(route) {
    state.route = state.arrived = route;
    const wanted = route ? `#topics/${route}` : "#topics";
    if (decodeURIComponent(location.hash) !== wanted) history.replaceState(null, "", wanted);
  }
  function closeViewer() {
    const item = itemAt(state.modal);
    state.modal = state.zoom = state.menu = state.reveal = null;
    address(item ? item.topic : "");
    draw();
  }
  function step(by) {
    const item = itemAt(state.modal);
    if (!item) return;
    const sequence = viewable(topicNamed(item.topic));
    const next = sequence[sequence.findIndex(entry => entry.ref === item.ref) + by];
    if (next) { view(next); draw(); }
  }

  async function judge(key, verdict) {
    const body = { ...where(key), verdict };
    try {
      const done = await post("topics/judge", body);
      studio.toast(`${done.judged.length === 1 ? done.judged[0] : `${done.judged.length} items`} ${verdict}.`);
    } catch (error) {
      const hint = document.querySelector(`[data-problem="${CSS.escape(key)}"]`);
      if (hint) { hint.textContent = error.message; hint.className = "hint error"; } else studio.toast(error.message);
      return;
    }
    state.seen = "";
    await load();
  }

  async function send(key) {
    const written = (state.drafts.get(`reply:${key}`) || "").trim();
    const files = state.attached.get(key) || [];
    if (!written && !files.length) return;
    if (files.some(file => file.uploading)) { studio.toast("Still uploading: send once the files are up."); return; }
    try { await post("topics/reply", { ...where(key), text: written, ...(files.length ? { attachments: files.map(file => file.token) } : {}) }); } catch (error) { studio.toast(error.message); return; }
    for (const file of files) if (file.preview?.startsWith("blob:")) URL.revokeObjectURL(file.preview);
    state.attached.delete(key);
    state.drafts.delete(`reply:${key}`);
    document.activeElement?.blur();
    state.seen = "";
    await load();
  }

  async function withdraw(key) {
    let taken;
    try { taken = await post("topics/withdraw", where(key)); } catch (error) { studio.toast(error.message); return; }
    state.drafts.set(`reply:${key}`, taken.text);
    if (taken.attachments?.length) state.attached.set(key, [...(state.attached.get(key) || []), ...taken.attachments.map(file => ({ ...file, id: file.token }))]);
    state.focus = `reply:${key}`;
    state.seen = "";
    await load();
  }

  async function prefer(button) {
    const item = itemAt(button.dataset.ref);
    if (!item) return;
    const taking = button.getAttribute("aria-pressed") === "true";
    const body = { ref: item.ref, version: Number(button.dataset.version), ...(taking ? {} : { name: button.dataset.prefer }) };
