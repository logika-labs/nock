  // What the search opened (topics, items, folded sections) it closes again when it no longer
  // finds anything there; what the owner opened stays as they left it.
  function searched() {
    const hits = findHits();
    const wanted = {
      open: new Set(hits.map(item => item.topic)),
      expanded: new Set(hits.filter(item => kindOf(item) === "decision").map(item => item.ref)),
      folded: new Set(hits.map(placeOf)),
    };
    for (const [place, keys] of Object.entries(state.opened)) {
      for (const key of keys) {
        if (wanted[place].has(key)) continue;
        if (place === "folded") setFolded(key, true); else state[place].delete(key);
        if (place === "open") state.chats.delete(`topic:${key}`);
        keys.delete(key);
      }
    }
    for (const [place, keys] of Object.entries(wanted)) {
      for (const key of keys) {
        const shut = place === "folded" ? isFolded(key) : !state[place].has(key);
        if (!shut) continue;
        if (place === "folded") setFolded(key, false); else state[place].add(key);
        state.opened[place].add(key);
      }
    }
    state.hits = hits.map(item => item.ref);
    state.hitAt = 0;
    state.reveal_hit = state.hits.length > 0;
  }
  // The owner opening or closing something takes it from the search: it stays as they set it.
  const owned = (place, key) => state.opened[place].delete(key);
  function jump(by) {
    if (!state.hits.length) return;
    state.hitAt = (state.hitAt + by + state.hits.length) % state.hits.length;
    const item = itemAt(state.hits[state.hitAt]);
    if (item && !state.open.has(item.topic)) { state.open.add(item.topic); state.opened.open.add(item.topic); }
    state.reveal_hit = true;
    draw();
  }
  function markWords(scope, words = said()) {
    for (const old of scope.querySelectorAll("mark.found")) {
      const parent = old.parentNode;
      old.replaceWith(...old.childNodes);
      parent.normalize();
    }
    const wanted = words.filter(word => word.length > 1);
    if (!wanted.length) return;
    const source = wanted.map(word => word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
    const pattern = new RegExp(source, "gi"), holds = new RegExp(source, "i");
    const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, {
      acceptNode: node => node.parentElement.closest("time, .when, textarea, script, style, button.select-button") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
    });
    const nodes = [];
    while (walker.nextNode()) if (holds.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
    for (const node of nodes) {
      const text = node.nodeValue, parts = [];
      let at = 0;
      for (const found of text.matchAll(pattern)) {
        if (found.index > at) parts.push(document.createTextNode(text.slice(at, found.index)));
        const mark = document.createElement("mark");
        mark.className = "found";
        mark.textContent = found[0];
        parts.push(mark);
        at = found.index + found[0].length;
      }
      if (at < text.length) parts.push(document.createTextNode(text.slice(at)));
      node.replaceWith(...parts);
    }
  }

  // --- filling what is fetched, keeping what is typed ---------------------------------------------

  function fill(scope) {
    for (const place of scope.querySelectorAll("[data-text]")) {
      const address = place.dataset.text;
      if (place.filled === address) continue;
      place.filled = address;
      const lines = Number(place.dataset.lines || 0);
      text(address).then(content => {
        if (place.filled !== address) return;
        // A Markdown file's first lines rendered, past its frontmatter, as the viewer shows it.
        if (lines && place.dataset.render === "markdown") place.innerHTML = markdown(frontmatter(content.replace(/\r/g, ""))[1].split("\n").slice(0, lines).join("\n"));
        else if (lines) place.textContent = content.split("\n").slice(0, lines).join("\n");
        else if (place.dataset.render === "markdown") place.innerHTML = markdown(content, true);
        else if (place.dataset.render === "code") place.innerHTML = `<pre><code>${highlight(content, place.dataset.language)}</code></pre>`;
        else place.innerHTML = `<pre>${escape(content)}</pre>`;
        markWords(place);
      }).catch(() => { if (place.filled === address) place.textContent = "This file could not be read."; });
    }
    for (const place of scope.querySelectorAll("[data-pair]")) {
      const pair = place.dataset.pair;
      if (place.filled === pair) continue;
      place.filled = pair;
      Promise.all(pair.split(" ").map(text)).then(([left, right]) => { if (place.filled === pair) { place.innerHTML = diff(left, right); markWords(place); } })
        .catch(() => { if (place.filled === pair) place.innerHTML = '<p class="missing">These files could not be read.</p>'; });
    }
  }

  function restoreDrafts() {
    for (const field of document.querySelectorAll("#topics-tab [data-draft]")) {
      const kept = field.disabled ? "" : state.drafts.get(field.dataset.draft) ?? "";
      if (document.activeElement !== field && field.value !== kept) field.value = kept;
      grow(field);
    }
    if (state.focus) {
      const field = document.querySelector(`#topics-tab [data-draft="${CSS.escape(state.focus)}"]`);
      if (field && !field.disabled) {
        const at = state.caretAt ?? field.value.length;
        field.focus(); field.setSelectionRange(at, at); state.focus = state.caretAt = null;
      }
    }
  }
  function grow(field) {
    if (!CSS.supports("field-sizing", "content")) {
      field.style.height = "auto";
      field.style.height = `${field.scrollHeight + 1}px`;
    }
    edges(field);
  }
  // Grown to its limit, a message scrolls inside its field: its edges fade where more is hidden.
  function edges(field) {
    field.classList.toggle("more-before", field.scrollTop > 1);
    field.classList.toggle("more-after", field.scrollTop + field.clientHeight < field.scrollHeight - 6);
  }

  // An open chat keeps its newest message in sight, and what it shows the owner counts as seen.

  // An open chat keeps its newest message in sight, and the answer it shows counts as seen.
  function keepChats() {
    for (const log of document.querySelectorAll("#topics-tab [data-log]")) {
      const newest = log.lastElementChild?.dataset.key || "";
      if (log.newest !== newest) { log.newest = newest; log.scrollTop = log.scrollHeight; }
    }
    for (const key of state.chats) {
      const topic = topicNamed(key.slice(6));
      if (topic?.chat?.latest) store(seenKey(topic.name), topic.chat.latest);
    }
  }

  function drawBar() {
    const input = $("topics-input");
    $("topics-clear").hidden = !input.value;
    const navigating = searching().length > 0;
    $("topics-hits").hidden = !navigating;
    input.classList.toggle("navigating", navigating);
    if (navigating) {
      $("topics-hits").querySelector(".hit-count").textContent = state.hits.length ? `${state.hitAt + 1}/${state.hits.length}` : "none";
      for (const button of $("topics-hits").querySelectorAll("button")) { button.innerHTML = ICONS.chevron; button.disabled = state.hits.length < 2; }
    }
  }

  function drawCounts() {
    const pending = (state.front?.pending || []).length;
    const busy = new Set((state.front?.pending || []).map(entry => entry.topic)).size;
    const words = pending ? `${pending} open in ${busy} ${busy === 1 ? "topic" : "topics"}` : "nothing waits on you";
    const listening = state.front?.listening?.length ? " · an agent listens" : "";
    studio.summary("topics", state.topics.length ? words + listening : "no topics yet");
  }

  // Work under way, a round or an answer, as a toast that stays while it runs: what it is, the way
  // to its topic, and Stop.
  function drawWorking() {
    const toast = document.getElementById("working");
    const run = (state.front?.working || [])[0];
    toast.hidden = !run;
    if (!run) return;
    const more = state.front.working.length - 1;
    toast.querySelector(".what").innerHTML = `<span class="spinner" aria-hidden="true"></span><span>Working… ${escape(run.title || run.subject || "")}${more > 0 ? ` and ${more} more` : ""}</span>`;
    toast.dataset.run = run.id;
    toast.dataset.topic = run.topic || "";
    toast.querySelector("[data-working-open]").hidden = !run.topic;
  }

  function draw() {
    if (state.route !== state.arrived && state.topics.length) arrive(state.route);
    drawCounts();
    drawBar();
    drawSift();
    drawList();
    drawModal();
    drawLightbox();
    drawWorking();
    if (state.zoom && !state.zoom.boxes) { measureZoom(); drawModal(); drawLightbox(); }
    fill($("topics-tab"));
    markWords($("topics-main"));
    markWords($("topics-modal"));
    restoreDrafts();
    keepChats();
    if (state.reveal_to !== null) {
      const element = state.reveal_to && document.getElementById(state.reveal_to);
      if (element) element.scrollIntoView({ block: "start", behavior: "instant" });
      else if (state.reveal_to === "") scrollTo({ top: 0, behavior: "instant" });
      if (element || state.reveal_to === "" || !state.open.size) state.reveal_to = null;
    }
    if (state.reveal_hit && !state.modal) {
      state.reveal_hit = false;
      const card = document.getElementById(`item-${state.hits[state.hitAt]}`);
      const hit = card?.classList.contains("decision") ? card.querySelector("mark.found") || card : card;
      // A hit taller than most of the screen shows from its top; a smaller one in the middle.
      hit?.scrollIntoView({ block: hit.offsetHeight > innerHeight * .6 ? "start" : "center", inline: "nearest", behavior: "smooth" });
      hit?.classList.add("current");
    }
  }

  // --- talking to nock ----------------------------------------------------------------------------

  async function api(path, body) {
    const response = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const answer = await response.json();
    if (!response.ok) throw new Error(answer.error);
    return answer;
  }
  // The list, and each open topic whole, read again only when the store moved (`/api/stamp`).
  async function load(force = false) {
    try {
      const { stamp } = await api("/api/stamp");
      const wanted = new Set([...state.open, ...[...state.chats].map(key => key.slice(6)), ...(state.modal ? [topicOf(state.modal)] : [])]);
      const missing = [...wanted].filter(name => !state.wholes.has(name));
      if (!force && stamp === state.seen && !missing.length) return;
      if (force || stamp !== state.seen) { state.front = await api("/api/topics"); state.wholes.clear(); }
      state.seen = stamp;
      const names = new Set(state.front.tasks.map(task => task.name));
      await Promise.all([...wanted].filter(name => names.has(name) && !state.wholes.has(name)).map(async name => {
        try { state.wholes.set(name, await api(`/api/topic/${encodeURIComponent(name)}`)); } catch { /* gone meanwhile */ }
      }));
      state.topics = state.front.tasks.map(task => expand(task, state.wholes.get(task.name)));
      if (said().length) find(false);
      draw();
    } catch {
      studio.summary("topics", "Lost touch with nock — is `nock studio` still running?");
    }
  }
  const reload = () => load(true);

  // Where an address leads: a topic opens in the list; an item opens in its topic; an asset in the
  // viewer. `~chat` after it opens its chat too (`#topics/TOPIC~chat`), `~reply` with its field ready
  // to write, `~vN` shows version N: where the Timeline's notifications lead.
  function arrive(route) {
    state.arrived = route;
    state.reveal_to = "";
    const [place, focus = ""] = route.split("~");
    const topic = topicNamed(place);
    if (topic) {
      state.open.add(topic.name); state.reveal_to = `topic-${topic.name}`; state.modal = null;
      if (focus === "chat" || focus === "reply") state.chats.add(`topic:${topic.name}`);
      if (focus === "reply") state.focus = `reply:topic:${topic.name}`;
      if (!topic.whole) load();
      return;
    }
    const item = place ? itemAt(place.includes(":") ? place : place.replace(/^([^/]+)\//, "$1/")) : null;
    if (!item) { state.modal = null; return; }
    state.open.add(item.topic);
    if (kindOf(item) === "decision") {
      setFolded(`${item.topic}/${groupOf(item)}`, false);
      state.expanded.add(item.ref);
      state.modal = null;
      state.reveal_to = `item-${item.ref}`;
    } else view(item, false);
    if (focus === "chat" || focus === "reply") state.chats.add(`topic:${item.topic}`);
    if (focus === "reply") state.focus = `reply:topic:${item.topic}`;
    const number = focus.match(/^v(\d+)$/);
    if (number && kindOf(item) !== "decision") state.single = Number(number[1]);
    if (!topicNamed(item.topic).whole) load();
  }

  function view(item, addressed = true) {
    state.modal = item.ref;
    state.compare = false;
    state.single = state.left = state.right = state.menu = state.zoom = state.reveal = null;
    if (addressed) address(item.ref);
    if (!topicNamed(item.topic)?.whole) load();
  }
  function address(route) {
    state.route = state.arrived = route;
    const wanted = route ? `#topics/${route}` : "#topics";
    if (decodeURIComponent(location.hash) !== wanted) history.replaceState(null, "", wanted);
  }
  function closeViewer() {
    const item = itemAt(state.modal);
    state.modal = state.zoom = state.menu = state.reveal = null;
    address(item ? item.topic : "");
    draw();
  }
  function step(by) {
    const item = itemAt(state.modal);
    if (!item) return;
    const sequence = viewable(topicNamed(item.topic)).filter(entry => entry.versions.length);
    const next = sequence[sequence.findIndex(entry => entry.ref === item.ref) + by];
    if (next) { view(next); draw(); }
  }
  // A problem said where the owner acted: in the hint beside the buttons, else as a toast.
  function problem(key, message) {
    const hint = document.querySelector(`[data-problem="${CSS.escape(key)}"]`);
    if (hint) { hint.textContent = message; hint.className = "hint error"; } else studio.toast(message);
  }

  async function judge(ref, verdict) {
    try { await api("/api/verdict", { ref, verdict }); } catch (error) { problem(ref, error.message); return; }
    studio.toast(`${verdict === "accepted" ? "Accepted" : "Rejected"}.`);
    await reload();
  }
  async function done(name) {
    let answer;
    try { answer = await api("/api/done", { topic: name }); } catch (error) { problem(`topic:${name}`, error.message); return; }
    studio.toast(answer.sent ? "Done: your notes went to the agent." : "Done.");
    await reload();
  }
  async function keepNote(ref, on) {
    const item = itemAt(ref);
    const written = (state.drafts.get(`note:${ref}`) || "").trim();
    if (!item || !written) return;
    try { await api("/api/note", { topic: item.topic, on, text: written, id: messageId() }); } catch (error) { studio.toast(`Not kept: ${error.message}`); return; }
    state.drafts.delete(`note:${ref}`);
    state.noting = null;
    studio.toast("Kept: it goes to the agent with your next message, or with Done.");
    await reload();
  }
  async function unnote(topic, id) {
    const note = topicNamed(topic)?.notes.find(entry => entry.id === id);
    if (!note) return;
    try { await api("/api/note", { topic, on: note.on, text: "", replaces: id }); } catch (error) { studio.toast(error.message); return; }
    await reload();
  }

  async function send(key) {
    const written = (state.drafts.get(`reply:${key}`) || "").trim();
    const files = state.attached.get(key) || [];
    if (!written && !files.length) return;
    if (files.some(file => file.uploading)) { studio.toast("Still uploading: send once the files are up."); return; }
    if (state.sending.has(key)) return;
    // One id per message, kept until it is sent: sent again after a failure, it is written once.
    const tokens = files.map(file => file.token);
    const said = JSON.stringify([written, tokens]);
    const kept = state.sendIds.get(key);
    const id = kept?.said === said ? kept.id : messageId();
    state.sendIds.set(key, { said, id });
    state.sending.add(key);
    let answer;
    try { answer = await api("/api/send", { topic: key.slice(6), text: written, id, attachments: tokens }); }
    catch (error) { studio.toast(`Not sent: ${error.message}`); return; }
    finally { state.sending.delete(key); }
    if (answer.run?.problem) studio.toast(answer.run.problem);
    else if (answer.run?.listening) studio.toast("The agent waiting on its inbox has your message.");
    state.sendIds.delete(key);
    for (const file of files) if (file.preview?.startsWith("blob:")) URL.revokeObjectURL(file.preview);
    state.attached.delete(key);
    state.drafts.delete(`reply:${key}`);
    document.activeElement?.blur();
    await reload();
  }

  // --- what a composer carries: files ---------------------------------------------------------------

  // Each file is uploaded at once, shown meanwhile from the browser's own copy.
  let uploads = 0;
  function attach(key, files) {
    const list = state.attached.get(key) || [];
    state.attached.set(key, list);
    for (const file of files) {

  function unattach(key, id) {

  // --- events -------------------------------------------------------------------------------------

  const root = $("topics-tab");

    const sending = target.closest("[data-send]");

    const attaching = target.closest("[data-attach]");

    const unnoting = target.closest("[data-unnote]");

    if (target.closest("[data-close]") || target.matches("[data-backdrop]")) { closeViewer(); return; }

    const toggle = target.closest("[data-toggle]");
    if (toggle) {

  });
  root.addEventListener("input", event => {
    const field = event.target;

      if (syncing || !video.matches?.("#topics-modal .panes.several video.player")) return;
      syncing = true;
      for (const other of document.querySelectorAll("#topics-modal .panes.several video.player")) {
        if (other === video) continue;
        if (kind === "seeked" && Math.abs(other.currentTime - video.currentTime) > .05) other.currentTime = video.currentTime;
        if (kind === "ratechange") other.playbackRate = video.playbackRate;
        if (kind === "play" && other.paused) { other.currentTime = video.currentTime; other.play().catch(() => {}); }
        if (kind === "pause" && !other.paused) other.pause();
      }
      setTimeout(() => { syncing = false; }, 0);
    }, true);
  }
  root.addEventListener("pointerdown", event => {
    const shot = event.target.closest(".shot.zoomed");
    state.dragged = false;
    const box = state.zoom?.boxes?.[shot?.dataset.shot];

      state.drag.moved += Math.abs(dx) + Math.abs(dy);

    state.zoom.y = clamp((event.clientY - rect.top) / rect.height);
    placeZoom();
  });
  const dropDrag = () => { if (state.drag) { state.dragged = state.drag.moved > 6; state.drag = null; } };
  root.addEventListener("pointerup", dropDrag);
  root.addEventListener("pointercancel", dropDrag);
  addEventListener("resize", () => { if (state.zoom) { state.zoom = null; draw(); } });
  document.addEventListener("keydown", event => {
    if (!state.shown) return;
    const target = event.target;
    if (target.id === "topics-input") {
      if (event.key === "Enter" && !event.isComposing) { event.preventDefault(); jump(event.shiftKey ? -1 : 1); }
      else if (event.key === "Escape") { target.value = ""; state.search = ""; find(true); target.blur(); }
      return;
    }

      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); send(target.dataset.draft.slice(6)); }

    }

        event.preventDefault();

      event.preventDefault();
      target.click();
      return;
    }
    if (event.key === "Escape") {
      if (state.hint) { state.hint = null; draw(); }
      else if (state.picture && state.zoom === null) closePicture();
      else if (state.menu) { state.menu = null; draw(); }
      else if (state.reveal !== null) { state.reveal = null; draw(); }
      else if (state.zoom !== null) { state.zoom = null; draw(); }
      else if (state.modal) closeViewer();
      else return;
      event.preventDefault();
      return;
    }

    if (players.length && (event.key === " " || event.key === "k") && !target.closest?.("button, video")) {

      const first = players[0];
      if (first.paused) first.play().catch(() => {}); else first.pause();
      return;
    }

  // An html block speaks to the page through its bridge: its height, a note on itself, a
  // proposal's verdict, an address to open.
  addEventListener("message", event => {
    const said = event.data;
    if (!said?.nock) return;
    const frame = [...document.querySelectorAll("#topics-tab iframe.page")].find(each => each.contentWindow === event.source);
    if (!frame) return;
    const figure = frame.closest("figure");
    const topic = frame.closest("[data-key^='topic:']")?.dataset.key.slice(6);
    if (said.action === "size" && Number.isFinite(said.height)) frame.style.height = `${Math.min(2000, Math.max(40, said.height))}px`;
    else if (said.action === "verdict" && topic) judge(`${topic}/${said.item}`, said.verdict);
    else if (said.action === "open" && typeof said.address === "string") { location.hash = said.address; }
    else if (said.action === "note" && topic && said.text) {

        .then(() => { studio.toast("Kept: it goes to the agent with your next message, or with Done."); reload(); })
        .catch(error => studio.toast(error.message));

  // --- the filters beside the bar, and the rounds due ---------------------------------------------

  // One filter at a time, with the search: what needs the owner (open proposals, a review not yet

  // (accepted proposals not carried out), active topics. Done and abandoned topics, and rejected
  // proposals, show only when asked. Kept per browser.
  const SIFTS = {
    all: { label: "All" },
    me: { label: "Needs me", title: "Open proposals, reviews to finish, and answers you have not seen",
      topic: topic => (reviewOf(topic) || topic.review) && !topic.reviewed || standing(topic).unseen > 0, item: item => awaitsOwner(item) },
    agent: { label: "Waiting on agent", title: "You wrote last: the agent's answer is due", topic: topic => topic.chat?.pending, item: () => false },
    todo: { label: "Todo", title: "Accepted proposals still to carry out", item: item => todo(item) },
    active: { label: "Active", title: "Topics whose work is under way", whole: topic => topic.state === "active" },
  };
  const CLOSED_STATES = ["done", "abandoned"];
  const stored = (key, fallback) => { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } };
  const store = (key, value) => { try { if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value); } catch { /* a private window */ } };
  state.sift = SIFTS[stored("nock.work.sift", "all")] ? stored("nock.work.sift", "all") : "all";
  state.closed = stored("nock.work.closed", "") === "1";
  // Assets as a grid of cards or a list of rows: kept per browser.
  state.layout = stored("nock.topics.layout", "grid") === "list" ? "list" : "grid";

  // What a topic shows under the filters: its items that pass, or null to leave it out.
  function sifted(topic, sift = state.sift, closed = state.closed) {
    if (!closed && CLOSED_STATES.includes(topic.state)) return null;
    const filter = SIFTS[sift];
    const kept = closed ? topic.items : topic.items.filter(item => item.status !== "rejected");
    if (filter.whole) return filter.whole(topic) ? kept : null;
    if (!filter.item) return kept;
    const items = kept.filter(item => !item.asset && filter.item(item));
    return items.length || filter.topic?.(topic) ? (items.length ? items : kept) : null;
  }
  function siftCount(sift) {
    const kept = state.topics.map(topic => [topic, sifted(topic, sift)]).filter(([, items]) => items);
    if (SIFTS[sift].whole || sift === "all") return kept.length;
    return kept.reduce((sum, [topic]) => sum + topic.items.filter(item => !item.asset && SIFTS[sift].item(item)).length + (SIFTS[sift].topic?.(topic) ? 1 : 0), 0);
  }
  // A round due, where Tidy up was: one quiet button naming it; open, what it does and why it is
  // due, how often it comes (after how many changes), Run, Later and Never.
  const CLOCK = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.75" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 6.5V10l2.5 1.75" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function roundHint() {
    const due = (state.front?.hints || []).filter(hint => hint.on && !hint.unavailable);
    const running = new Set((state.front?.working || []).filter(run => run.kind === "round").map(run => run.subject));
    const hint = due.find(entry => !running.has(entry.protocol));
    if (!hint) return "";
    const open = state.hint === hint.protocol;
    const others = due.length - 1;
    const measure = hint.measure || {};
    const often = measure.threshold ? `<p class="often">Due after <input type="number" min="1" value="${escape(measure.threshold)}" data-round="threshold" data-name="${escape(hint.protocol)}" aria-label="How many"> ${escape(measure.measure || "changes")}${measure.value !== null && measure.value !== undefined ? `; ${escape(measure.value)} so far` : ""}.</p>` : "";

        <p><strong>${escape(hint.title)} is due: ${escape(hint.due)}.</strong> ${escape(hint.summary)}</p>${often}
        <div class="buttons"><button type="button" class="button ghost" data-round="never" data-name="${escape(hint.protocol)}">Never</button><button type="button" class="button secondary" data-round="later" data-name="${escape(hint.protocol)}">In a week</button><button type="button" class="button primary" data-round="run" data-name="${escape(hint.protocol)}">Run</button></div></div>` : "";
    return `<span class="tidy-anchor" data-key="round"><button type="button" class="tidy" data-round="open" data-name="${escape(hint.protocol)}" aria-expanded="${open}" title="${escape(`${hint.title} is due: ${hint.due}`)}">${CLOCK}<span>${escape(hint.title)} is due${others > 0 ? ` · ${others} more` : ""}</span></button>${confirm}</span>`;
  }
  function drawSift() {
    const chips = Object.entries(SIFTS).map(([name, filter]) =>

    const closedCount = state.topics.filter(topic => CLOSED_STATES.includes(topic.state)).length
      + state.topics.flatMap(topic => topic.items).filter(item => item.status === "rejected").length;
    const closed = `<button type="button" class="chip closed" data-sift="closed" data-key="sift:closed" aria-pressed="${state.closed}" title="${state.closed ? "Hide" : "Show"} done and abandoned topics, and rejected proposals">Show closed <span class="count">${closedCount}</span></button>`;
    studio.morph($("topics-sift"), `<div class="chips" role="group" aria-label="Filter" data-key="sifts">${chips}${closed}</div>${roundHint()}`);
  }
  function siftAction(button) {

  async function roundAction(button) {
    const { round: what, name } = button.dataset;
    if (what === "open") { state.hint = state.hint === name ? null : name; draw(); return; }
    if (what === "threshold") return;
    state.hint = null;
    try {
      if (what === "run") { await api("/api/rounds/run", { name }); studio.toast("Started: it runs in the background."); }
      else if (what === "later") { await api("/api/rounds/snooze", { name, days: 7 }); studio.toast("It will remind you in a week."); }
      else if (what === "never") { await api("/api/rounds/snooze", { name, never: true }); studio.toast("Turned off: it won't remind you again."); }
    } catch (error) { studio.toast(error.message); }
    await reload();
  }

  // The work-under-way toast (after this tab in the page): Open goes to its topic, Stop stops it.
  document.addEventListener("click", event => {
    const toast = event.target.closest?.("#working");
    if (!toast) return;
    if (event.target.closest("[data-working-open]") && toast.dataset.topic) location.hash = `#topics/${toast.dataset.topic}`;
    if (event.target.closest("[data-working-stop]")) api("/api/runs/stop", { id: toast.dataset.run }).then(() => { studio.toast("Stopped."); reload(); }).catch(error => studio.toast(error.message));
  });

  // Shown, the tab keeps up with what agents submit: it asks again every few seconds.
  studio.register("topics", {
    // Coming back to the same address, the list is as it was left: nothing is arrived at again (which
    // would scroll), and the poll redraws in place only what changed meanwhile.
    show(route) {
      state.shown = true;
      if ((route || "") !== state.route || state.arrived === null) { state.route = route || ""; state.arrived = null; }
      load();
    },
    hide() { state.shown = false; document.documentElement.classList.remove("topics-viewing"); },
  });
  // The work under way shows on every tab: the list is read while hidden too, less often.
  setInterval(() => { if (state.shown || !document.hidden) load(); }, POLL);
  // Times move on with the clock, though nothing new arrives.
  setInterval(() => { if (state.shown) draw(); }, 30000);
})();
</script>
