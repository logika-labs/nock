    try { await post("topics/prefer", body); } catch (error) { studio.toast(error.message); return; }
    state.seen = "";
    await load();
  }

  async function ask() {
    const question = $("topics-input").value.trim();
    if (!question || state.ask?.running) return;
    try { state.ask = await post("topics/ask", { question }); } catch (error) { studio.toast(error.message); return; }
    state.dismissed = null;
    state.seen = "";
    draw();
  }

  // --- what a composer carries: files, and what is said into it ---------------------------------

  // Each file is uploaded at once, shown meanwhile from the browser's own copy.
  let uploads = 0;
  function attach(key, files) {
    const standing = key.startsWith("topic:") ? topicNamed(key.slice(6))?.chat : itemAt(key)?.chat;
    if (standing?.pending) { studio.toast("Your last message waits for the agent's answer: withdraw it to add to it."); return; }
    const list = state.attached.get(key) || [];
    state.attached.set(key, list);
    for (const file of files) {
      const chip = { id: `upload-${++uploads}`, name: file.name || "pasted", bytes: file.size, type: file.type.startsWith("image/") ? "image" : "file", uploading: true,
        preview: file.type.startsWith("image/") ? URL.createObjectURL(file) : "" };
      list.push(chip);
      fetch(`topics/upload?name=${encodeURIComponent(chip.name)}`, { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: file })
        .then(async response => { const answer = await response.json(); if (!response.ok) throw new Error(answer.error); return answer; })
        .then(kept => Object.assign(chip, kept, { uploading: false, id: chip.id }))
        .catch(error => { studio.toast(`${chip.name}: ${error.message}`); unattach(key, chip.id); })
        .finally(draw);
    }
    draw();
  }
  function unattach(key, id) {
    const list = state.attached.get(key) || [];
    const chip = list.find(file => file.id === id);
    if (!chip) return;
    state.attached.set(key, list.filter(file => file !== chip));
    if (chip.preview?.startsWith("blob:")) URL.revokeObjectURL(chip.preview);
    if (chip.token) post("topics/upload/discard", { token: chip.token }).catch(() => {});
    draw();
  }
  function pickFiles(key) {
    const input = document.createElement("input");
    input.type = "file";
    input.multiple = true;
    input.hidden = true;
    input.addEventListener("change", () => { if (input.files?.length) attach(key, [...input.files]); input.remove(); });
    input.addEventListener("cancel", () => input.remove());
    document.body.append(input);
    input.click();
  }

  // One recording at a time: the microphone asked for on the first, the text written where the
  // cursor was in that chat's field, for the owner to edit and send.
  async function record(key) {
    if (!state.transcription?.enabled) { studio.toast(state.transcription?.hint || "Transcription is off."); return; }
    if (state.recording) {
      if (state.recording.key === key) state.recording.recorder.stop();
      else studio.toast("A recording is under way in another chat: stop it first.");
      return;
    }
    if (state.transcribing) { studio.toast("Still writing the last recording."); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (error) {
      studio.toast(`No microphone: ${error.message}`);
      return;
    }
    const taken = new MediaRecorder(stream);
    const chunks = [];
    taken.addEventListener("dataavailable", event => { if (event.data.size) chunks.push(event.data); });
    taken.addEventListener("stop", () => {
      for (const track of stream.getTracks()) track.stop();
      clearInterval(state.recording?.ticker);
      state.recording = null;
      transcribe(key, new Blob(chunks, { type: taken.mimeType || "audio/webm" }));
    });
    taken.start();
    const ticker = setInterval(() => { for (const place of document.querySelectorAll("#topics [data-elapsed]")) place.textContent = elapsed(state.recording?.started ?? Date.now()); }, 250);
    state.recording = { key, recorder: taken, started: Date.now(), ticker };
    state.failed.delete(key);
    draw();
  }
  async function transcribe(key, audio) {
    state.transcribing = key;
    state.failed.delete(key);
    draw();
    try {
      const response = await fetch("topics/transcribe", { method: "POST", headers: { "Content-Type": audio.type || "audio/webm" }, body: audio });
      const answer = await response.json();
      if (!response.ok) throw new Error(answer.error);
      insert(key, answer.text || "");
    } catch (error) {
      state.failed.set(key, { audio, error: `Not transcribed: ${error.message}` });
    } finally {
      state.transcribing = null;
      draw();
    }
  }
  // The words go where the cursor was (the end, if it never was), set apart by a space.
  function insert(key, words) {
    words = words.trim();
    if (!words) { studio.toast("Nothing was heard."); return; }
    const draft = state.drafts.get(`reply:${key}`) || "";
    const [start, end] = state.carets.get(key) || [draft.length, draft.length];
    const before = draft.slice(0, start), after = draft.slice(end);
    const spaced = `${before && !/\s$/.test(before) ? " " : ""}${words}${after && !/^\s/.test(after) ? " " : ""}`;
    state.drafts.set(`reply:${key}`, before + spaced + after);
    state.carets.set(key, [start + spaced.length, start + spaced.length]);
    state.focus = `reply:${key}`;
    state.caretAt = start + spaced.length;
  }
  const keyOfDraft = field => field?.dataset?.draft?.startsWith("reply:") ? field.dataset.draft.slice(6) : null;
  function caret(field) {
    const key = keyOfDraft(field);
    if (key) state.carets.set(key, [field.selectionStart, field.selectionEnd]);
  }

  function enlarge(button) {
    state.picture = { address: button.dataset.picture, name: button.dataset.name, topic: button.dataset.topic };
    state.zoom = null;
    draw();
  }
  function closePicture() { state.picture = state.zoom = null; draw(); }

  // A chat opens what it belongs to: its topic, or its decision.
  function toggleChat(key) {
    if (state.chats.has(key)) state.chats.delete(key);
    else {
      state.chats.add(key);
      if (key.startsWith("topic:")) state.open.add(key.slice(6));
      else if (!state.modal) state.expanded.add(key);
      if (!state.drafts.get(`reply:${key}`)) state.focus = `reply:${key}`;
    }
    draw();
  }

  // --- events -------------------------------------------------------------------------------------

  const root = $("topics");
  root.addEventListener("click", event => {
    const target = event.target;
    if (state.menu && !target.closest(".select")) { state.menu = null; draw(); if (!target.closest("button")) return; }
    if (state.reveal !== null && !target.closest(".path-anchor")) { state.reveal = null; draw(); if (!target.closest("button")) return; }
    const mode = target.closest("[data-bar-mode]");
    if (mode) {
      state.mode = mode.dataset.barMode;
      state.search = state.mode === "search" ? $("topics-input").value : "";
      find(true);
      $("topics-input").focus();
      return;
    }
    if (target.closest("#topics-clear")) { $("topics-input").value = ""; state.search = ""; find(true); $("topics-input").focus(); return; }
    const hopping = target.closest("[data-hit]");
    if (hopping) { jump(Number(hopping.dataset.hit)); return; }
    if (target.closest("#topics-send")) { ask(); return; }
    if (target.closest("[data-ask-cancel]")) { post("topics/ask/cancel", {}).then(found => { state.ask = found; draw(); }); return; }
    if (target.closest("[data-ask-dismiss]")) { state.dismissed = state.ask?.started; draw(); return; }
    const chatting = target.closest("[data-chat]");
    if (chatting) { toggleChat(chatting.dataset.chat); return; }
    const sending = target.closest("[data-send]");
    if (sending) { send(sending.dataset.send); return; }
    const withdrawing = target.closest("[data-withdraw]");
    if (withdrawing) { withdraw(withdrawing.dataset.withdraw); return; }
    const attaching = target.closest("[data-attach]");
    if (attaching) { pickFiles(attaching.dataset.attach); return; }
    const removing = target.closest("[data-unattach]");
    if (removing) { unattach(removing.dataset.unattach, removing.dataset.id); return; }
    const recording = target.closest("[data-record]");
    if (recording) { record(recording.dataset.record); return; }
    const retrying = target.closest("[data-retry]");
    if (retrying) { const failed = state.failed.get(retrying.dataset.retry); if (failed) transcribe(retrying.dataset.retry, failed.audio); return; }
    const forgetting = target.closest("[data-forget]");
    if (forgetting) { state.failed.delete(forgetting.dataset.forget); draw(); return; }
    const enlarging = target.closest("[data-picture]");
    if (enlarging) { enlarge(enlarging); return; }
    if (target.closest("[data-lightbox-close]") || target.matches("[data-lightbox-backdrop]")) { closePicture(); return; }
    const judging = target.closest("[data-judge]");
    if (judging) { judge(judging.dataset.judge, judging.dataset.verdictChoice); return; }
    const shot = target.closest("[data-shot]");
    if (shot) {
      if (state.dragged) { state.dragged = false; return; }
      if (state.zoom) state.zoom = null; else zoomIn(shot, event);
      draw();
      return;
    }
    const preferring = target.closest("[data-prefer]");
    if (preferring) { prefer(preferring); return; }
    const pathing = target.closest("[data-path]");
    if (pathing) { const index = Number(pathing.dataset.path); state.reveal = state.reveal === index ? null : index; draw(); return; }
    const unfolding = target.closest("[data-unfold]");
    if (unfolding) {
      for (const row of unfolding.closest("table").querySelectorAll(`tr[data-run="${unfolding.dataset.unfold}"]`)) row.hidden = false;
      unfolding.remove();
      return;
    }
    const folding = target.closest("[data-fold]");
    if (folding) { const key = folding.dataset.fold; owned("folded", key); state.folded.has(key) ? state.folded.delete(key) : state.folded.add(key); draw(); return; }
    if (target.closest("[data-close]") || target.matches("[data-backdrop]")) { closeViewer(); return; }
    const menu = target.closest("[data-menu]");
    if (menu) { state.menu = state.menu === menu.dataset.menu ? null : menu.dataset.menu; draw(); return; }
    const pick = target.closest("[data-pick]");
    if (pick) { state[pick.dataset.pick] = Number(pick.dataset.number); state.menu = state.zoom = null; draw(); return; }
    if (target.closest("[data-compare]")) { state.compare = !state.compare; state.left = state.right = state.zoom = state.reveal = null; draw(); return; }
    const viewing = target.closest("[data-view]");
    if (viewing) { const item = itemAt(viewing.dataset.view); if (item) { view(item); draw(); } return; }
    const going = target.closest("[data-go]");
    if (going) { state.arrived = null; state.route = itemAt(going.dataset.go)?.ref ?? going.dataset.go; address(state.route); state.arrived = null; draw(); return; }
    if (target.closest(".chat, a, textarea")) return;
    const expand = target.closest("[data-expand]");
    if (expand) { const ref = expand.dataset.expand; owned("expanded", ref); state.expanded.has(ref) ? state.expanded.delete(ref) : state.expanded.add(ref); draw(); return; }
    const toggle = target.closest("[data-toggle]");
    if (toggle) {
      const name = toggle.dataset.toggle;
      owned("open", name);
      if (state.open.has(name)) { state.open.delete(name); state.chats.delete(`topic:${name}`); } else state.open.add(name);
      draw();
    }
  });
  root.addEventListener("input", event => {
    const field = event.target;
    if (field.id === "topics-input") { if (state.mode === "search") { state.search = field.value; find(true); } draw(); return; }
    if (field.dataset.draft) { state.drafts.set(field.dataset.draft, field.value); grow(field); caret(field); }
  });
  // Where the cursor is in each chat's field, for the recorder's words.
  for (const kind of ["keyup", "mouseup", "select", "focusout"]) root.addEventListener(kind, event => caret(event.target), true);
  root.addEventListener("paste", event => {
    const key = keyOfDraft(event.target);
    const files = [...(event.clipboardData?.files || [])];
    if (key && files.length) { event.preventDefault(); attach(key, files); }
  });
  // Files dragged over a chat light it up; dropped there they are attached. Dropped anywhere else,
  // nothing happens: the browser does not leave the studio to show them.
  const dragsFiles = event => [...(event.dataTransfer?.types || [])].includes("Files");
  document.addEventListener("dragover", event => {
    if (!state.shown || !dragsFiles(event)) return;
    event.preventDefault();
    const over = event.target.closest?.("#topics [data-drop]");
    const key = over && !over.querySelector(".composer.frozen") ? over.dataset.drop : null;
    event.dataTransfer.dropEffect = key ? "copy" : "none";
    if (state.dropping !== key) { state.dropping = key; draw(); }
  });
  document.addEventListener("dragleave", event => {
    if (state.dropping && !event.relatedTarget) { state.dropping = null; draw(); }
  });
  document.addEventListener("drop", event => {
    if (!state.shown || !dragsFiles(event)) return;
    event.preventDefault();
    const over = event.target.closest?.("#topics [data-drop]");
    state.dropping = null;
    if (over) attach(over.dataset.drop, [...event.dataTransfer.files]); else draw();
  });
  // A zoomed picture follows the mouse; on a touch screen it is dragged, and a tap leaves the zoom.
  root.addEventListener("mouseover", event => {
    const mark = event.target.closest("[data-tip]");
    if (mark) showTip(mark); else $("topics-tip").hidden = true;
  });
  root.addEventListener("mouseleave", () => { $("topics-tip").hidden = true; });
  addEventListener("scroll", () => { $("topics-tip").hidden = true; }, { passive: true });
  root.addEventListener("scroll", event => { if (event.target.matches?.("textarea[data-draft]")) edges(event.target); }, true);
  // A still's length, once its video's metadata comes.
  root.addEventListener("loadedmetadata", event => {
    const video = event.target;
    if (!video.dataset?.length || !Number.isFinite(video.duration)) return;
    lengths.set(video.dataset.length, video.duration);
    const label = video.parentElement.querySelector(".length");
    if (label) label.textContent = clock(video.duration);
  }, true);
  // Compared side by side, two versions play, pause and seek together.
  let syncing = false;
  for (const kind of ["play", "pause", "seeked", "ratechange"]) {
    root.addEventListener(kind, event => {
      const video = event.target;
      if (syncing || !video.matches?.("#topics-modal .panes.several video.player")) return;
      syncing = true;
      for (const other of document.querySelectorAll("#topics-modal .panes.several video.player")) {
        if (other === video) continue;
        if (kind === "seeked" && Math.abs(other.currentTime - video.currentTime) > .05) other.currentTime = video.currentTime;
        if (kind === "ratechange") other.playbackRate = video.playbackRate;
        if (kind === "play" && other.paused) { other.currentTime = video.currentTime; other.play().catch(() => {}); }
        if (kind === "pause" && !other.paused) other.pause();
      }
      setTimeout(() => { syncing = false; }, 0);
    }, true);
  }
  root.addEventListener("pointerdown", event => {
    const shot = event.target.closest(".shot.zoomed");
    state.dragged = false;
    if (!shot || event.pointerType === "mouse") return;
    state.drag = { x: event.clientX, y: event.clientY, moved: 0, box: state.zoom.boxes[shot.dataset.shot] };
    try { shot.setPointerCapture(event.pointerId); } catch { /* a pointer already gone */ }
  });
  root.addEventListener("pointermove", event => {
    if (!state.zoom) return;
    if (state.drag) {
      const { box } = state.drag, dx = event.clientX - state.drag.x, dy = event.clientY - state.drag.y;
      state.drag.moved += Math.abs(dx) + Math.abs(dy);
      state.drag.x = event.clientX; state.drag.y = event.clientY;
      if (box.wide > box.width) state.zoom.x = clamp(state.zoom.x - dx / (box.wide - box.width));
      if (box.tall > box.height) state.zoom.y = clamp(state.zoom.y - dy / (box.tall - box.height));
      placeZoom();
      return;
    }
    const shot = event.pointerType === "mouse" && event.target.closest(".shot.zoomed");
    if (!shot) return;
    const rect = shot.getBoundingClientRect();
    state.zoom.x = clamp((event.clientX - rect.left) / rect.width);
    state.zoom.y = clamp((event.clientY - rect.top) / rect.height);
    placeZoom();
  });
  const dropDrag = () => { if (state.drag) { state.dragged = state.drag.moved > 6; state.drag = null; } };
  root.addEventListener("pointerup", dropDrag);
  root.addEventListener("pointercancel", dropDrag);
  addEventListener("resize", () => { if (state.zoom) { state.zoom = null; draw(); } });
  document.addEventListener("keydown", event => {
    if (!state.shown) return;
    const target = event.target;
    if (target.id === "topics-input") {
      if (event.key === "Enter" && state.mode === "ask") { event.preventDefault(); ask(); }
      else if (event.key === "Enter" && !event.isComposing) { event.preventDefault(); jump(event.shiftKey ? -1 : 1); }
      else if (event.key === "Escape") { target.value = ""; state.search = ""; find(true); target.blur(); }
      return;
    }
    if (target.dataset?.draft?.startsWith("reply:")) {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); send(target.dataset.draft.slice(6)); }
      else if (event.key === "Escape") target.blur();
      return;
    }
    if (["TEXTAREA", "INPUT"].includes(target.tagName)) return;
    if (event.key === "Escape") {
      if (state.picture && state.zoom === null) closePicture();
      else if (state.menu) { state.menu = null; draw(); }
      else if (state.reveal !== null) { state.reveal = null; draw(); }
      else if (state.zoom !== null) { state.zoom = null; draw(); }
      else if (state.modal) closeViewer();
      else return;
      event.preventDefault();
      return;
    }
    const players = state.modal && !state.picture ? [...document.querySelectorAll("#topics-modal video.player")] : [];
    if (players.length && (event.key === " " || event.key === "k") && !target.closest?.("button, video")) {
      event.preventDefault();
      const first = players[0];
      if (first.paused) first.play().catch(() => {}); else first.pause();
      return;
    }
    if (state.modal && !state.picture && (event.key === "ArrowLeft" || event.key === "ArrowRight")) {
      event.preventDefault();
      step(event.key === "ArrowLeft" ? -1 : 1);
      return;
    }
    if (event.key === "/" && !state.modal) { event.preventDefault(); $("topics-input").focus(); }
  });

  // Shown, the tab keeps up with what agents submit: it asks again every few seconds.
  studio.register("topics", {
    show(route) {
      state.shown = true;
      state.route = route || "";
      state.arrived = null;
      state.seen = "";
      load();
    },
    hide() { state.shown = false; document.documentElement.classList.remove("topics-viewing"); },
  });
  setInterval(() => { if (state.shown) load(); }, POLL);
  // Times move on with the clock, though nothing new arrives.
  setInterval(() => { if (state.shown) draw(); }, 30000);
})();
</script>
