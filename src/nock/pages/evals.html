<div class="frame evals" id="evals">
  <div class="picker" id="evals-picker" role="group" aria-label="Scenario"></div>
  <div id="evals-body"></div>
  <div class="tip" id="evals-tip" role="tooltip" hidden></div>
  <dialog class="viewer" id="evals-viewer" aria-label="File">
    <header><strong id="evals-viewer-name"></strong><button type="button" class="button secondary" data-close>Close</button></header>
    <pre id="evals-viewer-text"></pre>
  </dialog>
</div>
<script>
// The evals tab (its look is pages/evals.css): the server folds a scenario's jobs into units per
// column (`POST evals/NAME/explore` with the view below) and says each one's card; this script lays
// them out, draws the wires, shows a card on hover, narrows on click, weighs a change, and polls
// the statuses every few seconds while a run goes.
(() => {
  const view = {
    scenarios: [], name: null, page: null, mode: "graph",
    target: null, lanes: null, path: [], expanded: [], change: null,
    signature: null, details: new Map(), dry: null, timer: null, shown: false,
  };
  const POLL = 4000;
  const $ = id => document.getElementById(id);
  const root = $("evals");
  const escape = text => String(text ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const money = value => value == null ? "—" : value === 0 ? "$0" : value >= 100 ? `$${Math.round(value).toLocaleString()}` : `$${Number(value).toFixed(2)}`;
  const duration = value => value == null ? "—" : value < 90 ? `${Math.round(value)} s` : value < 5400 ? `${Math.round(value / 60)} min` : `${(value / 3600).toFixed(1)} h`;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;
  const WORDS = { done: "done", running: "running", failed: "failed", stale: "stale", missing: "not yet run" };
  const STATUSES = ["done", "running", "failed", "stale", "missing"];
  const post = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(async response => { const answer = await response.json(); if (!response.ok) throw new Error(answer.error); return answer; });
  const units = new Map();
  const hoverable = matchMedia("(hover: hover)").matches;

  // --- loading -------------------------------------------------------------------------------

  function load() {
    fetch("evals").then(response => response.json()).then(data => {
      view.scenarios = data.scenarios;
      if (!view.name || !view.scenarios.some(item => item.name === view.name)) view.name = view.scenarios[0]?.name ?? null;
      picker();
      if (!view.name) { empty(); return; }
      explore();
    }).catch(() => studio.toast("Could not read the evaluations"));
  }

  function asked() {
    const body = { path: view.path, expanded: view.expanded };
    if (view.target) body.target = view.target;
    if (view.lanes !== null) body.lanes = view.lanes;
    if (view.change) body.change = view.change;
    return body;
  }

  let inflight = 0;
  function explore(polling = false) {
    const ticket = ++inflight;
    return post(`evals/${encodeURIComponent(view.name)}/explore`, asked()).then(page => {
      if (ticket !== inflight) return;
      if (page.deriving || (!page.columns && !page.problem)) { waiting(page); schedule(2000); return; }
      if (page.problem && !page.columns) { problem(page.problem); schedule(10000); return; }
      const changed = page.signature !== view.signature || !polling;
      view.page = page;
      view.target = page.target;
      view.lanes = page.lanes ?? "";
      view.signature = page.signature;
      summary(page);
      if (changed) render(); else live(page);
      schedule(POLL);
    }).catch(error => { if (!polling) studio.toast(error.message || "Could not read the scenario"); schedule(POLL * 2); });
  }

  function schedule(delay) {
    clearTimeout(view.timer);
    if (!view.shown) return;
    view.timer = setTimeout(() => {
      if (document.hidden) { schedule(delay); return; }
      explore(true);
    }, delay);
  }

  // --- states without a graph -----------------------------------------------------------------

  function picker() {
    $("evals-picker").innerHTML = view.scenarios.length > 1 ? view.scenarios.map(item =>
      `<button type="button" class="chip" data-scenario="${escape(item.name)}" aria-pressed="${item.name === view.name}">${escape(item.name)}</button>`).join("") : "";
  }

  function empty() {
    studio.summary("evals", "No scenarios yet");
    $("evals-body").innerHTML = '<div class="empty"><strong>No scenarios yet</strong><span>An agent starts one with <code>.nock/nock eval init NAME</code>.</span></div>';
  }

  function waiting(page) {
    studio.summary("evals", `${view.name}: reading the workflow…`);
    $("evals-body").innerHTML = `<div class="card waiting"><span class="spinner" aria-hidden="true"></span>
      <strong>Reading ${escape(view.name)}'s workflow with Snakemake</strong>
      <span class="hint">The first time takes as long as a dry run; the studio keeps what it learns and only reads it again when the workflow changes.</span>
      ${page.problem ? `<span class="hint error">${escape(page.problem)}</span>` : ""}</div>`;
  }

  function problem(text) {
    $("evals-body").innerHTML = `<div class="card"><span class="label">${escape(view.name)}</span><pre class="hint error">${escape(text)}</pre></div>`;
  }

  function summary(page) {
    const counts = page.counts;
    const steps = STATUSES.reduce((sum, status) => sum + counts[status], 0);
    const parts = [`${plural(steps, "step")}`, `${counts.done} done`];
    if (counts.running) parts.push(`${counts.running} running`);
    if (counts.failed) parts.push(`${counts.failed} failed`);
    if (counts.stale) parts.push(`${counts.stale} stale`);
    studio.summary("evals", `${view.name}${page.target ? ` · ${page.target}` : ""}: ${parts.join(" · ")}`);
  }

  // --- the page --------------------------------------------------------------------------------

  function render() {
    const page = view.page;
    hideTip(true);
    root.classList.toggle("weighing", Boolean(page.change));
    $("evals-body").innerHTML = [
      toolbar(page),
      crumbs(page),
      '<div id="evals-pinned"></div>',
      view.mode === "graph" ? graph(page) : analyses(page),
      dry(),
    ].join("");
    if (view.mode === "graph") requestAnimationFrame(wires);
    pinned();
  }

  function toolbar(page) {
    const targets = page.targets.length > 1 ? `<label class="field"><span class="label">Target</span>
      <select id="evals-target">${page.targets.map(item => `<option value="${escape(item.name)}"${item.name === page.target ? " selected" : ""}>${escape(item.name)} · ${plural(item.steps, "step")}</option>`).join("")}</select></label>` : "";
    const rows = `<label class="field"><span class="label">Rows by</span><select id="evals-lanes">
      ${page.forks.map(item => `<option value="${escape(item.name)}"${item.name === page.lanes ? " selected" : ""}>${escape(item.label)}</option>`).join("")}
      <option value=""${page.lanes ? "" : " selected"}>nothing (one row)</option></select></label>`;
    const modes = `<span class="views" role="group" aria-label="View">${["graph", "analyses"].map(mode =>
      `<button type="button" data-mode="${mode}" aria-pressed="${view.mode === mode}">${mode === "graph" ? "Graph" : `Comparisons${page.analyses.length ? ` · ${page.analyses.length}` : ""}`}</button>`).join("")}</span>`;
    return `<div class="card toolbar">${targets}${rows}${modes}<span id="evals-live">${liveHtml(page)}</span>${whatIf(page)}</div>`;
  }

  function liveHtml(page) {
    const run = page.run;
    const refreshing = page.refreshing ? " · re-reading the workflow" : "";
    if (!run) return `<span class="live" title="No Snakemake run holds this scenario's lock"><span class="pulse"></span>no run going${refreshing}</span>`;
    const names = run.running.map(item => `${item.title}${item.since ? ` (since ${item.since.slice(11, 16)})` : ""}`).join("\n");
    return `<span class="live on" title="${escape(`Running ${run.targets.join(" ") || "the default target"}\n${names}`)}"><span class="pulse"></span>running ${escape(run.targets.join(" "))} · ${run.done}/${run.total} steps · ${run.running.length} now${refreshing}</span>`;
  }

  function live(page) {
    const element = $("evals-live");
    if (element) element.innerHTML = liveHtml(page);
  }

  function whatIf(page) {
    const options = page.changes;
    const group = (label, items) => items.length ? `<optgroup label="${escape(label)}">${items.map(item => {
      const value = JSON.stringify({ kind: item.kind, name: item.name, ...(item.value != null ? { value: item.value } : {}) });
      const chosen = view.change && JSON.stringify(view.change) === value;
      return `<option value="${escape(value)}"${chosen ? " selected" : ""}>${escape(item.label)}</option>`;
    }).join("")}</optgroup>` : "";
    const change = page.change;
    const said = change ? `<span class="said"><strong>${escape(change.words)}</strong> ${change.rules.map(item => `<span class="hint">${escape(item.title)} ${item.count}</span>`).join(" · ")}</span>` : "";
    return `<div class="whatif"><span class="label">What if I change</span>
      <select id="evals-change" aria-label="What if I change"><option value="">— pick a value, an input or a file —</option>
      ${group("A parameter's value", options.values)}${group("An input the steps read (versions first)", options.inputs)}${group("A file the steps run or read", options.code)}</select>
      ${change ? '<button type="button" class="link" data-clear-change>clear</button>' : ""}${said}</div>`;
  }

  function crumbs(page) {
    const all = page.crumbs.length === 0;
    const total = STATUSES.reduce((sum, status) => sum + page.counts[status], 0);
    const items = [`<button type="button" data-crumb="-1"${all ? ' aria-current="true"' : ""}>every run <span class="count">${total}</span></button>`];
    page.crumbs.forEach((crumb, index) => {
      items.push('<span class="sep" aria-hidden="true">›</span>');
      items.push(`<button type="button" data-crumb="${index}"${index === page.crumbs.length - 1 ? ' aria-current="true"' : ""} title="${escape(crumb.label)}">${escape(crumb.label)} <span class="count">${crumb.count}</span></button>`);
    });
    const hint = all ? '<span class="hint">Click a group to follow its runs to the right; a step here widens back.</span>' : "";
    return `<nav class="crumbs" aria-label="Narrowed to">${items.join("")}${hint}</nav>`;
  }

  // --- the graph -------------------------------------------------------------------------------

  const natural = value => value === null ? [2, 0, ""] : isNaN(Number(value)) ? [1, 0, String(value)] : [0, Number(value), ""];
  const compare = (a, b) => { const x = natural(a), y = natural(b); return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2]); };

  function graph(page) {
    units.clear();
    const lanes = page.lanes;
    const values = [];
    const seen = new Set();
    for (const column of page.columns) for (const unit of column.units) {
      units.set(unit.id, unit);
      if (unit.depth === 0 && lanes && lanes in unit.filter) {
        const key = JSON.stringify(unit.filter[lanes]);
        if (!seen.has(key)) { seen.add(key); values.push({ key, value: unit.filter[lanes], label: unit.label }); }
      }
    }
    values.sort((a, b) => compare(a.value, b.value));
    const rows = Math.max(values.length, 1);
    const width = innerWidth < 720 ? 196 : 236;
    const style = `grid-template-columns: 18px repeat(${page.columns.length}, ${width}px); grid-template-rows: auto repeat(${rows}, auto);`;
    const cells = [];
    values.forEach((lane, index) => cells.push(`<span class="lane-name" style="grid-row:${index + 2};grid-column:1" title="${escape(lane.label)}">${escape(lane.label)}</span>`));
    page.columns.forEach((column, position) => {
      const at = position + 2;
      cells.push(`<div class="head" style="grid-row:1;grid-column:${at}"><h3 title="${escape(column.means)}">${escape(column.title)}</h3>
        <span class="sub">${column.count === column.of ? plural(column.count, "step") : `${column.count} of ${column.of} steps`}</span>${meter(column.counts, column.count)}</div>`);
      const byLane = new Map();
      let current = null;
      for (const unit of column.units) {
        if (unit.depth === 0) current = lanes && lanes in unit.filter ? JSON.stringify(unit.filter[lanes]) : "*";
        if (!byLane.has(current)) byLane.set(current, []);
        byLane.get(current).push(unit);
      }
      for (const [key, members] of byLane) {
        const row = key === "*" ? `2 / span ${rows}` : `${values.findIndex(lane => lane.key === key) + 2}`;
        cells.push(`<div class="cell" style="grid-row:${row};grid-column:${at}">${members.map(unitHtml).join("")}</div>`);
      }
      if (!column.units.length) cells.push(`<div class="cell" style="grid-row:2 / span ${rows};grid-column:${at}"><span class="hint">nothing here after the selection</span></div>`);
    });
    const legend = `<div class="legend">${STATUSES.map(status => `<span><span class="dot ${status}"></span>${WORDS[status]} ${page.counts[status]}</span>`).join("")}
      ${page.constant.length ? `<span>the same for every run: ${page.constant.map(item => `${escape(item.label)} ${escape(item.value)}`).join(", ")}</span>` : ""}</div>`;
    return `<div class="card graph-card"><div class="scroller" id="evals-scroller"><div class="canvas" id="evals-canvas" style="${style}">
      <svg class="wires" id="evals-wires" aria-hidden="true"></svg>${cells.join("")}</div></div>${legend}</div>`;
  }

  function meter(counts, total) {
    if (!total) return '<span class="meter" aria-hidden="true"></span>';
    return `<span class="meter" aria-hidden="true">${STATUSES.filter(status => counts[status]).map(status =>
      `<span class="${status}" style="width:${(counts[status] / total) * 100}%"></span>`).join("")}</span>`;
  }

  function countsText(unit) {
    if (unit.count === 1) {
      const status = STATUSES.find(item => unit.counts[item]);
      const numbers = unit.numbers;
      return WORDS[status] + (numbers.usd != null ? ` · ${money(numbers.usd)} · ${duration(numbers.seconds)}` : "");
    }
    const parts = [`${unit.counts.done}/${unit.count} done`];
    for (const status of ["running", "failed", "stale"]) if (unit.counts[status]) parts.push(`${unit.counts[status]} ${status}`);
    if (unit.numbers.usd != null) parts.push(`~${money(unit.numbers.usd)}`);
    return parts.join(" · ");
  }

  function unitHtml(unit) {
    const classes = ["unit", unit.depth ? "child" : "", unit.count === 1 ? "run" : "", unit.selected ? "selected" : "", unit.lineage && !unit.selected ? "lineage" : "", unit.affected ? "affected" : ""].filter(Boolean).join(" ");
    const metric = unit.numbers.metrics.filter(item => item.text !== "—").slice(0, 2).map(item => `${item.label} ${item.short || item.text}`).join(" · ");
    const split = unit.splits ? `<button type="button" class="split" data-split="${escape(unit.id)}" aria-expanded="${unit.expanded}">${unit.expanded ? "▾ fold" : `▸ by ${escape(unit.splits.label)}`}</button>`
      : unit.expanded ? `<button type="button" class="split" data-split="${escape(unit.id)}" aria-expanded="true">▾ fold</button>` : "";
    return `<div class="${classes}" style="--depth:${unit.depth}" data-unit="${escape(unit.id)}">
      ${unit.affected ? `<span class="rerun" title="steps this change reruns">↻ ${unit.affected}</span>` : ""}
      <button type="button" class="main" data-select="${escape(unit.id)}" aria-pressed="${unit.selected}" aria-label="${escape(unit.card.title)}">
        <span class="top"><span class="dot ${unit.status}"></span><strong>${escape(unit.label)}</strong>${unit.count > 1 ? `<span class="n">${unit.count}</span>` : ""}</span>
        ${unit.count > 1 ? meter(unit.counts, unit.count) : ""}
        <span class="line">${escape(countsText(unit))}</span>
        ${metric ? `<span class="line metric">${escape(metric)}</span>` : ""}
      </button>${split}</div>`;
  }

  function wires() {
    const svg = $("evals-wires");
    const canvas = $("evals-canvas");
    if (!svg || !canvas) return;
    const box = canvas.getBoundingClientRect();
    svg.setAttribute("width", canvas.scrollWidth);
    svg.setAttribute("height", canvas.scrollHeight);
    const place = new Map();
    for (const element of canvas.querySelectorAll("[data-unit]")) {
      const rect = element.getBoundingClientRect();
      place.set(element.dataset.unit, { left: rect.left - box.left, right: rect.right - box.left, middle: rect.top - box.top + Math.min(rect.height / 2, 24) });
    }
    const paths = [];
    for (const edge of view.page.edges) {
      const from = place.get(edge.from), to = place.get(edge.to);
      if (!from || !to) continue;
      const a = units.get(edge.from), b = units.get(edge.to);
      const lit = (a.selected || a.lineage) && (b.selected || b.lineage || view.page.crumbs.length);
      const width = Math.min(5, 1 + Math.log2(Math.max(edge.main, 1)) * 0.55);
      const x1 = from.right, x2 = to.left, y1 = from.middle, y2 = to.middle;
      const bend = Math.max(18, (x2 - x1) / 2);
      const d = `M${x1},${y1} C${x1 + bend},${y1} ${x2 - bend},${y2} ${x2},${y2}`;
      // A wire that leaps over a column is drawn only while one of its ends is hovered.
      const leaps = columnIndex(b.rule) - columnIndex(a.rule) > 1;
      const kind = edge.main && !leaps ? (lit ? "lit" : "") : "other";
      paths.push(`<path d="${d}" class="${kind}" stroke-width="${kind === "other" ? 1.2 : width}" data-from="${escape(edge.from)}" data-to="${escape(edge.to)}"${kind === "other" ? ' style="display:none"' : ""}><title>${edge.main} main input${edge.main === 1 ? "" : "s"}${edge.other ? `, ${edge.other} other` : ""}</title></path>`);
    }
    svg.innerHTML = paths.join("");
  }

  function lightWires(id) {
    for (const path of document.querySelectorAll("#evals-wires path")) {
      const hot = id && (path.dataset.from === id || path.dataset.to === id);
      path.classList.toggle("hot", Boolean(hot));
      if (path.classList.contains("other")) path.style.display = hot ? "" : "none";
    }
  }

  // --- the card --------------------------------------------------------------------------------

  function aboutHtml(card, extra = "") {
    const parameters = card.parameters.length ? `<dl>${card.parameters.map(item => `<dt>${escape(item.label)}</dt><dd>${escape(item.value)}</dd>`).join("")}</dl>` : "";
    const status = card.status ? `<div class="status"><span class="dot ${card.state}"></span><span>${escape(card.status)}</span></div>` : "";
    const highlights = card.highlights.length ? `<ul>${card.highlights.map(item => `<li>${escape(item)}</li>`).join("")}</ul>` : "";
    return `<div class="about"><h4>${escape(card.title)}</h4>${card.means ? `<p class="means">${escape(card.means)}</p>` : ""}${status}${parameters}${highlights}${extra}</div>`;
  }

  function filesHtml(detail) {
    if (!detail.files?.length) return "";
    return `<div><span class="label">Files${detail.readable ? "" : " (in the cache)"}</span><div class="files">${detail.files.map(file => file.directory
      ? `<button type="button" disabled title="a directory">${escape(file.name)}/</button>`
      : `<button type="button" data-file="${escape(file.name)}" data-output="${escape(detail.output)}" ${detail.readable ? "" : "disabled"}>${escape(file.name)}${file.bytes != null ? ` <span class="hint">${size(file.bytes)}</span>` : ""}</button>`).join("")}</div></div>`;
  }

  const size = bytes => bytes < 1024 ? `${bytes} B` : bytes < 1048576 ? `${Math.round(bytes / 1024)} kB` : `${(bytes / 1048576).toFixed(1)} MB`;

  function detail(output) {
    const key = `${output}@${view.signature}`;
    if (!view.details.has(key)) view.details.set(key, post(`evals/${encodeURIComponent(view.name)}/run`, { output }));
    return view.details.get(key);
  }

  let tipTimer = null, tipFor = null;
  function showTip(element, touch = false) {
    const unit = units.get(element.dataset.unit);
    if (!unit) return;
    tipFor = unit.id;
    const tip = $("evals-tip");
    const actions = touch ? `<div class="actions"><button type="button" class="button primary" data-narrow="${escape(unit.id)}">${unit.selected ? "Widen back" : "Follow these runs"}</button>
      ${unit.splits ? `<button type="button" class="button secondary" data-split="${escape(unit.id)}">${unit.expanded ? "Fold" : `Split by ${escape(unit.splits.label)}`}</button>` : ""}
      <button type="button" class="button ghost" data-close-tip>Close</button></div>` : "";
    tip.innerHTML = aboutHtml(unit.card, `<div id="evals-tip-files"></div>${actions}`);
    tip.hidden = false;
    lightWires(unit.id);
    if (!touch) {
      const rect = element.getBoundingClientRect();
      const width = tip.offsetWidth, height = tip.offsetHeight;
      let left = rect.right + 14;
      if (left + width > innerWidth - 12) left = Math.max(12, rect.left - width - 14);
      const top = Math.min(Math.max(12, rect.top - 8), innerHeight - height - 12);
      tip.style.left = `${left}px`;
      tip.style.top = `${top}px`;
    } else {
      tip.style.left = ""; tip.style.top = "";
    }
    const run = unit.count === 1 ? unit.run : null;
    if (run) detail(run).then(found => {
      if (tipFor !== unit.id) return;
      const place = $("evals-tip-files");
      if (place) place.innerHTML = filesHtml(found);
    }).catch(() => {});
  }

  function hideTip(now = false) {
    clearTimeout(tipTimer);
    const hide = () => { $("evals-tip").hidden = true; tipFor = null; lightWires(null); };
    if (now) hide(); else tipTimer = setTimeout(hide, 220);
  }

  root.addEventListener("pointerover", event => {
    if (event.pointerType !== "mouse") return;
    const tip = event.target.closest("#evals-tip");
    if (tip) { clearTimeout(tipTimer); return; }
    const element = event.target.closest("[data-unit]");
    if (!element) return;
    clearTimeout(tipTimer);
    if (tipFor === element.dataset.unit) return;
    tipTimer = setTimeout(() => showTip(element), 140);
  });
  root.addEventListener("pointerout", event => {
    if (event.pointerType !== "mouse") return;
    const leaving = event.target.closest("[data-unit], #evals-tip");
    if (!leaving || leaving.contains(event.relatedTarget)) return;
    hideTip();
  });
  root.addEventListener("focusin", event => {
    const element = event.target.closest("[data-unit]");
    if (element && hoverable) showTip(element);
  });

  // --- the run a selection pins ----------------------------------------------------------------

  function pinned() {
    const place = $("evals-pinned");
    const last = view.path[view.path.length - 1];
    if (!place || !last?.run) { if (place) place.innerHTML = ""; return; }
    detail(last.run).then(found => {
      const before = found.before.length ? `<div><span class="label">Made from</span><ul>${found.before.map(item => `<li>${escape(item.title)}</li>`).join("")}</ul></div>` : "";
      const inputs = found.inputs.length ? `<details><summary>${plural(found.inputs.length, "input")} its params carry</summary><dl>${found.inputs.map(item => `<dt>${escape(item.label)}</dt><dd>${escape(item.value)}</dd>`).join("")}</dl></details>` : "";
      place.innerHTML = `<div class="card pinned">${aboutHtml(found, `${filesHtml(found)}${before}${inputs}<p class="hint"><code>${escape(found.output)}</code></p>`)}</div>`;
    }).catch(error => { place.innerHTML = `<p class="hint error">${escape(error.message)}</p>`; });
  }

  // --- the comparisons -------------------------------------------------------------------------

  function analyses(page) {
    if (!page.analyses.length) return `<div class="card"><strong>No comparisons yet</strong><span class="hint">Declare the comparisons the scenario was run to answer in <code>evals/${escape(view.name)}/studio.json</code> (<code>"analyses": [{"step": …, "by": …, "metric": …}]</code>); until then the studio suggests one per rule whose outputs have numbers to count.</span></div>`;
    return `<div class="analyses">${page.analyses.map((item, index) => {
      const rows = item.rows.map((row, position) => `<tr tabindex="0" data-analysis="${index}" data-row="${position}" class="${row.baseline ? "base" : ""}" title="Show these runs in the graph">
        <td>${escape(row.label)}</td><td class="count">${row.x}/${row.y}</td>
        <td>${row.y && row.y <= 80 ? `<span class="pips" aria-hidden="true">${Array.from({ length: row.y }, (_, i) => `<i class="${i < row.x ? "yes" : ""}"></i>`).join("")}</span>` : ""}</td>
        <td class="small">${row.failed ? `${row.failed} failed` : ""}${row.failed && row.pending ? " · " : ""}${row.pending ? `${row.pending} to run` : ""}</td></tr>`).join("");
      const where = item.where.length ? `<span class="hint">only ${item.where.map(entry => `${escape(entry.label)} ${escape(entry.value)}`).join(", ")}</span>` : "";
      return `<section class="card analysis">${item.suggested ? '<span class="tag">suggested</span>' : ""}<h3>${escape(item.name)}</h3>
        <p class="sentence">${escape(item.sentence || "Nothing counted yet.")}</p>${where}
        <table><thead><tr><th>${escape(item.by_label)}</th><th>${escape(item.metric_label)}</th><th></th><th></th></tr></thead><tbody>${rows}</tbody></table></section>`;
    }).join("")}</div>`;
  }

  // --- a dry run -------------------------------------------------------------------------------

  function dry() {
    const answer = view.dry;
    let body = '<span class="hint">What a run would compute, restore from the cache, and why — nothing runs.</span>';
    if (answer) {
      const summary = answer.summary;
      body = `<span class="hint${answer.refused ? " error" : ""}">${escape(answer.refused || `${summary.to_compute} to compute (~${money(summary.estimated_cost_usd)}), ${summary.from_cache} from cache${summary.say ? ` — ${summary.say}` : ""}`)}</span>
        ${answer.jobs.length ? `<div class="dry" style="overflow:auto;max-height:24rem"><table><thead><tr><th>job</th><th>does</th><th>why</th></tr></thead><tbody>${answer.jobs.slice(0, 300).map(job =>
          `<tr><td><code>${escape(job.job)}</code></td><td>${escape(job.does)}</td><td>${escape(job.why || "")}</td></tr>`).join("")}</tbody></table></div>` : '<span class="hint">Nothing to do: every output is current.</span>'}`;
    }
    return `<details class="card"${answer ? " open" : ""}><summary class="label">Weigh a run</summary><div class="toolbar">
      <input id="evals-targets" placeholder="targets (default: all)" aria-label="Targets">
      <input id="evals-budget" type="number" min="0" step="0.5" placeholder="budget USD" aria-label="Budget">
      <button type="button" class="button secondary" data-dry>weigh</button></div>${body}</details>`;
  }

  // --- what a click does -----------------------------------------------------------------------

  const columnIndex = rule => view.page.columns.findIndex(column => column.rule === rule);

  function narrow(id) {
    const unit = units.get(id);
    if (!unit) return;
    const at = columnIndex(unit.rule);
    const kept = view.path.filter(item => columnIndex(item.rule) < at);
    if (!unit.selected) kept.push(unit.count === 1 && unit.run ? { rule: unit.rule, run: unit.run } : { rule: unit.rule, filter: unit.filter });
    view.path = kept;
    hideTip(true);
    explore();
  }

  function split(id) {
    view.expanded = view.expanded.includes(id) ? view.expanded.filter(item => item !== id) : [...view.expanded, id];
    hideTip(true);
    explore();
  }

  function openFile(output, name) {
    post(`evals/${encodeURIComponent(view.name)}/file`, { output, name }).then(found => {
      $("evals-viewer-name").textContent = `${name}${found.truncated ? ` — its last ${size(found.text.length)} of ${size(found.bytes)}` : ""}`;
      $("evals-viewer-text").textContent = found.text;
      $("evals-viewer").showModal();
      const pre = $("evals-viewer-text");
      if (found.truncated || /\.log$/.test(name)) pre.scrollTop = pre.scrollHeight;
    }).catch(error => studio.toast(error.message));
  }

  root.addEventListener("click", event => {
    const target = event.target.closest("button, tr[data-analysis]");
    if (!target) return;
    const data = target.dataset;
    if (data.scenario) { view.name = data.scenario; view.path = []; view.expanded = []; view.change = null; view.target = null; view.lanes = null; view.signature = null; view.dry = null; picker(); explore(); }
    else if (data.select) {
      if (!hoverable && tipFor !== data.select) { showTip(target.closest("[data-unit]"), true); return; }
      narrow(data.select);
    }
    else if (data.narrow) narrow(data.narrow);
    else if (data.split) split(data.split);
    else if ("closeTip" in data) hideTip(true);
    else if (data.crumb) { const index = Number(data.crumb); view.path = view.path.slice(0, index + 1); explore(); }
    else if (data.mode) { view.mode = data.mode; render(); }
    else if ("clearChange" in data) { view.change = null; explore(); }
    else if (data.file) openFile(data.output, data.file);
    else if ("close" in data) $("evals-viewer").close();
    else if (data.analysis) {
      const row = view.page.analyses[Number(data.analysis)].rows[Number(data.row)];
      view.mode = "graph"; view.path = row.path; explore();
    }
    else if ("dry" in data) {
      const targets = $("evals-targets").value.split(/\s+/).filter(Boolean);
      const budget = parseFloat($("evals-budget").value);
      target.disabled = true;
      post(`evals/${encodeURIComponent(view.name)}/dry`, { targets, ...(isNaN(budget) ? {} : { budget }) })
        .then(answer => { view.dry = answer; render(); }).catch(error => studio.toast(error.message || "Could not weigh it"))
        .finally(() => { target.disabled = false; });
    }
  });
  root.addEventListener("keydown", event => {
    if (event.key === "Escape") hideTip(true);
    const row = event.target.closest("tr[data-analysis]");
    if (row && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); row.click(); }
  });
  root.addEventListener("change", event => {
    const id = event.target.id;
    if (id === "evals-target") { view.target = event.target.value; view.path = []; view.expanded = []; explore(); }
    else if (id === "evals-lanes") { view.lanes = event.target.value; view.expanded = []; explore(); }
    else if (id === "evals-change") { view.change = event.target.value ? JSON.parse(event.target.value) : null; explore(); }
  });
  addEventListener("resize", () => { if (view.shown && view.mode === "graph") requestAnimationFrame(wires); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && view.shown && view.name) explore(true); });

  studio.register("evals", {
    show(route) { view.shown = true; if (route && route !== view.name) view.name = route; load(); },
    hide() { view.shown = false; clearTimeout(view.timer); hideTip(true); },
  });
})();
</script>
