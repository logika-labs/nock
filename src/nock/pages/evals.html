<style>
/* The evals tab: a scenario's rules left to right in the order they run, each with its outputs
   current, stale and failed; a rule's outputs and their numbers; a dry run; a comparison.
   Everything is scoped under .evals. */
.evals { padding-block: 20px 80px; display: grid; gap: 20px; }
.evals .picker { display: flex; flex-wrap: wrap; gap: 8px; }
.evals .chip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px;
  border: 1px solid var(--input); background: transparent; color: var(--foreground);
  font: 500 11px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase;
}
.evals .chip:hover { background: var(--card); }
.evals .chip[aria-pressed="true"] { border-color: var(--selection); color: var(--selection); background: var(--selection-tint); }
.evals .chip:focus-visible, .evals .node:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.evals .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.evals .card > .label { color: var(--muted); }
.evals code, .evals pre { font: 12px/18px var(--mono); }
.evals pre { margin: 0; background: var(--background); padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 24rem; }

/* The graph: one column per depth, scrolling sideways when the chain is long. */
.evals .graph { display: flex; gap: 28px; overflow-x: auto; padding: 4px 2px 10px; }
.evals .column { flex: 0 0 auto; min-width: 9rem; display: grid; align-content: start; gap: 8px; position: relative; }
.evals .column + .column::before { content: ""; position: absolute; left: -22px; top: 22px; width: 16px; height: 1px; background: var(--input); }
.evals .node {
  display: grid; gap: 4px; text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: inherit; font: 13px/18px var(--sans);
}
.evals .node:hover { background: var(--hover); }
.evals .node strong { font: 600 14px/20px var(--sans); }
.evals .node[aria-pressed="true"] { border-color: var(--selection); box-shadow: inset 3px 0 0 var(--selection); }
.evals .counts { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
.evals .ok { color: var(--ok); }
.evals .warn { color: var(--warning); }
.evals .bad { color: var(--error); }

.evals table { border-collapse: collapse; width: 100%; font-size: 13px; }
.evals th, .evals td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.evals th { font: 500 11px/16px var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.evals td.number { font-variant-numeric: tabular-nums; white-space: nowrap; }
.evals .bar { position: relative; height: 10px; min-width: 120px; background: var(--background); border-radius: 5px; }
.evals .bar span { position: absolute; top: 0; bottom: 0; background: color-mix(in oklab, var(--selection) 35%, transparent); border-radius: 5px; }
.evals .bar i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--selection); }
.evals .row-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.evals .hint { color: var(--muted); font-size: 13px; }
.evals .hint.error { color: var(--error); }
.evals input, .evals select { font: 13px var(--sans); padding: 4px 6px; border: 1px solid var(--input); border-radius: 6px; background: var(--card); color: var(--foreground); }
.evals .scroll { overflow-x: auto; }
@media (max-width: 560px) { .evals .column { min-width: 7.5rem; } }
</style>
<div class="frame evals" id="evals">
  <div class="picker" id="evals-picker" role="group" aria-label="Scenario"></div>
  <div id="evals-body"></div>
</div>
<script>
(() => {
  const view = { scenarios: [], name: null, rule: null, dry: null, comparison: null, by: null };
  const $ = id => document.getElementById(id);
  const escape = text => String(text ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const money = value => value == null ? "—" : `$${Number(value).toFixed(2)}`;
  const seconds = value => value == null ? "—" : value < 60 ? `${Number(value).toFixed(1)}s` : `${Math.round(value / 60)}m`;
  const scenario = () => view.scenarios.find(item => item.name === view.name);
  const post = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(async response => { const answer = await response.json(); if (!response.ok) throw new Error(answer.error); return answer; });

  function load() {
    fetch("evals").then(response => response.json()).then(data => {
      view.scenarios = data.scenarios;
      if (!view.name || !scenario()) view.name = view.scenarios[0]?.name ?? null;
      render();
    }).catch(() => studio.toast("Could not read the evaluations"));
  }

  // Each rule's depth: how many rules run before it on the longest path.
  function columns(graph) {
    const depth = {};
    const visit = rule => {
      if (rule in depth) return depth[rule];
      depth[rule] = 0;
      const before = graph.edges.filter(([, to]) => to === rule).map(([from]) => visit(from) + 1);
      return (depth[rule] = Math.max(0, ...before));
    };
    graph.rules.forEach(visit);
    const found = [];
    for (const rule of graph.rules) (found[depth[rule]] ??= []).push(rule);
    return found.filter(Boolean);
  }

  function render() {
    $("evals-picker").innerHTML = view.scenarios.length > 1 ? view.scenarios.map(item =>
      `<button type="button" class="chip" data-scenario="${escape(item.name)}" aria-pressed="${item.name === view.name}">${escape(item.name)}</button>`).join("") : "";
    const current = scenario();
    if (!current) {
      studio.summary("evals", "No scenarios yet");
      $("evals-body").innerHTML = '<div class="empty"><strong>No scenarios yet</strong><span>An agent starts one with <code>.nock/nock eval init NAME</code>.</span></div>';
      return;
    }
    if (current.problem) {
      $("evals-body").innerHTML = `<div class="card"><span class="label">${escape(current.name)}</span><p class="hint error">${escape(current.problem)}</p></div>`;
      return;
    }
    const of = rule => current.outputs.filter(item => item.rule === rule);
    const stale = current.outputs.filter(item => item.state === "stale").length;
    studio.summary("evals", `${current.name}: ${current.graph.rules.length} rules, ${current.outputs.length} outputs${stale ? `, ${stale} stale` : ""}`);
    const graph = columns(current.graph).map(rules => `<div class="column">${rules.map(rule => {
      const outputs = of(rule);
      const count = state => outputs.filter(item => item.state === state).length;
      return `<button type="button" class="node" data-rule="${escape(rule)}" aria-pressed="${rule === view.rule}"><strong>${escape(rule)}</strong>
        <span class="counts"><span class="ok">${count("current")} current</span>${count("stale") ? `<span class="warn">${count("stale")} stale</span>` : ""}${count("failed") ? `<span class="bad">${count("failed")} failed</span>` : ""}</span></button>`;
    }).join("")}</div>`).join("");
    $("evals-body").innerHTML = [
      `<div class="card"><span class="label">rules</span><div class="graph">${graph}</div></div>`,
      view.rule ? outputs(current, view.rule) : '<p class="hint">Select a rule for its outputs.</p>',
      dry(current),
      `<details class="card"><summary class="label">Snakefile</summary><pre>${escape(current.snakefile)}</pre></details>`,
    ].join("");
  }

  function outputs(current, rule) {
    const rows = current.outputs.filter(item => item.rule === rule);
    const names = [...new Set(rows.flatMap(item => Object.keys(item.parameters || {})))];
    const metrics = [...new Set(rows.flatMap(item => Object.keys(item.metrics)))];
    const table = rows.length ? `<div class="scroll"><table><thead><tr>${names.map(name => `<th>${escape(name)}</th>`).join("")}<th>state</th>${metrics.map(name => `<th>${escape(name)}</th>`).join("")}<th>cost · time</th></tr></thead><tbody>${rows.map(item =>
      `<tr>${names.map(name => `<td>${escape(item.parameters[name])}</td>`).join("")}
      <td class="${item.state === "current" ? "ok" : item.state === "stale" ? "warn" : "bad"}" title="${escape(item.why || item.error || "")}">${escape(item.state)}</td>
      ${metrics.map(name => `<td class="number">${escape(item.metrics[name] ?? "—")}</td>`).join("")}
      <td class="number">${money(item.cost_usd)} · ${seconds(item.seconds)}</td></tr>`).join("")}</tbody></table></div>` : '<span class="hint">No outputs here yet.</span>';
    const options = names.map(name => `<option${view.by === name ? " selected" : ""}>${escape(name)}</option>`).join("");
    const choices = metrics.map(name => `<option${view.comparison?.metric === name ? " selected" : ""}>${escape(name)}</option>`).join("");
    return `<div class="card"><span class="label">${escape(rule)}</span>${table}
      <div class="row-actions"><span class="hint">compare by</span><select id="evals-by" aria-label="Parameter">${options}</select>
      <select id="evals-metric" aria-label="Metric"><option value="">metric…</option>${choices}</select></div>
      ${comparison()}</div>`;
  }

  function comparison() {
    const rows = view.comparison?.rows;
    if (!rows) return "";
    if (!rows.length) return '<span class="hint">Nothing to compare yet.</span>';
    const fixed = Object.keys(rows[0]).filter(name => !["n", "mean", "low", "high", "difference", "difference_low", "difference_high", "paired", "failed"].includes(name));
    const top = Math.max(1, ...rows.map(row => Math.max(row.high ?? row.mean, row.mean)));
    const bottom = Math.min(0, ...rows.map(row => Math.min(row.low ?? row.mean, row.mean)));
    const at = value => `${((value - bottom) / (top - bottom)) * 100}%`;
    return `<div class="scroll"><table><thead><tr>${fixed.map(name => `<th>${escape(name)}</th>`).join("")}<th>n</th><th>mean [95% interval]</th><th></th><th>vs baseline</th></tr></thead><tbody>${rows.map(row =>
      `<tr>${fixed.map(name => `<td>${escape(row[name])}</td>`).join("")}<td class="number">${row.n}${row.failed ? ` (+${row.failed} failed)` : ""}</td>
      <td class="number">${row.mean}${row.low != null ? ` [${row.low}, ${row.high}]` : ""}</td>
      <td><div class="bar">${row.low != null ? `<span style="left:${at(row.low)};width:calc(${at(row.high)} - ${at(row.low)})"></span>` : ""}<i style="left:${at(row.mean)}"></i></div></td>
      <td class="number">${row.difference == null ? "baseline" : `${row.difference > 0 ? "+" : ""}${row.difference}${row.difference_low != null ? ` [${row.difference_low}, ${row.difference_high}]` : ""}${row.paired ? " paired" : ""}`}</td></tr>`).join("")}</tbody></table></div>`;
  }

  function dry(current) {
    const answer = view.dry;
    let body = '<span class="hint">What a run would compute, restore from the cache, and why.</span>';
    if (answer) {
      const summary = answer.summary;
      body = `<span class="hint${answer.refused ? " error" : ""}">${escape(answer.refused || `${summary.to_compute} to compute (~${money(summary.estimated_cost_usd)}), ${summary.from_cache} from cache${summary.say ? ` — ${summary.say}` : ""}`)}</span>
        ${answer.jobs.length ? `<div class="scroll"><table><thead><tr><th>job</th><th>does</th><th>why</th></tr></thead><tbody>${answer.jobs.map(job =>
          `<tr><td><code>${escape(job.job)}</code></td><td>${escape(job.does)}</td><td>${escape(job.why || "")}</td></tr>`).join("")}</tbody></table></div>` : '<span class="hint">Nothing to do: every output is current.</span>'}`;
    }
    return `<div class="card"><span class="label">dry run</span><div class="row-actions">
      <input id="evals-targets" placeholder="targets (default: all)" aria-label="Targets">
      <input id="evals-budget" type="number" min="0" step="0.5" placeholder="budget USD" aria-label="Budget">
      <button type="button" class="button secondary" data-dry>weigh</button></div>${body}</div>`;
  }

  const root = $("evals");
  root.addEventListener("click", event => {
    const target = event.target.closest("button");
    if (!target) return;
    if (target.dataset.scenario) { view.name = target.dataset.scenario; view.rule = null; view.dry = null; view.comparison = null; render(); }
    else if (target.dataset.rule) { view.rule = view.rule === target.dataset.rule ? null : target.dataset.rule; view.comparison = null; render(); }
    else if ("dry" in target.dataset) {
      const targets = $("evals-targets").value.split(/\s+/).filter(Boolean);
      const budget = parseFloat($("evals-budget").value);
      post(`evals/${encodeURIComponent(view.name)}/dry`, { targets, ...(isNaN(budget) ? {} : { budget }) })
        .then(answer => { view.dry = answer; render(); }).catch(error => studio.toast(error.message || "Could not weigh it"));
    }
  });
  root.addEventListener("change", event => {
    if (event.target.id === "evals-by") { view.by = event.target.value; return; }
    if (event.target.id !== "evals-metric" || !event.target.value) return;
    const metric = event.target.value;
    post(`evals/${encodeURIComponent(view.name)}/compare`, { by: (view.by = $("evals-by").value), metric, step: view.rule })
      .then(rows => { view.comparison = { metric, rows }; render(); })
      .catch(error => { view.comparison = { metric, rows: [] }; render(); studio.toast(error.message); });
  });

  studio.register("evals", { show() { load(); }, hide() {} });
})();
</script>
