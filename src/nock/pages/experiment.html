<div class="frame experiment" id="experiment-tab">

      tab.drawn = null;
      $("main").hidden = true; $("note").hidden = false;
      $("note").textContent = X.error || X.problem || "Reading the workflow… this takes as long as a dry run, once.";
      studio.summary("experiment", `${name}: ${X.problem ? "can't read it" : "reading the workflow…"}`);
      if (X.deriving) setTimeout(() => tab.shown && tab.name === name && load(name, route), 3000);
      return;
    }
    $("note").hidden = true; $("main").hidden = false;
    tab.drawn = name;
    tab.controller?.abort(); tab.controller = new AbortController();

}
// The list to choose from: each scenario, its name and the question it asks, a link to its own

      <span class="eyebrow">${esc(s.name)}</span><span class="question">${esc(s.question || s.name)}</span></a>`).join("");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// The counts under the title, as the experiment last said them.

};

  return `<section><span class="eyebrow">parameters</span><div class="params">${ps.map(({ p, about, vals }) => {
    if (vals.length === 1) return `<div class="param fixed${vals[0].st === "incomplete" ? " dim" : ""}"><div class="ph"><span class="pn"><b>${esc(nameP(p))}</b>: ${esc(vals[0].label)}</span>${mark(vals[0].st)}<span class="pa">${esc(about || "")}</span></div></div>`;
    const on = view.filter?.param === p, key = `param:${p}`, isOpen = folded(key, false) || on;
    return `<div class="param${isOpen ? " on" : ""}"><button class="ph" data-toggle data-key="${key}" aria-expanded="${isOpen}"><span class="pn"><b>${esc(nameP(p))}</b><span class="sep"> · </span>${vals.length} values</span>${vals.some(x => x.st === "outdated") ? staleIcon() : ""}${CHEV}<span class="pa">${esc(about || "")}</span></button>
      <div class="values"${isOpen ? "" : " hidden"}>${vals.map(x => { const sel = on && view.filter.value === x.v;
        return `<button class="value${sel ? " on" : ""}${x.st === "incomplete" ? " dim" : ""}" data-value="${esc(p)}|${esc(x.v)}" aria-pressed="${sel}" title="${sel ? "Show every value" : "Show only runs with this value"}"><span class="t">${esc(x.label)}</span>${x.note ? `<span class="note">${esc(x.note)}</span>` : ""}${mark(x.st)}</button>`; }).join("")}</div></div>`;
  }).join("")}</div></section>`;
}
const costHtml = ss => `<section><span class="eyebrow">time and cost</span><p>${ss.length ? tc(ss) : "Hasn't run."}</p></section>`;
function stagePanel(n, note) {
  const s = ST[n.stage], ss = visible(n.id), why = [...new Set(ss.filter(x => x.why).map(x => x.why))];
  shell("stage", s.name, `${where(n, note)}
    <section><p>${esc(s.about)}</p>${why.map(w => `<p class="small warn">${esc(w)}</p>`).join("")}</section>
    ${paramsHtml(n)}
    <section><span class="eyebrow">runs · ${runsAt(n.id).length}</span>${runList(n.id)}</section>
    ${costHtml(ss)}`);
}
const reads = n => { const ps = ST[NODE[n.parent].stage]; return `It reads the ${esc(n.reads)} of ${esc(ps.name.toLowerCase())}${ps.scorer ? `: ${esc(ps.scorer.about.toLowerCase().replace(/\.$/, ""))}` : ""}.`; };
// A decision: its condition, then the runs grouped by the branch they took.
function decisionPanel(n, note) {
  const ds = visible(n.id), kids = KIDS.get(n.id) || [];
  const by = n.branches.map(br => { const kid = kids.find(k => k.via.branch === br.id), c = count(live(ds), s => s.branch === br.id);
    const head = br.verdict ? `${verdictIcon(br.verdict, true)}<span>${c}</span>` : `<span>${esc(br.label)} · then ${esc(nameOf(kid))} · ${c}</span>`;
    return `<section><span class="eyebrow brh">${head}</span>${runList(n.id, s => s.branch === br.id)}</section>`; }).join("");
  shell("decision", n.label, `${where(n, note)}<section><span class="eyebrow">the condition</span><p>${esc(n.condition)}</p><p class="small muted">${reads(n)}</p>${n.changed ? `<p class="small warn">${esc(n.changed)}</p>` : ""}</section>${by}`);
}

// --- a run at a node: when, its results, then where it went -------------------------------------------
function candidates(n) {
  const cands = all(n.id).filter(s => TRAJ.has(s.id) && passFilter(s) && repsOk(s, s.reps.length - 1)).sort(byRep);
  const L = cands.length ? cands[0].reps.length - 1 : -1, many = cands.length > 1;
  const sel = many && L >= 0 && view.reps[L] ? view.reps[L] : null;
  return { cands, L, many, sel, shown: sel ? cands.filter(s => sel.includes(s.reps[L])) : cands };
}
// The iterations shown: a multiselect, where none picked means all of them.
function toggleIter(v) {
  const { L, cands } = candidates(NODE[view.at]); if (L < 0) return;
  const every = cands.map(s => s.reps[L]);
  let cur = view.reps[L] ? [...view.reps[L]] : [];
  cur = cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v].sort((a, b) => a - b);
  view.reps = view.reps.slice(0, L); while (view.reps.length < L) view.reps.push(null);
  view.reps[L] = cur.length && cur.length < every.length ? cur : null;
  keepOpen = true; render(false);
}
function iterSelect({ cands, sel, L }) {
  const label = !sel ? `${cands.length} iterations` : sel.map(x => `#${x}`).join(", ");
  return `<div class="sel"><button class="sel-b" aria-haspopup="listbox" aria-expanded="false">${label}${CHEV}</button>
    <div class="sel-l" role="listbox" aria-multiselectable="true" hidden>${cands.map(s => { const it = s.reps[L], on = !!sel?.includes(it);
      return `<button role="option" data-iter="${it}" aria-selected="${on}"><span class="box">${on ? "✓" : ""}</span><span>#${it}${s.score ? ` · <b>${scoreText(s.score)}</b>` : ""}</span></button>`; }).join("")}</div></div>`;
}
// --- results, by type: one iteration as it is; several as a summary where they add up, else one at a time ---
function patchHtml(p) { return `<pre class="patch">${esc(p).split("\n").map(l => /^(diff|index|---|\+\+\+|@@)/.test(l) ? `<span class="hd">${l}</span>` : l.startsWith("+") ? `<span class="add">${l}</span>` : l.startsWith("-") ? `<span class="del">${l}</span>` : l + "\n").join("")}</pre>`; }
const DOES = { look: "looked", change: "changed", test: "tested", finish: "finished", say: "said" };
const ONE = {
  facts: f => `<dl class="kv">${Object.entries(f).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`,
  text: t => `<div class="said">${esc(t)}</div>`,
  list: a => a.length ? a.map(x => `<div class="alarm">${esc(x)}</div>`).join("") : `<p class="small">None.</p>`,
  checks: c => `<div class="checks">${c.map(x => `<div><span class="${x.pass ? "ok" : "bad"}">${x.pass ? "✓" : "✗"}</span> ${esc(x.name)}</div>`).join("")}</div>`,
  patch: p => p.startsWith("diff") ? patchHtml(p) : `<p class="small muted">${esc(p)}</p>`,
  steps: r => !Array.isArray(r) ? `<pre class="patch">${esc(JSON.stringify(r, null, 2))}</pre>` : `<div class="steps">${r.map(x => `<div><span class="muted">${time(x.at / 60)}</span><b>${DOES[x.do] || x.do}</b><code title="${esc(x.text)}">${esc(String(x.text ?? "").split("\n")[0])}</code></div>`).join("")}</div>`,
};
const stats = (xs, of = "") => xs.length === 1 || d3.min(xs) === d3.max(xs) ? `<b>${num(xs[0])}</b>${of} in every iteration` : `median <b>${num(d3.median(xs))}</b>${of} · ±${num(d3.deviation(xs))} · ${num(d3.min(xs))} to ${num(d3.max(xs))}`;
const isNum = v => v !== "" && !isNaN(+String(v).replace(/[$,%]/g, ""));
const ALL = {
  facts: fs => { const keys = [...new Set(fs.flatMap(f => Object.keys(f)))];
    return `<dl class="kv">${keys.map(k => { const vs = fs.map(f => f[k]).filter(v => v != null), same = vs.every(v => v === vs[0]);
      return `<dt>${esc(k)}</dt><dd>${same ? esc(vs[0]) : vs.every(isNum) ? stats(vs.map(v => +String(v).replace(/[$,%]/g, ""))) : vs.map(esc).join(" · ")}</dd>`; }).join("")}</dl>`; },
  checks: cs => { const names = [...new Set(cs.flatMap(c => c.map(x => x.name)))];
    return `<div class="checks">${names.map(nm => { const k = cs.filter(c => c.find(x => x.name === nm)?.pass).length;
      return `<div><span class="${k === cs.length ? "ok" : k ? "" : "bad"}">${k}/${cs.length}</span> ${esc(nm)}</div>`; }).join("")}</div>`; },
};
// One result: its name (click to fold it away), the iteration rotator on the same line, its description, then it.
function block(key, name, about, body, ss) {
  const isOpen = folded(key, true), names = ss ? ss.map(s => `#${repOf(s)}`) : null;
  const rot = names ? `<span class="rot-h"><button data-step="-1" aria-label="Previous iteration">‹</button><span class="rot-n">${names[0]}</span><button data-step="1" aria-label="Next iteration">›</button></span>` : "";
  return `<div class="result${names ? " rot" : ""}"${names ? ` data-names="${names.join(",")}"` : ""}><div class="line"><button class="rt" data-res="${esc(key)}" aria-expanded="${isOpen}">${CHEV}<span>${esc(name)}</span></button>${rot}</div>
    <div class="rbody"${isOpen ? "" : " hidden"}><p class="about">${esc(about)}</p><div class="val">${body}</div></div></div>`;
}
const RESULTS = new Map(), WANTED = new Set();
let fetching = null;
function want(ss) {
  for (const s of ss) if (!RESULTS.has(s.id) && !s.id.includes("?")) WANTED.add(s.id);
  if (!WANTED.size || fetching) return;
  const outputs = [...WANTED]; WANTED.clear();
  fetching = fetch(`experiment/${encodeURIComponent(X.name)}/results`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ outputs }), signal })
    .then(r => r.json()).then(found => { for (const id of outputs) RESULTS.set(id, found[id] || {}); })
    .catch(() => { for (const id of outputs) RESULTS.set(id, {}); })
    .finally(() => { fetching = null; if (!signal.aborted) render(false); });
}
function resultsHtml(ss, stageId) {
  const missing = ss.filter(s => !RESULTS.has(s.id));
  if (missing.length) { want(missing); return `<p class="small muted">Reading the results…</p>`; }
  for (const s of ss) s.results = RESULTS.get(s.id);
  const stage = ST[stageId], many = ss.length > 1, out = [], sc = stage.scorer, scored = ss.filter(s => s.score);
  for (const s of ss.filter(s => s.status === "incomplete")) out.push(`<p class="small warn">${many ? `#${repOf(s)}: ` : ""}${esc(s.why || "It didn't finish.")}</p>`);
  if (sc && scored.length) { const ofs = scored[0].score.of != null ? ` of ${scored[0].score.of}` : "";
    out.push(block(`res:${stageId}:score`, sc.name, `${sc.about} ${sc.better === "higher" ? "Higher" : "Lower"} is better.`, `<p>${many ? stats(scored.map(s => s.score.value), ofs) : `<b>${num(scored[0].score.value)}</b>${ofs}`}</p>`)); }
  for (const r of stage.results) {
    const k = r.kind, f = `${r.kind}:${r.name}`, have = ss.filter(s => s.results?.[f] != null); if (!have.length || !ONE[k]) continue;
    const key = `res:${stageId}:${f}`, at = s => s.results[f];
    if (have.length === 1) out.push(block(key, r.name, r.about, ONE[k](at(have[0]))));
    else if (ALL[k]) out.push(block(key, r.name, r.about, ALL[k](have.map(at))));
    else out.push(block(key, r.name, r.about, have.map((s, i) => `<div class="rot-p"${i ? " hidden" : ""}>${ONE[k](at(s))}</div>`).join(""), have));
  }
  return out.join("");
}
// When: one result, from the run's start to reaching it; several, from the first start to the last finish.
function whenHtml(r, ss) {
  if (!ss.length) return "";
  const cached = ss.filter(s => s.run !== r.id);
  if (cached.length) return `<p class="small">Cached from an earlier run, ${pathKv(runPairs(RUN[cached[0].run]))}, made ${stamp(cached[0].started)}.</p><dl class="kv">${madeBy(cached)}</dl>`;
  return `<dl class="kv">${madeBy(ss)}<dt>started</dt><dd>${stamp(d3.min(ss, s => s.started))}</dd><dt>finished</dt><dd>${stamp(d3.max(ss, s => s.finished))}</dd></dl>`;
}
function runPanel(n) {
  const r = RUN[view.run], c = candidates(n), { many, shown } = c;
  let res;
  if (n.kind === "stage") {
    res = `<section><div class="line"><span class="eyebrow">when</span>${many ? iterSelect(c) : ""}</div>${whenHtml(r, shown)}</section>
      <section><span class="eyebrow">results</span>${resultsHtml(shown, n.stage)}</section>`;
  } else {
    res = `<section><div class="line"><span class="eyebrow">the condition</span>${many ? iterSelect(c) : ""}</div><p>${esc(n.condition)}</p>
      <div class="here">${shown.map(s => tookLine(n, s, shown.length > 1)).join("")}</div>
      ${n.changed && shown.some(s => s.status === "outdated") ? `<p class="small warn">${esc(n.changed)}</p>` : ""}</section>`;
  }
  // Where it went: one button per stage or decision that came next.
  const nexts = shown.flatMap(s => X.states.filter(k => k.parent === s.id && fits(k)));
  const items = d3.groups(nexts, k => k.node).map(([kn, ks]) => ({ open: kn, reps: ks.length === 1 && ks[0].reps.length ? ks[0].reps : null, note: ks.every(x => x.status === "outdated") ? "stale" : "" }));
  // A run whose decision now takes a branch it hasn't gone down yet: that branch's stage comes next, not run yet.
  if (n.kind === "decision") for (const s of shown) { const kid = (KIDS.get(n.id) || []).find(k => k.via.branch === s.branch);
    if (kid?.kind === "stage" && !nexts.some(k => k.parent === s.id && k.node === kid.id)) items.push({ open: kid.id, reps: s.reps.length ? s.reps : null, note: "not run yet" }); }
  const stop = shown.find(s => s.status === "incomplete");
  const nextHtml = items.length ? `<section class="ctas">${items.map(it => `<button class="cta${it.note ? " quiet" : ""}" data-open="${esc(it.open)}"${it.reps ? ` data-reps='${JSON.stringify(it.reps)}'` : ""}>${esc(nameOf(NODE[it.open]))}${it.note ? ` · ${it.note}` : ""} →</button>`).join("")}</section>`
    : stop ? `<section><p class="small warn">Stopped here: ${esc(stop.why || "it didn't finish")}</p></section>` : "";
  shell(n.kind, nameOf(n), `${where(n)}${res}${nextHtml}`);
}

// --- following a run, filtering by a value: shown on the graph, with a way back --------------------
function overlays() {
  const box = $("overlays"), out = [];
  if (view.filter && !view.run) out.push(`<div class="banner dark"><span>Only runs with ${kv(view.filter.param, view.filter.value)}</span><button class="x" id="xp-x-filter" aria-label="Show every value">✕</button></div>`);
  if (view.run) {
    const r = RUN[view.run], narrowed = view.reps.filter(Boolean);
    out.push(`<div class="banner dark follow"><span>Following ${pathKv(runPairs(r))}${narrowed.length ? `${SEP}<span class="rep"><span>${narrowed.map(x => x.map(i => `#${i}`).join(", ")).join(" › ")}</span><button id="xp-x-rep" aria-label="Show every iteration">✕</button></span>` : ""}</span><button class="x" id="xp-x-run" aria-label="Back to the overview">✕</button></div>`);
  }
  box.innerHTML = out.join("");
  if ($("x-filter")) $("x-filter").onclick = () => setFilter(null);
  if ($("x-run")) $("x-run").onclick = unfollow;
  if ($("x-rep")) $("x-rep").onclick = () => { view.reps = []; render(false); };
}
// The address: the run, then the iterations kept at each level of iteration ("all" for every one).
function hash() {
  const h = view.run ? [view.run, ...view.reps.map(x => x ? x.join("x") : "all")].join("--") : "";
  if (!tab.shown) return;
  try { history.replaceState(null, "", `#experiment/${encodeURIComponent(X.name)}${h ? "/" + h : ""}`); } catch (e) { /* the frame may refuse */ }
}
function fromHash(raw) {
  const h = decodeURIComponent(raw || ""); if (!h) return;
  const r = X.runs.find(x => h === x.id || h.startsWith(x.id + "--")); if (!r) return;
  follow(r.id, null, h.slice(r.id.length).split("--").filter(Boolean).map(x => x === "all" ? null : x.split("x").map(Number)));
}

// --- the measures: how the variants compare ---------------------------------------------------------
const below = id => [id, ...(KIDS.get(id) || []).flatMap(k => below(k.id))];
function measureOf(m, variant) {
  const nodes = X.nodes.filter(n => variantOf(n) === variant);
  if (m.decision) {
    const ds = nodes.filter(n => n.kind === "decision" && n.label === m.decision);
    if (!ds.length) return null;
    // A control (the clean twin) is no case: a measure counts the cases only.
    const ss = live(ds.flatMap(n => all(n.id))).filter(s => !s.control);
    if (!ss.length) return { none: true };
    return { text: count(ss, s => s.branch === m.branch), ss, incomplete: nodes.some(n => all(n.id).some(s => s.status === "incomplete")) };
  }
  if (m.cost) {
    // Everything after the variant's values fork by the pooled parameter, value by value and
    // iteration by iteration (what is made once for a value counts in each of its iterations).
    const starts = nodes.filter(n => pooled(n) && !nodes.some(o => pooled(o) && o !== n && below(o.id).includes(n.id)));
    const under = new Set(starts.flatMap(n => below(n.id)));
    const ss = X.states.filter(s => under.has(s.node) && cases(m.over)(s.params[m.over])), per = [];
    if (!ss.length) return { none: true };
    for (const [, xs] of d3.rollups(ss, xs => xs, s => s.params[m.over])) {
      const its = [...new Set(xs.map(s => s.reps[0]).filter(x => x != null))];
      if (!its.length) per.push(sumBy(xs, s => s.usd));
      for (const r of its) per.push(sumBy(xs.filter(s => s.reps[0] == null || s.reps[0] === r), s => s.usd));
    }
    return { per, med: d3.median(per), lo: d3.min(per), hi: d3.max(per), cost: true };
  }
}
function measureCell(m, v) {
  if (!v) return `<span class="v muted">—<span class="sub">doesn't apply</span></span>`;
  if (v.none) return `<span class="v muted">not run<span class="sub">no results yet</span></span>`;
  if (v.cost) return `<span class="v">${cost(v.med)}<span class="sub">median, ${cost(v.lo)} to ${cost(v.hi)}</span></span>`;
  const reps = new Set(v.ss.map(s => s.reps[0]).filter(x => x != null)).size;
  return `<span class="v">${v.text}<span class="sub">${reps > 1 ? `over ${reps} iterations` : "one iteration"}${v.incomplete ? " · incomplete" : ""}</span></span>`;
}
function measures() {
  const box = $("measures"); box.style.setProperty("--cols", VARIANTS.length);
  box.innerHTML = `<div class="mrow head"><span>measure</span>${VARIANTS.map(v => `<span>${esc(v)}</span>`).join("")}</div>` +
    X.measures.map(m => `<button class="mrow${view.measure === m.id ? " on" : ""}" data-measure="${m.id}"><span class="name">${esc(m.name)}<span class="sub">${m.better} is better</span></span>${VARIANTS.map(v => measureCell(m, measureOf(m, v))).join("")}</button>`).join("");
  box.querySelectorAll("[data-measure]").forEach(b => b.onclick = () => go(() => { view.measure = b.dataset.measure; view.at = null; }));
}
function measurePanel(m) {
  const vals = VARIANTS.map(v => [v, measureOf(m, v)]).filter(([, x]) => x);
  const per = vals.map(([v, x]) => `<dt>${esc(v)}</dt><dd>${x.none ? "not run" : x.cost ? `median ${cost(x.med)}, ${cost(x.lo)} to ${cost(x.hi)}` : x.text}</dd>`).join("");
  let grid = "";
  if (m.decision && m.over) {
    // Value by value: one mark per iteration, ✓ when it took the measured branch.
    const cols = vals.filter(([, x]) => !x.none).map(([v]) => v), keys = P[m.over].values.filter(v => !P[m.over].controls.includes(v.id));
    const cell = (v, b) => { const ss = measureOf(m, v).ss.filter(s => s.params[m.over] === b.id).sort((a, c) => (a.reps[0] ?? 0) - (c.reps[0] ?? 0));
      if (!ss.length) return `<span class="cell"><i class="dot" style="border:1.5px solid #cdcad9"></i></span>`;
      return `<span class="cell">${ss.map(s => `<button data-run="${esc(s.run)}" data-at="${esc(s.node)}" data-reps='${JSON.stringify(s.reps)}' aria-label="${esc(b.label)}, ${esc(v)}, #${s.reps[0]}">${verdictIcon(s.branch === m.branch ? "good" : "bad", true)}</button>`).join("")}</span>`; };
    grid = `<section><span class="eyebrow">${esc(m.over)} by ${esc(m.over)} · one mark per iteration</span><p class="small muted">Click a mark to follow that run.</p>
      <div class="grid" style="--cols:${cols.length}"><div class="gr head"><span>${esc(m.over)}</span>${cols.map(v => `<span>${esc(v)}</span>`).join("")}</div>${keys.map(b => `<div class="gr"><span title="${esc(b.label)}">${esc(b.label)}</span>${cols.map(v => cell(v, b)).join("")}</div>`).join("")}</div></section>`;
  }
  shell("measure", m.name, `<section class="first"><p>${esc(m.about)}</p><dl class="kv">${per}</dl></section>${grid}`);
}

$("question").textContent = X.question;
tellStudio(`${X.name}: ${X.runs.length} runs, ${X.states.length} results`);
svg.on("click", () => { if (panel.classList.contains("open")) closePanel(); });
panel.classList.remove("open"); stack.length = 0;
build(); fit();
// Open on the first step, a little in from the left and level with the middle.
{ const first = DN.find(d => !d.parent); if (first) zoom.translateTo(svg, POS[first.id].x - 140 + win.clientWidth / 2, POS[first.id].y); }
render(false); fromHash(route);
}
})();
</script>
