title = "Instrument"
summary = "Split the code into areas, one agent each, instrumenting it and writing its rules until `logika map` leaves each item closed or with its reason."
relevant = "Logika projects: logika.json at the root."
requires = { files = ["logika.json"], commands = ["logika"] }

[due]
# Due once `logika map`'s open items (events no rule reads, verdict-only
# events) grew by 5 since the last run.
measure = "python"
threshold = 5


[material.instrument]
python = "instrument"

[lead]
reads = ["instrument"]
writes = ["report.md"]

[[agents]]
name = "instrument"
reads = ["instrument"]
changes = ["the code of its area", "its own entries in logika.json"]
fan_out = "each area of the code"

[end]
commit = ["logika.json"]
kinds = ["validate", "path", "timeout", "rule", "invariant", "error", "reason", "instrumentation", "other"]
