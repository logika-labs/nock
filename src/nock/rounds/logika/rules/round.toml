title = "Rules"
summary = "Give each event no rule reads its rule over its values, or a reason, and each verdict-only event the values it decided on, from logika map."
relevant = "Logika projects: logika.json at the root."
requires = { files = ["logika.json"], commands = ["logika"] }

[due]
# Due once `logika map`'s open items (events no rule reads, verdict-only
# events) grew by 5 since the last run.
measure = "python"
threshold = 5


[material.rules]
python = "rules"

[lead]
reads = ["rules"]
writes = ["report.md"]

[[agents]]
name = "rules"
reads = ["rules"]
fan_out = "each directory logika map shows open items in"

[end]
commit = ["logika.json"]
kinds = ["validate", "path", "timeout", "rule", "invariant", "error", "reason", "instrumentation", "other"]
