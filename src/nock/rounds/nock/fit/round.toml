title = "Fit"
summary = "Judge how nock serves this project, set up the rounds that fit it, and keep its memory."
relevant = "Every project with nock."

[due]
# Due at once where it never ran (it sets up the other rounds), then after
# 10 agent sessions since the last run.
measure = "sessions"
threshold = 10


[material.evidence]
python = "evidence"

[material.catalogue]
python = "catalogue"

[material.knowledge]
python = "knowledge"

[lead]
reads = ["evidence", "catalogue", "knowledge"]
writes = ["report.md", "share.md"]
share = "share.md"

[[agents]]
name = "fit"
reads = ["evidence", "catalogue", "knowledge"]

[end]
checks = ["nock-share", "nock-memory"]
quick = ["nock-share", "nock-memory"]
kinds = ["recommend", "rounds", "memory", "other"]
commit = [".nock/config.toml"]
