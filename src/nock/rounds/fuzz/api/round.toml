title = "API fuzzing"
summary = "Send edge-case inputs to every route of the project's API on a local server, and report each 5xx, wrong acceptance, leak, hang or broken state."
relevant = "Projects that serve an HTTP API they can run locally, best with an OpenAPI description."
agents = []

[due]
# Due on any change to the API's schema, or once 300 lines changed in route
# code (the fit round names it; until it does, all source).
measure = "lines"
paths = ["**/*.py", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.rs", "**/*.go", "**/*.rb", "**/*.java", "**/*.kt", "**/*.swift", "**/*.c", "**/*.cpp", "**/*.cs", "**/*.php"]
any = ["**/openapi*.json", "**/openapi*.yaml", "**/openapi*.yml", "**/swagger*.json"]
threshold = 300


[material.past]
records = 5

[lead]
reads = ["past"]
writes = ["report.md"]

[end]
kinds = ["error", "accepted", "leak", "hang", "state", "other"]
