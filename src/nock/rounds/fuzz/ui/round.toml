title = "UI fuzz"
summary = "Drive every page and dialog of the web UI with odd input, sizes, themes and states; report each break."
relevant = "Projects with a web UI that runs locally against a dev stack."
requires = { commands = ["node"] }
agents = []

[due]
# Due once 300 lines changed in the web UI.
measure = "lines"
paths = ["**/*.tsx", "**/*.jsx", "**/*.vue", "**/*.svelte", "**/*.css", "**/*.scss", "**/*.html"]
threshold = 300


[material.earlier]
records = 5

[lead]
reads = ["earlier"]
writes = ["report.md"]

[end]
kinds = ["layout", "overflow", "console", "crash", "error", "accessibility", "state", "other"]
