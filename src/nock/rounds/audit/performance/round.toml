title = "Performance"
summary = "Measure what users wait for, find what costs the most, and report each finding with its measurement."
relevant = "Projects whose speed users feel: a server, a pipeline or scheduled job, a CLI, or a web app."
agents = []

[due]
# Due once 1,500 lines of source changed since the last run.
measure = "lines"
paths = ["**/*.py", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.rs", "**/*.go", "**/*.rb", "**/*.java", "**/*.kt", "**/*.swift", "**/*.c", "**/*.cpp", "**/*.cs", "**/*.php"]
threshold = 1500


[material.earlier]
records = 5

[lead]
reads = ["earlier"]
writes = ["report.md"]

[end]
kinds = ["latency", "throughput", "query", "memory", "startup", "bundle", "other"]
